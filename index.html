    <style>
        :root {
            /* Smooth transitions & curves */
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);

            /* Atmospheric Deep Night Blue Sky */
            --sky-gradient: radial-gradient(ellipse at 50% 12%, #182548 0%, #101934 40%, #090e20 80%, #060914 100%);
            --text-main: #ffffff;
            --text-muted: #9998b3;

            /* Seamless Panels: No background, no border in idle state (matches user request) */
            --panel-bg: transparent;
            --panel-border: transparent;
            --panel-border-hover: rgba(255, 255, 255, 0.24);
            
            --corner-radius: 24px;
        }

        body.light-mode {
            /* Atmospheric Clean Daytime Sky Blue (Light Mode) */
            --sky-gradient: radial-gradient(ellipse at 50% 20%, #dbeafe 0%, #edf4fc 50%, #f8fafc 100%);
            --text-main: #0c1c30;
            --text-muted: #3d5e82;

            /* Seamless Panels (Light Mode) */
            --panel-bg: transparent;
            --panel-border: transparent;
            --panel-border-hover: rgba(12, 28, 48, 0.22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background: var(--sky-gradient) !important;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 36px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 95%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           ATMOSPHERIC 3D SKY LAYER (STARS & CLOUDS)
           ------------------------------------------------------------- */
        .sky-scene {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* High-Quality Night Sky Stars Layer (Dark Mode Only) */
        .stars-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s var(--ease-smooth);
            opacity: 1;
        }

        body.light-mode .stars-layer {
            opacity: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff6d6;
            box-shadow: 0 0 6px rgba(255, 238, 180, 0.8), 0 0 12px rgba(255, 218, 120, 0.4);
            animation: starTwinkle 3.6s infinite ease-in-out alternate;
        }

        /* Distributed across night sky — STRICTLY KEPT CLEAR of top-left (s. brand area) */
        .star-1  { width: 3px;   height: 3px;   top: 8%;  left: 52%; animation-delay: 0s; }
        .star-2  { width: 4px;   height: 4px;   top: 14%; left: 78%; animation-delay: 1.1s; }
        .star-3  { width: 2.5px; height: 2.5px; top: 9%;  left: 91%; animation-delay: 2.2s; }
        .star-4  { width: 3.5px; height: 3.5px; top: 24%; left: 64%; animation-delay: 0.7s; }
        .star-5  { width: 2px;   height: 2px;   top: 22%; left: 42%; animation-delay: 1.8s; }
        .star-6  { width: 4px;   height: 4px;   top: 36%; left: 88%; animation-delay: 2.9s; }
        .star-7  { width: 3px;   height: 3px;   top: 48%; left: 7%;  animation-delay: 0.5s; }
        .star-8  { width: 2.5px; height: 2.5px; top: 68%; left: 12%; animation-delay: 1.4s; }
        .star-9  { width: 3.5px; height: 3.5px; top: 82%; left: 18%; animation-delay: 2.7s; }
        .star-10 { width: 3px;   height: 3px;   top: 75%; left: 85%; animation-delay: 1.9s; }
        .star-11 { width: 4px;   height: 4px;   top: 86%; left: 68%; animation-delay: 0.9s; }
        .star-12 { width: 2px;   height: 2px;   top: 56%; left: 94%; animation-delay: 3.1s; }
        .star-13 { width: 3px;   height: 3px;   top: 18%; left: 84%; animation-delay: 1.6s; }
        .star-14 { width: 2.5px; height: 2.5px; top: 32%; left: 48%; animation-delay: 2.4s; }
        .star-15 { width: 3px;   height: 3px;   top: 62%; left: 55%; animation-delay: 1.2s; }

        @keyframes starTwinkle {
            0%   { transform: scale(0.8);  opacity: 0.4; }
            50%  { transform: scale(1.25); opacity: 0.95; }
            100% { transform: scale(0.85); opacity: 0.55; }
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 18px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .top-nav-bar, main, footer {
            position: relative;
            z-index: 1;
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1s var(--ease-smooth) backwards;
        }

        .top-nav-bar { animation-delay: 0.04s; }
        main { animation-delay: 0.14s; }
        footer { animation-delay: 0.24s; }

        /* -------------------------------------------------------------
           TOP NAVIGATION: 's.' BRAND PILL WITH PEACH DOT
           ------------------------------------------------------------- */
        .top-nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        /* 's.' brand link directly on background */
        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-start;
            height: auto;
            padding: 0 4px;
            background-color: transparent;
            border: none;
            text-decoration: none !important;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1.2px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            transition: transform 0.55s var(--ease-smooth);
        }

        /* 's' font color follows device theme */
        .brand-letter {
            color: var(--text-main);
            transition: color 0.8s var(--ease-smooth);
            line-height: 1;
        }

        /* Round full stop '.' rendered as a pure CSS circle — sits right at the baseline */
        .brand-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ff9e79 !important;
            border-radius: 50% !important;
            margin-left: 2px;
            margin-bottom: 0 !important;
            vertical-align: -1px;
            flex-shrink: 0;
            line-height: 1;
            transition: background-color 0.8s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:focus-within,
        .brand-pill:active,
        .brand-pill.is-pill-lifted {
            transform: translate3d(0, -5px, 0) scale3d(1.02, 1.02, 1);
            box-shadow: none !important;
        }

        /* -------------------------------------------------------------
           MAIN CENTERED SECTION: PANELS GRID
           ------------------------------------------------------------- */
        main {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 0;
        }

        .apple-panels-grid {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 24px;
            width: 100%;
            max-width: 540px;
        }

        /* -------------------------------------------------------------
           DESKTOP & LAPTOP & IPAD:
           Vertical Apple-Style Panels — Matching Calories Panel Size (240x350)
           Idle: Seamless zero bg, zero border (matching site background)
           Hover & Touch: Smooth -6px lift, border-only reveals, no horizontal shrink
           ------------------------------------------------------------- */
        .apple-panel {
            width: 240px;
            min-width: 240px;
            max-width: 240px;
            height: 350px;
            min-height: 350px;
            aspect-ratio: 1 / 1.46;
            flex-shrink: 0;
            background-color: transparent !important;
            border: 1px solid transparent !important;
            border-radius: var(--corner-radius);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 28px 20px 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            text-decoration: none !important;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box;
            
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            /* Smooth lift-up and border transition matching nutrition homepage */
            transition: transform 0.45s var(--ease-smooth), 
                        border-color 0.35s var(--ease-smooth), 
                        background-color 0.4s var(--ease-smooth) !important;
        }

        /* Panel Header Text: Tag + Main Title Only */
        .panel-header-text {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .panel-tag {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-tag.study-tag { color: #0080FF; }
        .panel-tag.nutrition-tag { color: #72b528; }

        .panel-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1.1;
            transition: color 0.8s var(--ease-smooth);
        }

        /* Central Floating Artwork Display (No Drop Shadow on Icons) */
        .panel-artwork-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 0 8px 0;
        }

        .panel-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.55s var(--ease-smooth);
        }

        /* Removed all drop-shadows from icons for a clean vector finish */
        .panel-icon-wrap svg {
            width: 90px;
            height: 90px;
            filter: none !important;
            -webkit-filter: none !important;
            transition: transform 0.55s var(--ease-smooth);
        }

        body.light-mode .panel-icon-wrap svg {
            filter: none !important;
            -webkit-filter: none !important;
        }

        /* Hover: ONLY BORDER APPEARS, NO HORIZONTAL SCALING */
        @media (hover: hover) and (pointer: fine) {
            .apple-panel:hover {
                transform: translate3d(0, -6px, 0) !important;
                border-color: var(--panel-border-hover) !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            .apple-panel:hover .panel-icon-wrap {
                transform: scale3d(1.05, 1.05, 1);
            }

            .footer-links-row a:hover .nav-text,
            .brand-pill:hover .nav-text {
                transform: scale3d(1.05, 1.05, 1) !important;
            }
        }

        /* Touch / tap: ONLY BORDER APPEARS with smooth lift — NO HORIZONTAL SHRINK */
        .apple-panel:active,
        .apple-panel.is-card-lifted {
            transform: translate3d(0, -6px, 0) !important;
            border-color: var(--panel-border-hover) !important;
            background-color: transparent !important;
            box-shadow: none !important;
        }

        .apple-panel:active .panel-icon-wrap,
        .apple-panel.is-card-lifted .panel-icon-wrap {
            transform: scale3d(1.05, 1.05, 1) !important;
        }

        .brand-pill.is-card-lifted .nav-text,
        .footer-links-row a.is-card-lifted .nav-text {
            transform: scale3d(1.06, 1.06, 1) !important;
        }

        /* -------------------------------------------------------------
           FOOTER
           ------------------------------------------------------------- */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 18px; 
            width: 100%; 
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.7; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.8s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted) !important; }
        .footer-links-row a:hover .nav-text { color: var(--text-main) !important; }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        .kinetic-locked-frame { pointer-events: none !important; }
        .kinetic-locked-frame .nav-text {
            transition: none !important;
            -webkit-transition: none !important;
        }

        /* -------------------------------------------------------------
           MOBILE BREAKPOINT (< 700px):
           Sleek Vertical Rectangles Matching Calories Panel & Nutrition Workspace
           ------------------------------------------------------------- */
        @media (max-width: 700px) {
            body {
                padding: 26px 18px 20px 18px;
                justify-content: flex-start !important;
                gap: 20px;
            }
            footer { margin-top: auto; }
            .top-nav-bar { margin-bottom: 0; }
            .brand-pill { font-size: 36px; padding: 0 2px; }
            .brand-dot { width: 7px; height: 7px; vertical-align: -1px; }

            /* Centered main area */
            main {
                justify-content: center !important;
                align-items: center !important;
                padding: 12px 0 !important;
                flex-grow: 1 !important;
            }

            .apple-panels-grid {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 16px;
                width: 100%;
                max-width: 100%;
            }

            /* Sleek Vertical Panels matching Calories Panel & Nutrition Workspace */
            .apple-panel {
                width: 210px !important;
                min-width: 210px !important;
                max-width: 210px !important;
                height: 320px !important;
                min-height: 320px !important;
                aspect-ratio: 1 / 1.48 !important;
                padding: 24px 16px 20px 16px !important;
                border-radius: 20px !important;
                flex-shrink: 0 !important;
                flex-direction: column !important;
                align-items: stretch !important;
                justify-content: space-between !important;
            }

            .panel-header-text {
                gap: 4px;
                text-align: left;
                align-items: flex-start;
            }

            .panel-tag {
                font-size: 10px;
                letter-spacing: 0.8px;
                line-height: 1.2;
            }

            .panel-title {
                font-size: 22px !important;
                line-height: 1.1;
            }

            .panel-artwork-stage {
                padding: 8px 0;
            }

            .panel-icon-wrap svg {
                width: 80px !important;
                height: 80px !important;
            }
        }

        /* Instant landing helper */
        html.instant-landing .brand-pill,
        html.instant-landing footer {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
            will-change: auto !important;
        }

        html.instant-landing,
        html.instant-landing body,
        html.instant-landing main,
        html.instant-landing * {
            transition: none !important;
            transition-duration: 0s !important;
        }
    </style>
</head>

    <!-- Interactive Navigation & Automatic System Theme Engine -->
    <script>
        // -------------------------------------------------------------
        // 1. AUTOMATIC DEVICE THEME DETECTOR
        // -------------------------------------------------------------
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        function applyDeviceTheme() {
            if (systemLightQuery.matches) {
                bodyElement.classList.add('light-mode');
                document.documentElement.classList.add('light-mode');
            } else {
                bodyElement.classList.remove('light-mode');
                document.documentElement.classList.remove('light-mode');
            }
        }

        applyDeviceTheme();
        systemLightQuery.addEventListener('change', applyDeviceTheme);

        // Reset breadcrumbs on home page so subsequent navigation starts fresh
        try {
            sessionStorage.removeItem('breadcrumbTrail');
        } catch (e) {}

        // -------------------------------------------------------------
        // 2. BRAND PILL TACTILE LIFT & RECOIL (0.55s ANIMATION)
        // -------------------------------------------------------------
        const brandPill = document.getElementById('brandPill');
        if (brandPill) {
            brandPill.addEventListener('pointerdown', () => {
                brandPill.classList.add('is-pill-lifted');
            });

            brandPill.addEventListener('pointerup', () => {
                if (!brandPill.matches(':hover')) {
                    brandPill.classList.remove('is-pill-lifted');
                }
            });

            brandPill.addEventListener('pointerleave', () => {
                brandPill.classList.remove('is-pill-lifted');
            });
        }

        // -------------------------------------------------------------
        // 3. CLICK INTERACTIONS & FLUID WAVE TRANSITIONS
        // -------------------------------------------------------------
        const cards = Array.from(document.querySelectorAll('.apple-panel'));

        cards.forEach((card) => {
            card.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('javascript:')) return;

                e.preventDefault();

                cards.forEach(l => {
                    l.classList.remove('is-wave-loading');
                    l.classList.remove('is-card-lifted');
                });

                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');

                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        const otherTargetLinks = document.querySelectorAll('footer .footer-links-row a, .brand-pill');
        otherTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('javascript:')) return;

                e.preventDefault();
                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');
                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight;
                requestAnimationFrame(() => {
                    if (brandPill) brandPill.classList.remove('is-pill-lifted');
                    document.querySelectorAll('.is-wave-loading, .is-card-lifted').forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('is-card-lifted');
                    });
                });
            });

            if (window.location.search.includes('tf=1') || window.location.href.includes(':~:text=')) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
                return;
            }

            const savedTargetUrl = sessionStorage.getItem('activeUniversalTargetUrl');
            if (savedTargetUrl) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
            }
        });
    </script>
    <script src="/script.js"></script>
