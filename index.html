<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sathya.</title>

    <meta name="description" content="Personal workspace for study notes, resources, and current affairs.">

    <script>
      const favicon = document.getElementById('favicon');

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Smooth transitions & curves */
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #88888e;
            --panel-bg: rgba(18, 18, 21, 0.82);
            --panel-border: rgba(255, 255, 255, 0.08);
            --header-bg: #1a231e;
            --header-border: #222c26;
            
            /* 3D Container Variables (Dark) */
            --myspace-bg: rgba(17, 17, 20, 0.72);
            --myspace-border: rgba(255, 255, 255, 0.09);
            --myspace-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            --card-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            --card-shadow-hover: 0 28px 56px rgba(0, 0, 0, 0.6);
            --card-border-hover: rgba(255, 255, 255, 0.22);

            --emblem-bg: rgba(255, 255, 255, 0.035);
            --emblem-border: rgba(255, 255, 255, 0.08);
            --pill-bg: rgba(255, 255, 255, 0.05);
            --pill-border: rgba(255, 255, 255, 0.1);
            --pill-text: #a0a0aa;

            /* Vertical cascade parameters */
            --cascade-distance: 24px;
            --cascade-duration-exit: 0.2s;
            --cascade-duration-entry: 0.28s;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #73737a;
            --panel-bg: rgba(255, 255, 255, 0.88);
            --panel-border: rgba(0, 0, 0, 0.07);
            --header-bg: #e9ebe6;
            --header-border: #d4d8cf;
            
            /* 3D Container Variables (Light) */
            --myspace-bg: rgba(245, 245, 240, 0.75);
            --myspace-border: rgba(0, 0, 0, 0.08);
            --myspace-shadow: 0 30px 60px rgba(0, 0, 0, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-shadow-hover: 0 24px 48px rgba(0, 0, 0, 0.11);
            --card-border-hover: rgba(0, 0, 0, 0.18);

            --emblem-bg: rgba(0, 0, 0, 0.03);
            --emblem-border: rgba(0, 0, 0, 0.07);
            --pill-bg: rgba(0, 0, 0, 0.04);
            --pill-border: rgba(0, 0, 0, 0.08);
            --pill-text: #66666f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 24px 40px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 95%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* 3D Ambient Space Canvas */
        .ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.75;
            transition: opacity 0.8s var(--ease-smooth);
        }

        body.light-mode .ambient-canvas {
            opacity: 0.55;
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 24px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        header, main, footer {
            position: relative;
            z-index: 1;
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1.1s var(--ease-smooth) backwards;
        }

        header { animation-delay: 0.04s; }
        main { animation-delay: 0.14s; }
        footer { animation-delay: 0.24s; }

        /* HEADER BASE */
        header {
            position: relative;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-radius: 28px;
            width: 100%;
            height: 72px;
            margin: 0 auto 50px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            touch-action: manipulation;
            
            will-change: transform, box-shadow, border-color;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) header {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header:hover,
        header:focus-within,
        header:active,
        header.is-header-lifted {
            transform: translate3d(0, -5px, 0) scale3d(1.012, 1.012, 1);
            border-color: #1E1E1E;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }

        body.light-mode header:hover,
        body.light-mode header:focus-within,
        body.light-mode header:active,
        body.light-mode header.is-header-lifted {
            border-color: #b8b8bc;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.09);
        }

        .header-inner-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        #headerMainView {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
            z-index: 2;
        }

        #headerSearchView {
            opacity: 0;
            transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0);
            pointer-events: none;
            z-index: 1;
        }

        header.state-search #headerMainView {
            animation: skyfallExit var(--cascade-duration-exit) ease-in both;
            pointer-events: none;
        }
        header.state-search #headerSearchView {
            animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both;
            animation-delay: var(--cascade-duration-exit);
            pointer-events: auto;
        }

        header.state-main #headerSearchView {
            animation: skyfallExit var(--cascade-duration-exit) ease-in both;
            pointer-events: none;
        }
        header.state-main #headerMainView {
            animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both;
            animation-delay: var(--cascade-duration-exit);
            pointer-events: auto;
        }

        @keyframes skyfallExit {
            0% { transform: translate3d(0, 0, 0); opacity: 1; }
            100% { transform: translate3d(0, var(--cascade-distance), 0); opacity: 0; }
        }

        @keyframes skyfallEntry {
            0% { transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }

        .header-right-cluster,
        .search-control-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            height: 100%;
        }

        .logo {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
            text-decoration: none !important;
            transition: color 0.8s var(--ease-smooth);
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            flex-shrink: 0;
            transition: opacity 0.2s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        .ctrl-btn:hover { opacity: 0.6; }

        .ctrl-btn svg,
        .search-static-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.8s var(--ease-smooth);
        }

        .search-static-icon {
            opacity: 0.4;
            flex-shrink: 0;
        }

        .search-core-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            padding: 0 16px;
            width: 100%;
            min-width: 0;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: color 0.8s var(--ease-smooth);
        }

        .clear-text-btn svg { opacity: 0.4; }
        .close-search-btn svg { opacity: 0.7; }

        .theme-toggle {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            user-select: none;
            display: block;
            flex-shrink: 0;
        }

        .theme-toggle svg {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform-origin: center center;
            will-change: transform, opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transition: transform 0.8s var(--ease-smooth), opacity 0.8s var(--ease-smooth), stroke 0.8s var(--ease-smooth);
        }

        .theme-toggle .sun-icon { opacity: 0; transform: rotate(-90deg) scale(0.4); }
        .theme-toggle .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .moon-icon { opacity: 0; transform: rotate(90deg) scale(0.4); }

        /* 3D INTERACTIVE MAIN STAGE */
        main {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 60px;
            perspective: 1200px;
            -webkit-perspective: 1200px;
        }

        .myspace-container {
            width: 100%;
            max-width: 720px;
            background-color: var(--myspace-bg);
            border: 1px solid var(--myspace-border);
            border-radius: 36px;
            padding: 38px 36px 42px 36px;
            box-shadow: var(--myspace-shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            will-change: transform;
            transition: background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth), 
                        box-shadow 0.8s var(--ease-smooth);
        }

        /* Minimal Header within My Space Container */
        .myspace-header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        .myspace-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: var(--pill-text);
            margin-bottom: 12px;
            transform: translateZ(16px);
            -webkit-transform: translateZ(16px);
            transition: color 0.8s var(--ease-smooth), background-color 0.8s var(--ease-smooth);
        }

        .badge-pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2dd4bf;
            box-shadow: 0 0 10px rgba(45, 212, 191, 0.7);
            animation: pulseGlow 2.4s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 14px rgba(45, 212, 191, 0.9); }
        }

        .myspace-title {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--text-main);
            transform: translateZ(22px);
            -webkit-transform: translateZ(22px);
            transition: color 0.8s var(--ease-smooth);
        }

        .myspace-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 22px;
            width: 100%;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        /* 3D INTERACTIVE CARDS */
        .myspace-card {
            flex: 1 1 calc(50% - 11px);
            min-width: 220px;
            max-width: 310px;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            text-decoration: none !important;
            box-shadow: var(--card-shadow);
            touch-action: manipulation;
            cursor: pointer;
            overflow: hidden;
            
            will-change: transform, box-shadow, border-color;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            /* Damped smooth transition */
            transition: transform 0.5s var(--ease-smooth), 
                        box-shadow 0.5s var(--ease-smooth), 
                        border-color 0.5s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        /* Dynamic Specular Sheen Layer */
        .card-sheen {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            mix-blend-mode: overlay;
            transition: opacity 0.4s var(--ease-smooth);
            will-change: background, opacity;
        }

        body.light-mode .card-sheen {
            mix-blend-mode: soft-light;
        }

        /* Subtle Ambient Glow Behind Card */
        .card-ambient-glow {
            position: absolute;
            inset: -20px;
            border-radius: 36px;
            pointer-events: none;
            opacity: 0;
            z-index: -1;
            filter: blur(28px);
            transition: opacity 0.5s var(--ease-smooth);
        }

        .myspace-card[data-card="study"] .card-ambient-glow {
            background: radial-gradient(circle, rgba(0, 128, 255, 0.22) 0%, transparent 70%);
        }

        .myspace-card[data-card="nutrition"] .card-ambient-glow {
            background: radial-gradient(circle, rgba(120, 200, 50, 0.22) 0%, transparent 70%);
        }

        /* 3D Elevated Card Content Layers */
        .card-3d-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            z-index: 2;
        }

        /* Floating 3D Emblem Pod */
        .myspace-card-icon {
            width: 76px;
            height: 76px;
            border-radius: 22px;
            background: var(--emblem-bg);
            border: 1px solid var(--emblem-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transform: translateZ(40px);
            -webkit-transform: translateZ(40px);
            will-change: transform;
            transition: transform 0.5s var(--ease-smooth), background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .myspace-card-icon svg {
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.18));
            transition: transform 0.5s var(--ease-spring);
        }

        /* Text Block */
        .card-text-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 4px;
            transform: translateZ(28px);
            -webkit-transform: translateZ(28px);
        }

        .myspace-card-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.3px;
            transition: color 0.8s var(--ease-smooth);
        }

        .myspace-card-desc {
            font-size: 12.5px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: -0.1px;
            transition: color 0.8s var(--ease-smooth);
        }

        /* Minimal Interactive Action Pill */
        .card-action-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 999px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            font-size: 12px;
            font-weight: 500;
            color: var(--pill-text);
            margin-top: 6px;
            transform: translateZ(24px);
            -webkit-transform: translateZ(24px);
            transition: background 0.3s var(--ease-smooth), 
                        border-color 0.3s var(--ease-smooth), 
                        color 0.3s var(--ease-smooth), 
                        transform 0.4s var(--ease-smooth);
        }

        .card-action-pill svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.3s var(--ease-smooth);
        }

        /* Hover States for Desktop */
        @media (hover: hover) and (pointer: fine) {
            .myspace-card:hover {
                border-color: var(--card-border-hover);
                box-shadow: var(--card-shadow-hover);
            }

            .myspace-card:hover .card-sheen {
                opacity: 1;
            }

            .myspace-card:hover .card-ambient-glow {
                opacity: 0.9;
            }

            .myspace-card:hover .myspace-card-icon {
                transform: translateZ(52px) scale3d(1.06, 1.06, 1);
            }

            .myspace-card:hover .card-action-pill {
                color: var(--text-main);
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.22);
            }

            body.light-mode .myspace-card:hover .card-action-pill {
                background: rgba(0, 0, 0, 0.08);
                border-color: rgba(0, 0, 0, 0.16);
            }

            .myspace-card:hover .card-action-pill svg {
                transform: translateX(3px);
            }

            .footer-links-row a:hover .nav-text,
            .logo:hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
            }
        }

        /* Tactile Press State */
        .myspace-card:active,
        .myspace-card.is-card-lifted {
            border-color: var(--card-border-hover) !important;
            box-shadow: var(--card-shadow-hover) !important;
        }

        .myspace-card.is-card-lifted .card-ambient-glow {
            opacity: 1 !important;
        }

        .myspace-card.is-card-lifted .myspace-card-icon {
            transform: translateZ(46px) scale3d(1.04, 1.04, 1) !important;
        }

        .footer-links-row a.is-card-lifted .nav-text,
        .logo.is-card-lifted .nav-text {
            transform: scale3d(1.06, 1.06, 1) !important;
        }

        /* FOOTER */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            width: 100%; 
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.6; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.8s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted) !important; }
        .footer-links-row a:hover .nav-text { color: var(--text-main) !important; }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;

    <!-- Interactive 3D Physics Engine & Ambient Stardust -->
    <script>
        // -------------------------------------------------------------
        // 1. LIGHTWEIGHT 3D AMBIENT STARDUST CANVAS
        // -------------------------------------------------------------
        (function initAmbient3DCanvas() {
            const canvas = document.getElementById('ambientCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width = 0, height = 0;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);
            let animationFrameId = null;
            let isVisible = true;

            const particles = [];
            const PARTICLE_COUNT = 42;
            const FOV = 420;

            let mouseX = 0, mouseY = 0;
            let targetMouseX = 0, targetMouseY = 0;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }

            // Initialize 3D points in spatial volume
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: (Math.random() - 0.5) * 1400,
                    y: (Math.random() - 0.5) * 900,
                    z: Math.random() * 800 + 100,
                    radius: Math.random() * 1.6 + 0.8,
                    baseAlpha: Math.random() * 0.45 + 0.25,
                    vx: (Math.random() - 0.5) * 0.18,
                    vy: (Math.random() - 0.5) * 0.18
                });
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas, { passive: true });

            window.addEventListener('pointermove', (e) => {
                targetMouseX = (e.clientX - width / 2) * 0.25;
                targetMouseY = (e.clientY - height / 2) * 0.25;
            }, { passive: true });

            document.addEventListener('visibilitychange', () => {
                isVisible = !document.hidden;
                if (isVisible && !animationFrameId) {
                    render();
                }
            });

            function render() {
                if (!isVisible) {
                    animationFrameId = null;
                    return;
                }

                ctx.clearRect(0, 0, width, height);

                // Damped camera follow
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                const isLight = document.body.classList.contains('light-mode');
                const particleRgb = isLight ? '80, 80, 95' : '185, 215, 255';
                const lineRgb = isLight ? '100, 100, 115' : '150, 185, 240';

                const projectedPoints = [];

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const p = particles[i];

                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < -700) p.x = 700;
                    if (p.x > 700) p.x = -700;
                    if (p.y < -450) p.y = 450;
                    if (p.y > 450) p.y = -450;

                    const adjX = p.x - mouseX * (1 - p.z / 900);
                    const adjY = p.y - mouseY * (1 - p.z / 900);
                    const scale = FOV / (FOV + p.z);

                    const screenX = width / 2 + adjX * scale;
                    const screenY = height / 2 + adjY * scale;

                    if (screenX >= -20 && screenX <= width + 20 && screenY >= -20 && screenY <= height + 20) {
                        const alpha = p.baseAlpha * scale * (isLight ? 0.45 : 0.8);
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, Math.max(0.6, p.radius * scale), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${particleRgb}, ${alpha})`;
                        ctx.fill();

                        projectedPoints.push({ x: screenX, y: screenY, z: p.z, alpha: alpha });
                    }
                }

                // Micro constellation filaments between close pairs
                for (let i = 0; i < projectedPoints.length; i++) {
                    for (let j = i + 1; j < projectedPoints.length; j++) {
                        const p1 = projectedPoints[i];
                        const p2 = projectedPoints[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 100) {
                            const lineAlpha = (1 - dist / 100) * 0.12 * Math.min(p1.alpha, p2.alpha);
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(${lineRgb}, ${lineAlpha})`;
                            ctx.lineWidth = 0.75;
                            ctx.stroke();
                        }
                    }
                }

                animationFrameId = requestAnimationFrame(render);
            }

            render();
        })();

        // -------------------------------------------------------------
        // 2. 3D TILT PHYSICS & SPECULAR SHEEN FOR CARDS & STAGE
        // -------------------------------------------------------------
        (function init3DTiltPhysics() {
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReducedMotion) return;

            const container = document.getElementById('myspaceContainer');
            const cards = document.querySelectorAll('.myspace-card');

            let stageRotX = 0, stageRotY = 0;
            let targetStageRotX = 0, targetStageRotY = 0;

            const cardStates = new Map();

            cards.forEach(card => {
                const sheen = card.querySelector('.card-sheen');
                cardStates.set(card, {
                    element: card,
                    sheen: sheen,
                    rotX: 0,
                    rotY: 0,
                    targetRotX: 0,
                    targetRotY: 0,
                    sheenX: 50,
                    sheenY: 50,
                    isHovered: false
                });

                card.addEventListener('pointerenter', () => {
                    const state = cardStates.get(card);
                    if (state) state.isHovered = true;
                });

                card.addEventListener('pointermove', (e) => {
                    const state = cardStates.get(card);
                    if (!state) return;

                    const rect = card.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width; // 0 to 1
                    const y = (e.clientY - rect.top) / rect.height; // 0 to 1

                    // Tilt range: ±10 degrees
                    state.targetRotX = (0.5 - y) * 16;
                    state.targetRotY = (x - 0.5) * 16;
                    state.sheenX = x * 100;
                    state.sheenY = y * 100;
                });

                card.addEventListener('pointerleave', () => {
                    const state = cardStates.get(card);
                    if (!state) return;
                    state.isHovered = false;
                    state.targetRotX = 0;
                    state.targetRotY = 0;
                });
            });

            // Container Macroscopic 3D Parallax Tracking
            window.addEventListener('pointermove', (e) => {
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const normX = (e.clientX - cx) / cx; // -1 to 1
                const normY = (e.clientY - cy) / cy; // -1 to 1

                targetStageRotY = normX * 4.5;
                targetStageRotX = -normY * 4.5;
            }, { passive: true });

            window.addEventListener('pointerleave', () => {
                targetStageRotX = 0;
                targetStageRotY = 0;
            });

            let time = 0;

            function update3DPhysics() {
                time += 0.02;

                // Subtle organic idle float when no mouse interaction
                const idleFloatX = Math.sin(time) * 0.8;
                const idleFloatY = Math.cos(time * 0.8) * 0.8;

                // Stage smooth lerp
                stageRotX += (targetStageRotX + idleFloatX - stageRotX) * 0.08;
                stageRotY += (targetStageRotY + idleFloatY - stageRotY) * 0.08;

                if (container) {
                    container.style.transform = `rotateX(${stageRotX.toFixed(2)}deg) rotateY(${stageRotY.toFixed(2)}deg)`;
                }

                // Individual cards smooth lerp
                cardStates.forEach(state => {
                    const lerpFactor = state.isHovered ? 0.12 : 0.07;
                    state.rotX += (state.targetRotX - state.rotX) * lerpFactor;
                    state.rotY += (state.targetRotY - state.rotY) * lerpFactor;

                    const liftZ = state.isHovered ? 16 : 0;
                    state.element.style.transform = `perspective(1000px) rotateX(${state.rotX.toFixed(2)}deg) rotateY(${state.rotY.toFixed(2)}deg) translateZ(${liftZ}px)`;

                    if (state.sheen && state.isHovered) {
                        const sheenIntensity = document.body.classList.contains('light-mode') ? 0.14 : 0.18;
                        state.sheen.style.background = `radial-gradient(circle 240px at ${state.sheenX}% ${state.sheenY}%, rgba(255, 255, 255, ${sheenIntensity}), transparent 75%)`;
                    }
                });

                requestAnimationFrame(update3DPhysics);
            }

            requestAnimationFrame(update3DPhysics);
        })();

        // -------------------------------------------------------------
        // 3. HEADER SEARCH & PALETTE THEME CONTROLLER
        // -------------------------------------------------------------
        const toggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        const masterHeader = document.getElementById('masterHeader');
        const openSearchBtn = document.getElementById('openSearchBtn');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const searchCoreInput = document.getElementById('searchCoreInput');

        function handleHeaderLeaveOrBlur(isExplicitClose = false) {
            const isSearchActive = masterHeader.classList.contains('state-search');
            if (isSearchActive) {
                const isEmpty = searchCoreInput.value.trim() === "";
                if (isEmpty || isExplicitClose) {
                    masterHeader.classList.remove('state-search');
                    masterHeader.classList.add('state-main');
                    searchCoreInput.value = "";
                }
            }
            searchCoreInput.blur();
            masterHeader.classList.remove('is-header-lifted');
        }

        masterHeader.addEventListener('pointerdown', (e) => {
            masterHeader.classList.add('is-header-lifted');
            if (masterHeader.classList.contains('state-search')) {
                if (document.activeElement !== searchCoreInput && e.target !== closeSearchBtn && e.target !== clearSearchBtn) {
                    searchCoreInput.focus({ preventScroll: true });
                }
            }
        });

        masterHeader.addEventListener('pointerleave', () => {
            if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                handleHeaderLeaveOrBlur(false);
            } else {
                searchCoreInput.blur();
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        masterHeader.addEventListener('pointerup', () => {
            if (document.activeElement !== searchCoreInput && !masterHeader.matches(':hover')) {
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        document.addEventListener('pointerdown', (e) => {
            if (!masterHeader.contains(e.target)) {
                if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                    handleHeaderLeaveOrBlur(false);
                } else {
                    searchCoreInput.blur();
                    masterHeader.classList.remove('is-header-lifted');
                }
            }
        });

        function applyTargetPalette() {
            const activeSessionOverride = sessionStorage.getItem('dashboard-theme');
            if (activeSessionOverride) {
                if (activeSessionOverride === 'light') {
                    bodyElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                }
            } else {
                if (systemLightQuery.matches) {
                    bodyElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                }
            }
        }

        applyTargetPalette();

        systemLightQuery.addEventListener('change', (e) => {
            sessionStorage.removeItem('dashboard-theme');
            if (e.matches) {
                bodyElement.classList.add('light-mode');
            } else {
                bodyElement.classList.remove('light-mode');
            }
        });

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isCurrentlyLight = bodyElement.classList.contains('light-mode');
            if (isCurrentlyLight) {
                bodyElement.classList.remove('light-mode');
                sessionStorage.setItem('dashboard-theme', 'dark');
            } else {
                bodyElement.classList.add('light-mode');
                sessionStorage.setItem('dashboard-theme', 'light');
            }
        });

        openSearchBtn.addEventListener('click', () => {
            masterHeader.classList.remove('state-main');
            masterHeader.classList.add('state-search');
            masterHeader.classList.add('is-header-lifted');
            searchCoreInput.focus({ preventScroll: true });
        });

        clearSearchBtn.addEventListener('click', () => {
            searchCoreInput.value = "";
            searchCoreInput.focus();
        });

        closeSearchBtn.addEventListener('click', () => {
            handleHeaderLeaveOrBlur(true);
        });

        searchCoreInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && searchCoreInput.value.trim() === "") {
                handleHeaderLeaveOrBlur(true);
            }
        });

        // -------------------------------------------------------------
        // 4. SEAMLESS WAVE NAVIGATION & STATE RESTORATION
        // -------------------------------------------------------------
        const universalTargetLinks = document.querySelectorAll('footer .footer-links-row a, .logo, .myspace-card');

        universalTargetLinks.forEach(link => {
            if (!link.querySelector('.nav-text')) {
                const wrapper = document.createElement('span');
                wrapper.className = 'nav-text';
                while (link.firstChild) {
                    wrapper.appendChild(link.firstChild);
                }
                link.appendChild(wrapper);
            }
        });

        universalTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('#')) return;

                e.preventDefault();

                universalTargetLinks.forEach(l => {
                    l.classList.remove('is-wave-loading');
                    l.classList.remove('is-card-lifted');
                });

                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');

                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight;
                requestAnimationFrame(() => {
                    masterHeader.classList.remove('is-header-lifted');
                    universalTargetLinks.forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('is-card-lifted');
                        l.classList.remove('kinetic-locked-frame');
                        const span = l.querySelector('.nav-text');
                        if (span) {
                            span.style.transform = '';
                            span.style.opacity = '';
                            span.style.background = '';
                            span.style.webkitBackgroundClip = '';
                            span.style.webkitTextFillColor = '';
                        }
                    });
                });
            });

            if (window.location.search.includes('tf=1') || window.location.href.includes(':~:text=')) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
                return;
            }

            const savedTargetUrl = sessionStorage.getItem('activeUniversalTargetUrl');
            if (savedTargetUrl) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
            }
        });
    </script>
    <script src="/script.js"></script>
</body>
</html>
