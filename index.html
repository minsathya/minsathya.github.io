    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);

            /* Theme Tokens: Dark Mode Default */
            --bg-color: #0b0b0b;
            --panel-color: #121212;
            --panel-bg: #121212;
            --text-main: #ffffff;
            --text-sub: #a0a0a5;
            --text-muted: #888888;
            --border-color: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.04);
            --panel-border-hover: rgba(255, 255, 255, 0.11);
            --shadow-base: 0 4px 30px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 25px 60px rgba(0, 0, 0, 0.8);
            --row-divider: #1c1c1c;
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --panel-color: #ffffff;
            --panel-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            --text-muted: #8e8e93;
            --border-color: rgba(0, 0, 0, 0.04);
            --panel-border: rgba(0, 0, 0, 0.04);
            --panel-border-hover: rgba(0, 0, 0, 0.10);
            --shadow-base: 0 4px 20px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 20px 45px rgba(0, 0, 0, 0.08);
            --row-divider: #f2f2f7;
        }

        html {
            background-color: var(--bg-color);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 36px 24px;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.4s var(--ease-smooth), color 0.4s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           MASTER ENTRANCE ANIMATION (0.65s SLIDE UP FADE)
           ------------------------------------------------------------- */
        @keyframes masterEntrance {
            0% {
                opacity: 0;
                transform: translate3d(0, 28px, 0) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        .master-entrance-run {
            animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            will-change: transform, opacity;
        }

        .top-nav-bar { animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both; }
        main { animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
        footer { animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.26s both; }

        /* -------------------------------------------------------------
           TOP NAVIGATION: 's' BRANDMARK WITH TWINKLING STAR
           ------------------------------------------------------------- */
        .top-nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            height: auto;
            padding: 0 4px;
            background-color: transparent;
            border: none;
            text-decoration: none !important;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: -0.8px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            transform: translateZ(0);
            transition: transform 0.45s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:active {
            transform: translate3d(0, -3px, 0) scale3d(1.02, 1.02, 1);
        }

        .brand-letter {
            color: var(--text-main);
            transition: color 0.4s var(--ease-smooth);
            line-height: 1;
        }

        /* Round Twinkling Star (Scales small to large in #ff9e79 with soft glow) */
        .brand-star {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff9e79;
            box-shadow: 0 0 6px rgba(255, 158, 121, 0.75), 0 0 12px rgba(255, 158, 121, 0.4);
            margin-left: 2px;
            margin-bottom: 0;
            vertical-align: -1px;
            flex-shrink: 0;
            line-height: 1;
            transform-origin: center center;
            animation: roundStarPulse 3s infinite ease-in-out alternate;
        }

        @keyframes roundStarPulse {
            0% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
            50% {
                transform: scale(1.0) translateZ(0);
                opacity: 1;
                box-shadow: 0 0 8px rgba(255, 158, 121, 0.85), 0 0 14px rgba(255, 158, 121, 0.45);
            }
            100% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
        }

        /* -------------------------------------------------------------
           MAIN STUDY SECTION: MATRIX CANVAS (5 CAPSULE PANELS)
           ------------------------------------------------------------- */
        main {
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px 0 36px 0;
        }

        .bento-container,
        .matrix-canvas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
            max-width: 1040px;
            align-items: stretch;
            margin: 0 auto;
        }

        /* ---------------------------------------------------- */
        /* 10/10 PANEL CARD HOVER ENGINE                        */
        /* ---------------------------------------------------- */
        .bento-card,
        .capsule-panel {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px;
            min-height: 220px;
            box-shadow: var(--shadow-base);
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            box-sizing: border-box;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        background-color 0.4s ease,
                        border-color 0.4s ease;
        }

        /* Outer panel stays stationary on hover (NO ZOOM / NO LIFT) */
        @media (hover: hover) and (pointer: fine) {
            body:not(.popup-active) .bento-card:hover,
            body:not(.popup-active) .capsule-panel:hover {
                transform: none !important;
                box-shadow: var(--shadow-hover);
                border-color: var(--panel-border-hover);
            }

            /* Inner content layer: words slide up smoothly when hovering the card */
            body:not(.popup-active) .bento-card:hover .card-parallax-content,
            body:not(.popup-active) .capsule-panel:hover .card-parallax-content {
                transform: translateY(-6px) translateZ(0);
            }
        }

        /* Mobile / Touch: stationary (NO LIFT / NO ZOOM) */
        @media (hover: none), (pointer: coarse) {
            .bento-card:active,
            .capsule-panel:active {
                transform: none !important;
            }
        }

        /* Inner isolated contents container wrapper */
        .card-parallax-content {
            transform: translateY(0);
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* ---------------------------------------------------- */
        /* CARD TYPOGRAPHY                                      */
        /* ---------------------------------------------------- */
        .bento-card h2,
        .capsule-panel h2,
        .panel-title {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: -0.4px;
            color: var(--text-main);
            line-height: 1.2;
        }

        .list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Restored: 16px font size, normal weight (not bold) */
        .list-item {
            font-size: 16px !important;
            font-weight: 400 !important;
            color: var(--text-main);
            opacity: 0.85;
            transition: opacity 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                        color 0.25s ease;
            text-decoration: none !important;
            display: inline-block;
            width: fit-content;
        }

        /* Sibling muting ONLY when hovering a specific link/word */
        @media (hover: hover) and (pointer: fine) {
            .list-wrapper:has(.list-item:hover) .list-item:not(:hover) {
                opacity: 0.35 !important;
            }

            .list-wrapper .list-item:hover {
                opacity: 1 !important;
                transform: scale(1.04) translateZ(0) !important;
                color: var(--text-main) !important;
            }
        }

        @media (hover: none), (pointer: coarse) {
            .list-wrapper .list-item:active {
                opacity: 1 !important;
                transform: scale(1.04) translateZ(0) !important;
            }
        }

        /* -------------------------------------------------------------
           FOOTER
           ------------------------------------------------------------- */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 18px; 
            width: 100%; 
            margin-top: 20px;
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            backface-visibility: hidden;
            transition: color 0.3s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.7; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.4s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            will-change: transform;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (hover: hover) and (pointer: fine) {
            .matrix-canvas a:hover .nav-text,
            .footer-links-row a:hover .nav-text,
            .brand-pill:hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
            }
        }

        /* Fluid Wave Animation Shimmer */
        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            opacity: 1 !important;
        }

        /* -------------------------------------------------------------
           RESPONSIVE BREAKPOINTS: LAPTOP, TABLET & MOBILE
           ------------------------------------------------------------- */
        @media (max-width: 1024px) {
            .bento-container,
            .matrix-canvas {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 28px 18px 24px 18px;
            }

            .brand-pill {
                font-size: 36px;
            }

            .bento-container,
            .matrix-canvas {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .bento-card,
            .capsule-panel {
                padding: 28px 24px;
                min-height: auto;
                border-radius: 20px;
            }

            .bento-card h2,
            .capsule-panel h2,
            .panel-title {
                font-size: 20px;
                margin-bottom: 18px;
            }
        }
    </style>
</head>

    <!-- Interactive Navigation Engine -->
    <script>
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        try {
            sessionStorage.removeItem('breadcrumbTrail');
        } catch (e) {}

        // Target links with wave shimmer
        const targetLinks = document.querySelectorAll('.bento-container a, .matrix-canvas a, footer .footer-links-row a, .brand-pill');
        targetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('javascript:')) return;

                e.preventDefault();
                targetLinks.forEach(l => l.classList.remove('is-wave-loading'));
                this.classList.add('is-wave-loading');
                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 220);
            });
        });

    </script>
    <script src="/script.js"></script>
