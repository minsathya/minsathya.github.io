<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sathya.</title>

    <!-- Universal iPad stabilization -->
    <script>
      if (window.location.search.includes('tf=1') || window.location.href.includes(':~:text=')) {
        document.documentElement.classList.add('instant-landing');
      }
    </script>

    <meta name="description" content="Personal workspace for study notes, resources, and nutrition.">

    <!-- Google Tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5VGX2K64Y4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5VGX2K64Y4');
    </script>
    
    <!-- Favicon Engine -->
    <link id="favicon" rel="icon" type="image/png" href="favicon-light.png">

    <script>
      const favicon = document.getElementById('favicon');
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)');
      
      function updateFavicon(e) {
        favicon.href = e.matches ? 'favicon-dark.png' : 'favicon-light.png';
      }
      
      updateFavicon(darkMode);
      darkMode.addEventListener('change', updateFavicon);
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Smooth transitions & curves */
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #88888e;
            --header-bg: #1a231e;
            --header-border: #222c26;

            /* Apple-Style Vertical Panels (Dark) */
            --panel-bg: rgba(18, 18, 21, 0.88);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
            --panel-shadow-hover: 0 32px 64px rgba(0, 0, 0, 0.65);
            --panel-border-hover: rgba(255, 255, 255, 0.22);

            --pill-bg: rgba(255, 255, 255, 0.06);
            --pill-border: rgba(255, 255, 255, 0.12);
            --pill-text: #ffffff;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #6e6e73;
            --header-bg: #e9ebe6;
            --header-border: #d4d8cf;

            /* Apple-Style Vertical Panels (Light) */
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(0, 0, 0, 0.07);
            --panel-shadow: 0 20px 45px rgba(0, 0, 0, 0.06);
            --panel-shadow-hover: 0 30px 60px rgba(0, 0, 0, 0.12);
            --panel-border-hover: rgba(0, 0, 0, 0.18);

            --pill-bg: rgba(0, 0, 0, 0.05);
            --pill-border: rgba(0, 0, 0, 0.1);
            --pill-text: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 36px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 95%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* Ambient Space Background Canvas */
        .ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
            transition: opacity 0.8s var(--ease-smooth);
        }

        body.light-mode .ambient-canvas {
            opacity: 0.4;
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .top-nav-bar, main, footer {
            position: relative;
            z-index: 1;
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1.1s var(--ease-smooth) backwards;
        }

        .top-nav-bar { animation-delay: 0.04s; }
        main { animation-delay: 0.14s; }
        footer { animation-delay: 0.24s; }

        /* -------------------------------------------------------------
           TOP NAVIGATION: BRAND PILL & THEME TOGGLE
           ------------------------------------------------------------- */
        .top-nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        /* Top Left 'sathya.' Brand Pill */
        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            padding: 0 30px;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-radius: 28px;
            color: var(--text-main);
            text-decoration: none !important;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            
            will-change: transform, box-shadow, border-color;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth),
                        color 0.8s var(--ease-smooth);
        }

        body.light-mode .brand-pill {
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }

        /* 0.55s Lift-up Animation on Hover, Focus, Tap, or Active */
        .brand-pill:hover,
        .brand-pill:focus-within,
        .brand-pill:active,
        .brand-pill.is-pill-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.02, 1.02, 1);
            border-color: #1E1E1E;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }

        body.light-mode .brand-pill:hover,
        body.light-mode .brand-pill:focus-within,
        body.light-mode .brand-pill:active,
        body.light-mode .brand-pill.is-pill-lifted {
            border-color: #b8b8bc;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.09);
        }

        /* Top Right Minimal Theme Toggle Pill */
        .theme-toggle-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-radius: 28px;
            cursor: pointer;
            user-select: none;
            position: relative;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
            touch-action: manipulation;
            
            will-change: transform, box-shadow, border-color;
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        body.light-mode .theme-toggle-pill {
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }

        .theme-toggle-pill:hover,
        .theme-toggle-pill:active {
            transform: translate3d(0, -6px, 0) scale3d(1.02, 1.02, 1);
            border-color: #1E1E1E;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }

        body.light-mode .theme-toggle-pill:hover,
        body.light-mode .theme-toggle-pill:active {
            border-color: #b8b8bc;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.09);
        }

        .theme-toggle-pill svg {
            position: absolute;
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform-origin: center center;
            will-change: transform, opacity;
            transition: transform 0.8s var(--ease-smooth), opacity 0.8s var(--ease-smooth), stroke 0.8s var(--ease-smooth);
        }

        .theme-toggle-pill .sun-icon { opacity: 0; transform: rotate(-90deg) scale(0.4); }
        .theme-toggle-pill .moon-icon { opacity: 1; transform: rotate(0deg) scale(1); }
        body.light-mode .theme-toggle-pill .sun-icon { opacity: 1; transform: rotate(0deg) scale(1); }
        body.light-mode .theme-toggle-pill .moon-icon { opacity: 0; transform: rotate(90deg) scale(0.4); }

        /* -------------------------------------------------------------
           MAIN CENTERED SECTION: VERTICAL APPLE-STYLE PANELS
           ------------------------------------------------------------- */
        main {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
            perspective: 1200px;
            -webkit-perspective: 1200px;
        }

        .apple-panels-grid {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 28px;
            width: 100%;
            max-width: 720px;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        /* Vertical Apple Panel */
        .apple-panel {
            flex: 1 1 300px;
            max-width: 330px;
            min-height: 440px;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 34px;
            padding: 36px 28px 32px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            text-decoration: none !important;
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            touch-action: manipulation;
            cursor: pointer;
            overflow: hidden;
            
            will-change: transform, box-shadow, border-color;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            /* Smooth 0.55s gradual transition */
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        /* Ambient Glow Layer Behind Panel */
        .panel-ambient-glow {
            position: absolute;
            inset: -20px;
            border-radius: 44px;
            pointer-events: none;
            opacity: 0;
            z-index: -1;
            filter: blur(32px);
            transition: opacity 0.55s var(--ease-smooth);
        }

        .apple-panel[data-panel="study"] .panel-ambient-glow {
            background: radial-gradient(circle, rgba(0, 128, 255, 0.25) 0%, transparent 70%);
        }

        .apple-panel[data-panel="nutrition"] .panel-ambient-glow {
            background: radial-gradient(circle, rgba(120, 200, 50, 0.25) 0%, transparent 70%);
        }

        /* Dynamic Specular Sheen Layer */
        .panel-sheen {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            mix-blend-mode: overlay;
            transition: opacity 0.4s var(--ease-smooth);
            will-change: background, opacity;
        }

        body.light-mode .panel-sheen {
            mix-blend-mode: soft-light;
        }

        /* Panel Top Text Info (Apple Store style) */
        .panel-header-text {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transform: translateZ(24px);
            -webkit-transform: translateZ(24px);
            z-index: 2;
        }

        .panel-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-tag.study-tag { color: #0080FF; }
        .panel-tag.nutrition-tag { color: #72b528; }

        .panel-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--text-main);
            line-height: 1.15;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-desc {
            font-size: 13.5px;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.45;
            letter-spacing: -0.15px;
            margin-top: 2px;
            transition: color 0.8s var(--ease-smooth);
        }

        /* Central Artwork / Floating Icon Display Area */
        .panel-artwork-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0 16px 0;
            transform: translateZ(38px);
            -webkit-transform: translateZ(38px);
            z-index: 2;
        }

        .panel-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.55s var(--ease-spring);
        }

        .panel-icon-wrap svg {
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.28));
            transition: transform 0.55s var(--ease-spring), filter 0.55s var(--ease-smooth);
        }

        body.light-mode .panel-icon-wrap svg {
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
        }

        /* Panel Bottom Action CTA */
        .panel-bottom-action {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transform: translateZ(24px);
            -webkit-transform: translateZ(24px);
            z-index: 2;
        }

        .panel-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: var(--pill-text);
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: -0.1px;
            transition: background 0.3s var(--ease-smooth), 
                        border-color 0.3s var(--ease-smooth), 
                        transform 0.3s var(--ease-smooth),
                        box-shadow 0.3s var(--ease-smooth);
        }

        .panel-action-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.3s var(--ease-smooth);
        }

        /* Hover States for Apple Panels */
        @media (hover: hover) and (pointer: fine) {
            .apple-panel:hover {
                border-color: var(--panel-border-hover);
                box-shadow: var(--panel-shadow-hover);
            }

            .apple-panel:hover .panel-sheen {
                opacity: 1;
            }

            .apple-panel:hover .panel-ambient-glow {
                opacity: 0.9;
            }

            .apple-panel:hover .panel-icon-wrap {
                transform: scale3d(1.08, 1.08, 1) translateZ(12px);
            }

            .apple-panel:hover .panel-action-btn {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.25);
            }

            body.light-mode .apple-panel:hover .panel-action-btn {
                background: rgba(0, 0, 0, 0.08);
                border-color: rgba(0, 0, 0, 0.18);
            }

            .apple-panel:hover .panel-action-btn svg {
                transform: translateX(3px);
            }

            .footer-links-row a:hover .nav-text,
            .brand-pill:hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
            }
        }

        /* Lift and Wave Loading State */
        .apple-panel:active,
        .apple-panel.is-card-lifted {
            border-color: var(--panel-border-hover) !important;
            box-shadow: var(--panel-shadow-hover) !important;
        }

        .apple-panel.is-card-lifted .panel-ambient-glow {
            opacity: 1 !important;
        }

        .apple-panel.is-card-lifted .panel-icon-wrap {
            transform: scale3d(1.06, 1.06, 1) !important;
        }

        .brand-pill.is-card-lifted .nav-text,
        .footer-links-row a.is-card-lifted .nav-text {
            transform: scale3d(1.06, 1.06, 1) !important;
        }

        /* -------------------------------------------------------------
           FOOTER
           ------------------------------------------------------------- */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 18px; 
            width: 100%; 
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.6; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.8s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted) !important; }
        .footer-links-row a:hover .nav-text { color: var(--text-main) !important; }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        .kinetic-locked-frame { pointer-events: none !important; }
        .kinetic-locked-frame .nav-text {
            transition: none !important;
            -webkit-transition: none !important;
        }

        /* Responsive Breakpoints */
        @media (max-width: 700px) {
            body { padding: 28px 18px 24px 18px; }
            .top-nav-bar { margin-bottom: 20px; }
            .brand-pill { height: 50px; padding: 0 24px; font-size: 20px; border-radius: 25px; }
            .theme-toggle-pill { width: 50px; height: 50px; border-radius: 25px; }
            
            .apple-panels-grid {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .apple-panel {
                max-width: 100%;
                width: 100%;
                min-height: 380px;
                padding: 28px 24px;
                border-radius: 28px;
            }
            .panel-title { font-size: 24px; }
        }

        /* Instant landing helper */
        html.instant-landing .brand-pill,
        html.instant-landing footer {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
            will-change: auto !important;
        }

        html.instant-landing,
        html.instant-landing body,
        html.instant-landing main,
        html.instant-landing * {
            transition: none !important;
            transition-duration: 0s !important;
        }
    </style>
</head>
<body>

    <!-- Subtle Ambient Space Canvas -->
    <canvas id="ambientCanvas" class="ambient-canvas" aria-hidden="true"></canvas>

    <!-- Top Left Brand Pill & Top Right Theme Toggle -->
    <nav class="top-nav-bar" id="topNavBar">
        <a href="index.html" class="logo brand-pill" id="brandPill">
            <span class="nav-text">sathya.</span>
        </a>

        <div class="theme-toggle-pill" id="themeToggleBtn" aria-label="Toggle visual theme">
            <svg class="sun-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
    </nav>
    
    <!-- Centered Vertical Apple Panels Floating on Background -->
    <main>
        <div class="apple-panels-grid" id="panelsGrid">
            
            <!-- Apple Panel 1: Study -->
            <a href="/study/index.html" class="apple-panel myspace-card" data-panel="study" id="cardStudy">
                <div class="panel-ambient-glow"></div>
                <div class="panel-sheen" id="sheenStudy"></div>
                
                <div class="panel-header-text">
                    <span class="panel-tag study-tag">WORKSPACE</span>
                    <h2 class="panel-title nav-text">Study</h2>
                    <p class="panel-desc">Comprehensive notes, CSAT practice &amp; current affairs.</p>
                </div>

                <div class="panel-artwork-stage">
                    <div class="panel-icon-wrap">
                        <!-- Custom Blue Open Book SVG (Larger Showcase) -->
                        <svg width="105" height="105" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- Interactive 3D Physics Engine, Ambient Stardust, & Navigation -->
    <script>
        // -------------------------------------------------------------
        // 1. LIGHTWEIGHT 3D AMBIENT STARDUST CANVAS
        // -------------------------------------------------------------
        (function initAmbientCanvas() {
            const canvas = document.getElementById('ambientCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width = 0, height = 0;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);
            let animationFrameId = null;
            let isVisible = true;

            const particles = [];
            const PARTICLE_COUNT = 38;
            const FOV = 400;

            let mouseX = 0, mouseY = 0;
            let targetMouseX = 0, targetMouseY = 0;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: (Math.random() - 0.5) * 1300,
                    y: (Math.random() - 0.5) * 850,
                    z: Math.random() * 800 + 100,
                    radius: Math.random() * 1.5 + 0.8,
                    baseAlpha: Math.random() * 0.4 + 0.2,
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: (Math.random() - 0.5) * 0.15
                });
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas, { passive: true });

            window.addEventListener('pointermove', (e) => {
                targetMouseX = (e.clientX - width / 2) * 0.2;
                targetMouseY = (e.clientY - height / 2) * 0.2;
            }, { passive: true });

            document.addEventListener('visibilitychange', () => {
                isVisible = !document.hidden;
                if (isVisible && !animationFrameId) render();
            });

            function render() {
                if (!isVisible) {
                    animationFrameId = null;
                    return;
                }

                ctx.clearRect(0, 0, width, height);

                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                const isLight = document.body.classList.contains('light-mode');
                const particleRgb = isLight ? '90, 90, 105' : '185, 215, 255';
                const lineRgb = isLight ? '110, 110, 125' : '150, 185, 240';

                const projectedPoints = [];

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < -650) p.x = 650;
                    if (p.x > 650) p.x = -650;
                    if (p.y < -425) p.y = 425;
                    if (p.y > 425) p.y = -425;

                    const adjX = p.x - mouseX * (1 - p.z / 900);
                    const adjY = p.y - mouseY * (1 - p.z / 900);
                    const scale = FOV / (FOV + p.z);

                    const screenX = width / 2 + adjX * scale;
                    const screenY = height / 2 + adjY * scale;

                    if (screenX >= -20 && screenX <= width + 20 && screenY >= -20 && screenY <= height + 20) {
                        const alpha = p.baseAlpha * scale * (isLight ? 0.4 : 0.7);
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, Math.max(0.6, p.radius * scale), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${particleRgb}, ${alpha})`;
                        ctx.fill();

                        projectedPoints.push({ x: screenX, y: screenY, alpha: alpha });
                    }
                }

                for (let i = 0; i < projectedPoints.length; i++) {
                    for (let j = i + 1; j < projectedPoints.length; j++) {
                        const p1 = projectedPoints[i];
                        const p2 = projectedPoints[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 95) {
                            const lineAlpha = (1 - dist / 95) * 0.1 * Math.min(p1.alpha, p2.alpha);
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(${lineRgb}, ${lineAlpha})`;
                            ctx.lineWidth = 0.7;
                            ctx.stroke();
                        }
                    }
                }

                animationFrameId = requestAnimationFrame(render);
            }

            render();
        })();

        // -------------------------------------------------------------
        // 2. BRAND PILL TACTILE LIFT & RELEASE
        // -------------------------------------------------------------
        const brandPill = document.getElementById('brandPill');
        if (brandPill) {
            brandPill.addEventListener('pointerdown', () => {
                brandPill.classList.add('is-pill-lifted');
            });

            brandPill.addEventListener('pointerup', () => {
                if (!brandPill.matches(':hover')) {
                    brandPill.classList.remove('is-pill-lifted');
                }
            });

            brandPill.addEventListener('pointerleave', () => {
                brandPill.classList.remove('is-pill-lifted');
            });
        }

        // -------------------------------------------------------------
        // 3. 3D FLOATING PHYSICS & SPECULAR SHEEN FOR APPLE PANELS
        // -------------------------------------------------------------
        (function initApplePanels3D() {
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReducedMotion) return;

            const panels = document.querySelectorAll('.apple-panel');
            const panelStates = new Map();

            panels.forEach(panel => {
                const sheen = panel.querySelector('.panel-sheen');
                panelStates.set(panel, {
                    element: panel,
                    sheen: sheen,
                    rotX: 0,
                    rotY: 0,
                    targetRotX: 0,
                    targetRotY: 0,
                    sheenX: 50,
                    sheenY: 50,
                    isHovered: false
                });

                panel.addEventListener('pointerenter', () => {
                    const state = panelStates.get(panel);
                    if (state) state.isHovered = true;
                });

                panel.addEventListener('pointermove', (e) => {
                    const state = panelStates.get(panel);
                    if (!state) return;

                    const rect = panel.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    const y = (e.clientY - rect.top) / rect.height;

                    state.targetRotX = (0.5 - y) * 14;
                    state.targetRotY = (x - 0.5) * 14;
                    state.sheenX = x * 100;
                    state.sheenY = y * 100;
                });

                panel.addEventListener('pointerleave', () => {
                    const state = panelStates.get(panel);
                    if (!state) return;
                    state.isHovered = false;
                    state.targetRotX = 0;
                    state.targetRotY = 0;
                });
            });

            let time = 0;

            function update3DPhysics() {
                time += 0.02;

                panelStates.forEach(state => {
                    // Gentle harmonic float
                    const idleFloatX = Math.sin(time) * 0.6;
                    const idleFloatY = Math.cos(time * 0.8) * 0.6;

                    const lerpFactor = state.isHovered ? 0.12 : 0.07;
                    const targetX = state.isHovered ? state.targetRotX : idleFloatX;
                    const targetY = state.isHovered ? state.targetRotY : idleFloatY;

                    state.rotX += (targetX - state.rotX) * lerpFactor;
                    state.rotY += (targetY - state.rotY) * lerpFactor;

                    const liftZ = state.isHovered ? 16 : 0;
                    const liftY = state.isHovered ? -8 : 0;
                    state.element.style.transform = `perspective(1000px) translate3d(0, ${liftY}px, ${liftZ}px) rotateX(${state.rotX.toFixed(2)}deg) rotateY(${state.rotY.toFixed(2)}deg)`;

                    if (state.sheen && state.isHovered) {
                        const sheenIntensity = document.body.classList.contains('light-mode') ? 0.14 : 0.18;
                        state.sheen.style.background = `radial-gradient(circle 260px at ${state.sheenX}% ${state.sheenY}%, rgba(255, 255, 255, ${sheenIntensity}), transparent 75%)`;
                    }
                });

                requestAnimationFrame(update3DPhysics);
            }

            requestAnimationFrame(update3DPhysics);
        })();

        // -------------------------------------------------------------
        // 4. THEME CONTROLLER
        // -------------------------------------------------------------
        const toggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        function applyTargetPalette() {
            const activeSessionOverride = sessionStorage.getItem('dashboard-theme');
            if (activeSessionOverride) {
                if (activeSessionOverride === 'light') {
                    bodyElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                }
            } else {
                if (systemLightQuery.matches) {
                    bodyElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                }
            }
        }

        applyTargetPalette();

        systemLightQuery.addEventListener('change', (e) => {
            sessionStorage.removeItem('dashboard-theme');
            if (e.matches) {
                bodyElement.classList.add('light-mode');
            } else {
                bodyElement.classList.remove('light-mode');
            }
        });

        if (toggleBtn) {
            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isCurrentlyLight = bodyElement.classList.contains('light-mode');
                if (isCurrentlyLight) {
                    bodyElement.classList.remove('light-mode');
                    sessionStorage.setItem('dashboard-theme', 'dark');
                } else {
                    bodyElement.classList.add('light-mode');
                    sessionStorage.setItem('dashboard-theme', 'light');
                }
            });
        }

        // -------------------------------------------------------------
        // 5. SEAMLESS WAVE NAVIGATION & RESTORATION
        // -------------------------------------------------------------
        const universalTargetLinks = document.querySelectorAll('footer .footer-links-row a, .logo, .apple-panel');

        universalTargetLinks.forEach(link => {
            if (!link.querySelector('.nav-text')) {
                const wrapper = document.createElement('span');
                wrapper.className = 'nav-text';
                while (link.firstChild) {
                    wrapper.appendChild(link.firstChild);
                }
                link.appendChild(wrapper);
            }
        });

        universalTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('#')) return;

                e.preventDefault();

                universalTargetLinks.forEach(l => {
                    l.classList.remove('is-wave-loading');
                    l.classList.remove('is-card-lifted');
                });

                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');

                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight;
                requestAnimationFrame(() => {
                    if (brandPill) brandPill.classList.remove('is-pill-lifted');
                    universalTargetLinks.forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('is-card-lifted');
                        l.classList.remove('kinetic-locked-frame');
                        const span = l.querySelector('.nav-text');
                        if (span) {
                            span.style.transform = '';
                            span.style.opacity = '';
                            span.style.background = '';
                            span.style.webkitBackgroundClip = '';
                            span.style.webkitTextFillColor = '';
                        }
                    });
                });
            });

            if (window.location.search.includes('tf=1') || window.location.href.includes(':~:text=')) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
                return;
            }

            const savedTargetUrl = sessionStorage.getItem('activeUniversalTargetUrl');
            if (savedTargetUrl) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
            }
        });
    </script>
