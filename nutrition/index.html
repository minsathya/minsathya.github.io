<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Nutrition - sathya.</title>

    <!-- Universal iPad stabilization -->
    <script>
      if (window.location.search.includes('tf=1') || window.location.href.includes(':~:text=')) {
        document.documentElement.classList.add('instant-landing');
      }
    </script>

    <meta name="description" content="Personalized daily food plan, macro tracking, and comprehensive 50-nutrient analysis dashboard.">
    <meta name="keywords" content="Nutrition, Macro Tracker, Daily Meals, Micro Nutrients, Sathya Nutrition">
    
    <!-- Google Tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5VGX2K64Y4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <!-- Favicon Engine -->
    <link id="favicon" rel="icon" type="image/png" href="../favicon-light.png">

    <script>
      const favicon = document.getElementById('favicon');
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)');
      function updateFavicon(e) {
        favicon.href = e.matches ? '../favicon-dark.png' : '../favicon-light.png';
      }
      updateFavicon(darkMode);
      darkMode.addEventListener('change', updateFavicon);
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Nutrition Workspace Dark Theme */
            --bg-color: #0a130d;
            --text-main: #ffffff;
            --text-muted: #88888e;

            /* Panels (Dark Theme - No drop shadows) */
            --panel-bg: rgba(18, 28, 22, 0.92);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-border-hover: rgba(255, 255, 255, 0.22);
            
            --corner-radius: 26px;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #6e6e73;

            /* Panels (Light Theme - No drop shadows) */
            --panel-bg: rgba(255, 255, 255, 0.95);
            --panel-border: rgba(0, 0, 0, 0.07);
            --panel-border-hover: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 36px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 95%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 18px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .top-section-cluster, main, footer {
            position: relative;
            z-index: 1;
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1s var(--ease-smooth) backwards;
        }

        .top-section-cluster { animation-delay: 0.04s; }
        main { animation-delay: 0.12s; }
        footer { animation-delay: 0.22s; }

        /* -------------------------------------------------------------
           TOP SECTION: BRAND 'sathya.' & HEADING 'Nutrition'
           ------------------------------------------------------------- */
        .top-section-cluster {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        /* Top Left 'sathya.' brand link directly to main home */
        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            height: 48px;
            padding: 0 4px;
            background-color: transparent;
            border: none;
            color: var(--text-main);
            text-decoration: none !important;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            transition: transform 0.55s var(--ease-smooth),
                        color 0.8s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:focus-within,
        .brand-pill:active,
        .brand-pill.is-pill-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1);
            box-shadow: none !important;
        }

        .page-main-heading {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--text-main);
            padding: 0 4px;
            margin: 0;
            line-height: 1.15;
            transition: color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           MAIN CONTENT: VERTICALLY CENTERED HORIZONTAL CAROUSEL
           ------------------------------------------------------------- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 28px 0;
        }

        /* Full-bleed horizontal scroll viewport for edge-to-edge smooth glide */
        .carousel-outer-shell {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            overflow: visible;
        }

        .panels-scroll-track {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            gap: 28px;
            padding: 20px max(24px, calc((100vw - 1200px) / 2 + 24px));
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .panels-scroll-track::-webkit-scrollbar {
            display: none;
        }

        /* -------------------------------------------------------------
           APPLE-STYLE VERTICAL PANELS (NO SHADOWS SITE-WIDE)
           ------------------------------------------------------------- */
        .apple-panel {
            width: 310px;
            min-width: 310px;
            max-width: 310px;
            min-height: 425px;
            aspect-ratio: 1 / 1.38;
            flex-shrink: 0;
            scroll-snap-align: start;
            
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--corner-radius);
            padding: 38px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            text-decoration: none !important;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            overflow: hidden;
            
            will-change: transform, border-color;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            transition: transform 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        /* Hover & Touch Elevation (Smooth Lift Without Drop Shadow) */
        @media (hover: hover) and (pointer: fine) {
            .apple-panel:hover {
                transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1);
                border-color: var(--panel-border-hover);
                box-shadow: none !important;
            }

            .apple-panel:hover .panel-icon-wrap {
                transform: scale3d(1.06, 1.06, 1);
            }

            .footer-links-row a:hover .nav-text,
            .brand-pill:hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
            }
        }

        .apple-panel:active,
        .apple-panel.is-card-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1) !important;
            border-color: var(--panel-border-hover) !important;
            box-shadow: none !important;
        }

        .apple-panel.is-card-lifted .panel-icon-wrap {
            transform: scale3d(1.06, 1.06, 1) !important;
        }

        /* -------------------------------------------------------------
           PANEL 1 SPECIFIC LAYOUT:
           Icon at TOP (larger), Title at center-to-bottom-middle, Subtext below
           ------------------------------------------------------------- */
        .panel-layout-top-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        .panel-layout-top-icon .panel-artwork-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 10px;
        }

        .panel-layout-top-icon .panel-bottom-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding-bottom: 12px;
            width: 100%;
        }

        .panel-layout-top-icon .panel-title {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1.15;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-subtext {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            transition: color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           PANEL 2 SPECIFIC LAYOUT:
           'Vegetarian' line 1 top-left, 'Protein Sources' line 2, Icon below
           ------------------------------------------------------------- */
        .panel-layout-two-line {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
        }

        .panel-header-two-line {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .panel-header-two-line .line-vegetarian {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1.1;
        }

        .panel-header-two-line .line-protein {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--text-main);
            opacity: 0.9;
            line-height: 1.15;
        }

        /* -------------------------------------------------------------
           PANEL 3 SPECIFIC LAYOUT: 'Fiber'
           ------------------------------------------------------------- */
        .panel-layout-standard {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
        }

        .panel-layout-standard .panel-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1.15;
        }

        /* Artwork Stages & High Quality 3D Icons */
        .panel-artwork-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 16px 0;
        }

        .panel-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.55s var(--ease-smooth);
        }

        .panel-icon-wrap img {
            object-fit: contain;
            transition: transform 0.55s var(--ease-smooth);
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.35));
        }

        body.light-mode .panel-icon-wrap img {
            filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.1));
        }

        .icon-large {
            width: 130px;
            height: 130px;
        }

        .icon-standard {
            width: 120px;
            height: 120px;
        }

        /* -------------------------------------------------------------
           FOOTER
           ------------------------------------------------------------- */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 18px; 
            width: 100%; 
            padding-top: 24px;
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.6; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.8s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: normal;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted) !important; white-space: nowrap !important; }
        .footer-links-row a:hover .nav-text { color: var(--text-main) !important; }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        /* -------------------------------------------------------------
           MOBILE & TABLET VIEWPORT (< 700px):
           Horizontal Scroll With Peek Cue for 2nd Panel
           ------------------------------------------------------------- */
        @media (max-width: 700px) {
            body {
                padding: 28px 18px 24px 18px;
            }

            .top-section-cluster {
                gap: 8px;
            }

            .brand-pill {
                height: 44px;
                font-size: 24px;
            }

            .page-main-heading {
                font-size: 28px;
            }

            main {
                padding: 20px 0;
            }

            .panels-scroll-track {
                gap: 16px;
                padding: 16px 18px;
            }

            /* On mobile: First panel takes 78vw, giving an intuitive peek (~18vw) of the second panel */
            .apple-panel {
                width: 78vw;
                min-width: 78vw;
                max-width: 320px;
                min-height: 400px;
                height: 410px;
                padding: 32px 24px;
                border-radius: 24px;
            }

            .icon-large {
                width: 120px;
                height: 120px;
            }

            .icon-standard {
                width: 110px;
                height: 110px;
            }

            .panel-layout-top-icon .panel-title {
                font-size: 25px;
            }

            .panel-header-two-line .line-vegetarian {
                font-size: 26px;
            }

            .panel-header-two-line .line-protein {
                font-size: 22px;
            }

            .panel-layout-standard .panel-title {
                font-size: 26px;
            }
        }
    </style>
</head>
<body class="nutrition-workspace">

                    <div class="panel-header-two-line">

    </main>

    <!-- Standard Footer -->
    <footer>
        <div class="footer-links-row">
            <a href="/study/Footer/about.html"><span class="nav-text">About</span></a>
            <a href="/study/Footer/contact.html"><span class="nav-text">Contact</span></a>
            <a href="/study/Footer/privacy.html"><span class="nav-text">Privacy Policy</span></a>
            <a href="/study/Footer/terms.html"><span class="nav-text">Terms &amp; Conditions</span></a>
            <a href="/study/Footer/disclaimer.html"><span class="nav-text">Disclaimer</span></a>
        </div>
        <div class="copyright-tag">&copy; 2026 Sathya. All rights reserved.</div>
    </footer>

    <!-- Interactive Navigation & Automatic System Theme Engine -->
    <script>
        // -------------------------------------------------------------
        // 1. AUTOMATIC DEVICE THEME DETECTOR
        // -------------------------------------------------------------
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        function applyDeviceTheme() {
            const saved = sessionStorage.getItem('dashboard-theme');
            if (saved) {
                bodyElement.classList.toggle('light-mode', saved === 'light');
                document.documentElement.classList.toggle('light-mode', saved === 'light');
            } else {
                bodyElement.classList.toggle('light-mode', systemLightQuery.matches);
                document.documentElement.classList.toggle('light-mode', systemLightQuery.matches);
            }
        }

        applyDeviceTheme();
        systemLightQuery.addEventListener('change', applyDeviceTheme);

        // -------------------------------------------------------------
        // 2. BREADCRUMB SESSION STATE INITIALIZATION FOR NUTRITION
        // -------------------------------------------------------------
        try {
            sessionStorage.setItem('breadcrumbTrail', JSON.stringify([
                { name: "Home", path: "/nutrition/index.html" }
            ]));
        } catch (e) {}

        // -------------------------------------------------------------
        // 3. FLUID WAVE CLICK TRANSITIONS
        // -------------------------------------------------------------
        const universalTargetLinks = document.querySelectorAll('.panels-scroll-track a, .brand-pill, footer .footer-links-row a');

        function executeLayoutSpans() {
            universalTargetLinks.forEach(link => {
                if (!link.querySelector('.nav-text')) {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'nav-text';
                    while (link.firstChild) wrapper.appendChild(link.firstChild);
                    link.appendChild(wrapper);
                }
            });
        }
        executeLayoutSpans();

        universalTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('#')) return;

                e.preventDefault();

                universalTargetLinks.forEach(l => {
                    l.classList.remove('is-wave-loading');
                    l.classList.remove('is-card-lifted');
                });

                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');

                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight;
                requestAnimationFrame(() => {
                    universalTargetLinks.forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('is-card-lifted');
                        const span = l.querySelector('.nav-text');
                        if (span) {
                            span.style.transform = '';
                            span.style.opacity = '';
                            span.style.background = '';
                            span.style.webkitBackgroundClip = '';
                            span.style.webkitTextFillColor = '';
                        }
                    });
                });
            });
        });
    </script>
    <script src="/script.js"></script>
</body>
