<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Nutrition - sathya.</title>

    <!-- Universal iPad stabilization -->
    <script>
      if (window.location.search.includes('tf=1') || window.location.href.includes(':~:text=')) {
        document.documentElement.classList.add('instant-landing');
      }
    </script>

    <meta name="description" content="Personalized daily food plan, macro tracking, and comprehensive 50-nutrient analysis dashboard.">
    <meta name="keywords" content="Nutrition, Macro Tracker, Daily Meals, Micro Nutrients, Sathya Nutrition">
    
    <!-- Google Tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5VGX2K64Y4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5VGX2K64Y4');
    </script>
    
    <!-- Favicon Engine -->
    <link id="favicon" rel="icon" type="image/png" href="../favicon-light.png">

    <script>
      const favicon = document.getElementById('favicon');
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)');
      function updateFavicon(e) {
        favicon.href = e.matches ? '../favicon-dark.png' : '../favicon-light.png';
      }
      updateFavicon(darkMode);
      darkMode.addEventListener('change', updateFavicon);
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #88888e;

            /* Panels (Dark Theme - shadow matches dark bg) */
            --panel-bg: rgba(18, 18, 21, 0.92);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
            --panel-shadow-hover: 0 28px 56px rgba(0, 0, 0, 0.6);
            --panel-border-hover: rgba(255, 255, 255, 0.2);
            
            --corner-radius: 26px;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #6e6e73;

            /* Panels (Light Theme - shadow matches light bg) */
            --panel-bg: rgba(255, 255, 255, 0.95);
            --panel-border: rgba(0, 0, 0, 0.07);
            --panel-shadow: 0 20px 45px rgba(0, 0, 0, 0.06);
            --panel-shadow-hover: 0 28px 52px rgba(0, 0, 0, 0.1);
            --panel-border-hover: rgba(0, 0, 0, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 40px 24px 36px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 95%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            gap: 24px;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 18px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .breadcrumb-nav, .page-main-heading, .panels-container, footer {
            position: relative;
            z-index: 1;
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1s var(--ease-smooth) backwards;
        }

        .breadcrumb-nav { animation-delay: 0.04s; }
        .page-main-heading { animation-delay: 0.10s; }
        .panels-container { animation-delay: 0.16s; }
        footer { animation-delay: 0.24s; }

        /* -------------------------------------------------------------
           BREADCRUMBS (TOP LEFT)
           ------------------------------------------------------------- */
        .breadcrumb-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            padding-left: 0;
            margin-bottom: 4px;
            width: 100%;
        }

        .breadcrumb-nav a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            transition: color 0.4s var(--ease-smooth);
        }

        .breadcrumb-nav a:hover {
            color: var(--text-main) !important;
        }

        .breadcrumb-separator {
            color: var(--text-muted);
            opacity: 0.4;
            user-select: none;
        }

        .breadcrumb-current {
            color: var(--text-main);
            opacity: 0.85;
            font-weight: 500;
        }

        /* -------------------------------------------------------------
           MAIN HEADING (UNDER BREADCRUMBS, ALIGNED LEFT)
           ------------------------------------------------------------- */
        .page-main-heading {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--text-main);
            padding-left: 0;
            margin-bottom: 24px;
            line-height: 1.15;
            transition: color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           PANELS CONTAINER & APPLE-STYLE VERTICAL PANEL ON LEFT
           ------------------------------------------------------------- */
        .panels-container {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
        }

        /* Desktop & iPad: Vertical Apple-Style Panel matching index.html */
        .apple-panel {
            width: 100%;
            max-width: 315px;
            min-height: 410px;
            aspect-ratio: 1 / 1.38;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--corner-radius);
            padding: 38px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            text-decoration: none !important;
            box-shadow: var(--panel-shadow);
            touch-action: manipulation;
            cursor: pointer;
            overflow: hidden;
            
            will-change: transform, box-shadow, border-color;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        .panel-header-text {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #72b528;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--text-main);
            line-height: 1.15;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-artwork-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0 8px 0;
        }

        .panel-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.55s var(--ease-smooth);
        }

        .panel-icon-wrap img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.25));
            transition: transform 0.55s var(--ease-smooth);
        }

        body.light-mode .panel-icon-wrap img {
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.08));
        }

        @media (hover: hover) and (pointer: fine) {
            .apple-panel:hover {
                transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1);
                border-color: var(--panel-border-hover);
                box-shadow: var(--panel-shadow-hover);
            }

            .apple-panel:hover .panel-icon-wrap {
                transform: scale3d(1.06, 1.06, 1);
            }

            .footer-links-row a:hover .nav-text,
            .breadcrumb-nav a:hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
            }
        }

        .apple-panel:active,
        .apple-panel.is-card-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1) !important;
            border-color: var(--panel-border-hover) !important;
            box-shadow: var(--panel-shadow-hover) !important;
        }

        .apple-panel.is-card-lifted .panel-icon-wrap {
            transform: scale3d(1.06, 1.06, 1) !important;
        }

        /* -------------------------------------------------------------
           FOOTER
           ------------------------------------------------------------- */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 18px; 
            width: 100%; 
            margin-top: auto;
            padding-top: 40px;
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.6; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.8s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted) !important; }
        .footer-links-row a:hover .nav-text { color: var(--text-main) !important; }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        /* -------------------------------------------------------------
           MOBILE BREAKPOINT (< 700px)
           ------------------------------------------------------------- */
        @media (max-width: 700px) {
            body {
                padding: 28px 18px 24px 18px;
                gap: 16px;
            }
            .breadcrumb-nav { margin-bottom: 2px; }
            .page-main-heading { font-size: 26px; margin-bottom: 16px; }

            .apple-panel {
                width: 100% !important;
                max-width: 100% !important;
                min-height: unset !important;
                height: auto !important;
                aspect-ratio: unset !important;
                flex: none !important;
                flex-direction: row !important;
                align-items: center !important;
                justify-content: space-between !important;
                gap: 20px !important;
                padding: 22px 28px !important;
                border-radius: var(--corner-radius) !important;
            }

            .panel-artwork-stage {
                flex-grow: 0;
                flex-shrink: 0;
                padding: 0 !important;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .panel-header-text {
                gap: 4px;
                text-align: left;
                align-items: flex-start;
            }

            .panel-tag {
                font-size: 10px;
                letter-spacing: 0.8px;
                line-height: 1.2;
            }

            .panel-title {
                font-size: 24px;
                line-height: 1.1;
            }

            .panel-icon-wrap img {
                width: 68px !important;
                height: 68px !important;
            }
        }
    </style>
</head>
<body>

    <!-- Breadcrumbs at top left -->
    <nav class="breadcrumb-nav" id="dynamicBreadcrumbNav">
        <a href="/index.html"><span class="nav-text">Home</span></a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">Nutrition</span>
    </nav>

    <!-- Heading under breadcrumbs, aligned left -->
    <h1 class="page-main-heading">Nutrition</h1>

    <!-- Apple-Style Vertical Panel on left side -->
    <div class="panels-container">
        <a href="/nutrition/mm.html" class="apple-panel myspace-card" data-panel="nutrition" id="cardTrackNutrients">
            <div class="panel-header-text">
                <span class="panel-tag">WORKSPACE</span>
                <h2 class="panel-title nav-text">Track the Nutrients</h2>
            </div>

            <div class="panel-artwork-stage">
                <div class="panel-icon-wrap">
                    <img src="/nutrition/images/macros.png" class="panel-icon-img" width="100" height="100" alt="Track the Nutrients" onerror="this.onerror=null; this.src='https://github.com/minsathya/minsathya.github.io/blob/main/nutrition/images/macros.png?raw=true';">
                </div>
            </div>
        </a>
    </div>

    <!-- Standard Footer -->
    <footer>
        <div class="footer-links-row">
            <a href="/study/Footer/about.html"><span class="nav-text">About</span></a>
            <a href="/study/Footer/contact.html"><span class="nav-text">Contact</span></a>
            <a href="/study/Footer/privacy.html"><span class="nav-text">Privacy Policy</span></a>
            <a href="/study/Footer/terms.html"><span class="nav-text">Terms &amp; Conditions</span></a>
            <a href="/study/Footer/disclaimer.html"><span class="nav-text">Disclaimer</span></a>
        </div>
        <div class="copyright-tag">&copy; 2026 Sathya. All rights reserved.</div>
    </footer>

    <!-- Interactive Navigation & Automatic System Theme Engine -->
    <script>
        // -------------------------------------------------------------
        // 1. AUTOMATIC DEVICE THEME DETECTOR
        // -------------------------------------------------------------
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        function applyDeviceTheme() {
            const saved = sessionStorage.getItem('dashboard-theme');
            if (saved) {
                bodyElement.classList.toggle('light-mode', saved === 'light');
                document.documentElement.classList.toggle('light-mode', saved === 'light');
            } else {
                bodyElement.classList.toggle('light-mode', systemLightQuery.matches);
                document.documentElement.classList.toggle('light-mode', systemLightQuery.matches);
            }
        }

        applyDeviceTheme();
        systemLightQuery.addEventListener('change', applyDeviceTheme);

        // -------------------------------------------------------------
        // 2. DYNAMIC BREADCRUMB INITIALIZATION & SESSION RESET
        // -------------------------------------------------------------
        (function buildDynamicBreadcrumbs() {
            const container = document.getElementById('dynamicBreadcrumbNav');
            if (!container) return;
            container.innerHTML = `<a href="/index.html"><span class="nav-text">Home</span></a><span class="breadcrumb-separator">/</span><span class="breadcrumb-current">Nutrition</span>`;
            try {
                sessionStorage.setItem('breadcrumbTrail', JSON.stringify([
                    { name: "Home", path: "/index.html" },
                    { name: "Nutrition", path: "/nutrition/index.html" }
                ]));
            } catch (e) {}
        })();

        // -------------------------------------------------------------
        // 3. FLUID WAVE CLICK TRANSITIONS
        // -------------------------------------------------------------
        const universalTargetLinks = document.querySelectorAll('.panels-container a, .breadcrumb-nav a, footer .footer-links-row a');

        function executeLayoutSpans() {
            universalTargetLinks.forEach(link => {
                if (!link.querySelector('.nav-text')) {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'nav-text';
                    while (link.firstChild) wrapper.appendChild(link.firstChild);
                    link.appendChild(wrapper);
                }
            });
        }
        executeLayoutSpans();

        universalTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('#')) return;

                e.preventDefault();

                universalTargetLinks.forEach(l => {
                    l.classList.remove('is-wave-loading');
                    l.classList.remove('is-card-lifted');
                });

                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');

                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight;
                requestAnimationFrame(() => {
                    universalTargetLinks.forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('is-card-lifted');
                        const span = l.querySelector('.nav-text');
                        if (span) {
                            span.style.transform = '';
                            span.style.opacity = '';
                            span.style.background = '';
                            span.style.webkitBackgroundClip = '';
                            span.style.webkitTextFillColor = '';
                        }
                    });
                });
            });
        });
    </script>
    <script src="/script.js"></script>
</body>
</html>
