    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Nutrition Workspace Dark Theme */
            --bg-color: #0a130d;
            --text-main: #ffffff;
            --text-muted: #88888e;

            /* Panels: Original sleek dark charcoal (#121212), zero shadows, zero green tint */
            --panel-bg: #121212;
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-border-hover: rgba(255, 255, 255, 0.22);
            
            --corner-radius: 26px;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #6e6e73;

            /* Panels (Light Theme) */
            --panel-bg: rgba(255, 255, 255, 0.95);
            --panel-border: rgba(0, 0, 0, 0.07);
            --panel-border-hover: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 38px 24px 32px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 16px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .top-nav-bar, .workspace-heading-area, main, footer {
            position: relative;
            z-index: 1;
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1s var(--ease-smooth) backwards;
        }

        .top-nav-bar { animation-delay: 0.04s; }
        .workspace-heading-area { animation-delay: 0.08s; }
        main { animation-delay: 0.14s; }
        footer { animation-delay: 0.22s; }

        /* -------------------------------------------------------------
           1. TOP NAVIGATION: 's.' BRAND PILL WITH PEACH CIRCULAR DOT
           ------------------------------------------------------------- */
        .top-nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        /* Top Left 's.' brand link directly to main home */
        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            height: auto;
            padding: 0 2px;
            background-color: transparent;
            border: none;
            text-decoration: none !important;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1.2px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            transition: transform 0.55s var(--ease-smooth);
        }

        /* 's' font color follows device theme */
        .brand-letter {
            color: var(--text-main);
            transition: color 0.8s var(--ease-smooth);
        }

        /* Round full stop '.' rendered as a pure CSS circle — never renders as square box on refresh */
        .brand-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ff9e79 !important;
            border-radius: 50% !important;
            margin-left: 2px;
            margin-bottom: 3px;
            vertical-align: baseline;
            flex-shrink: 0;
            line-height: 1;
            transition: background-color 0.8s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:focus-within,
        .brand-pill:active,
        .brand-pill.is-pill-lifted {
            transform: translate3d(0, -4px, 0) scale3d(1.02, 1.02, 1);
            box-shadow: none !important;
        }

        /* -------------------------------------------------------------
           2. WORKSPACE HEADING: 'Nutrition' POSITIONED IN THE MIDDLE
              BETWEEN 's.' BRAND (TOP) AND CAROUSEL PANELS (BOTTOM)
           ------------------------------------------------------------- */
        .workspace-heading-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 24px 0 16px 0;
            padding: 0 2px;
        }

        .page-main-heading {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.2px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.2;
            transition: color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           3. MAIN CONTENT: 3D DYNAMIC SCROLLING CAROUSEL
           ------------------------------------------------------------- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            padding: 12px 0 24px 0;
        }

        /* Full-bleed horizontal scroll shell */
        .carousel-outer-shell {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            overflow: visible;
        }

        .panels-scroll-track {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            gap: 24px;
            padding-top: 20px;
            padding-bottom: 24px;
            /* Dynamically aligned with s. and Nutrition via JS */
            padding-left: var(--track-pad-left, 24px);
            padding-right: 48px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            perspective: 1200px;
        }

        .panels-scroll-track::-webkit-scrollbar {
            display: none;
        }

        /* -------------------------------------------------------------
           4. APPLE-STYLE VERTICAL PANELS WITH 3D DYNAMIC SCALING
           ------------------------------------------------------------- */
        .apple-panel {
            width: 270px;
            min-width: 270px;
            max-width: 270px;
            height: 395px;
            min-height: 395px;
            aspect-ratio: 1 / 1.45;
            flex-shrink: 0;
            scroll-snap-align: start;
            
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--corner-radius);
            padding: 34px 24px 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            text-decoration: none !important;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            overflow: hidden;
            
            transform-origin: center center;
            will-change: transform, opacity, border-color;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            /* Silky smooth 3D coverflow transition */
            transition: transform 0.16s ease-out, 
                        opacity 0.16s ease-out, 
                        border-color 0.4s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        @media (hover: hover) and (pointer: fine) {
            .apple-panel:hover {
                border-color: var(--panel-border-hover);
            }

            .apple-panel:hover .panel-icon-wrap {
                transform: scale3d(1.05, 1.05, 1);
            }

            .footer-links-row a:hover .nav-text,
            .brand-pill:hover .nav-text {
                transform: scale3d(1.05, 1.05, 1) !important;
            }
        }

        .apple-panel:active,
        .apple-panel.is-card-lifted {
            border-color: var(--panel-border-hover) !important;
        }

        /* Artwork Stages & High-Quality 3D Emblems */
        .panel-artwork-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-top: 6px;
        }

        .panel-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.55s var(--ease-smooth);
        }

        /* Zero icon drop-shadows site-wide for clean vector look */
        .panel-icon-wrap img {
            width: 125px;
            height: 125px;
            object-fit: contain;
            transition: transform 0.55s var(--ease-smooth);
            filter: none !important;
            -webkit-filter: none !important;
        }

        body.light-mode .panel-icon-wrap img {
            filter: none !important;
            -webkit-filter: none !important;
        }

        .panel-bottom-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding-bottom: 8px;
            width: 100%;
        }

        .panel-title {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-main);
            line-height: 1.15;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-subtext {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            transition: color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           5. FOOTER
           ------------------------------------------------------------- */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 18px; 
            width: 100%; 
            padding-top: 24px;
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.6; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.8s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: normal;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted) !important; white-space: nowrap !important; }
        .footer-links-row a:hover .nav-text { color: var(--text-main) !important; }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        /* -------------------------------------------------------------
           6. MOBILE VIEWPORT (< 700px):
           Sleek Vertical Rectangles (NOT Square Boxes, NOT Taking Max Space)
           ------------------------------------------------------------- */
        @media (max-width: 700px) {
            body {
                padding: 26px 18px 20px 18px;
            }

            .brand-pill {
                font-size: 36px;
            }

            .brand-dot {
                width: 7px;
                height: 7px;
                margin-bottom: 2px;
            }

            .workspace-heading-area {
                margin: 18px 0 12px 0;
            }

            .page-main-heading {
                font-size: 18px;
            }

            main {
                padding: 10px 0 18px 0;
            }

            .panels-scroll-track {
                gap: 16px;
                padding-top: 14px;
                padding-bottom: 18px;
            }

            /* Scaled-down elegant vertical rectangle matching iPad/laptop proportions */
            .apple-panel {
                width: 220px !important;
                min-width: 220px !important;
                max-width: 220px !important;
                height: 325px !important;
                min-height: 325px !important;
                aspect-ratio: 1 / 1.48 !important;
                padding: 26px 18px 20px 18px !important;
                border-radius: 20px !important;
            }

            .panel-icon-wrap img {
                width: 95px !important;
                height: 95px !important;
            }

            .panel-title {
                font-size: 21px !important;
            }

            .panel-subtext {
                font-size: 12.5px !important;
            }
        }
    </style>
</head>

    <!-- Interactive Navigation, 3D Carousel Engine & Theme Detector -->
    <script>
        // -------------------------------------------------------------
        // 1. AUTOMATIC DEVICE THEME DETECTOR
        // -------------------------------------------------------------
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        function applyDeviceTheme() {
            const saved = sessionStorage.getItem('dashboard-theme');
            if (saved) {
                bodyElement.classList.toggle('light-mode', saved === 'light');
                document.documentElement.classList.toggle('light-mode', saved === 'light');
            } else {
                bodyElement.classList.toggle('light-mode', systemLightQuery.matches);
                document.documentElement.classList.toggle('light-mode', systemLightQuery.matches);
            }
        }

        applyDeviceTheme();
        systemLightQuery.addEventListener('change', applyDeviceTheme);

        // -------------------------------------------------------------
        // 2. BREADCRUMB SESSION STATE INITIALIZATION FOR NUTRITION
        // -------------------------------------------------------------
        try {
            sessionStorage.setItem('breadcrumbTrail', JSON.stringify([
                { name: "Home", path: "/nutrition/index.html" }
            ]));
        } catch (e) {}

        // -------------------------------------------------------------
        // 3. CAROUSEL LEFT ALIGNMENT ENGINE (MATCHES s. & NUTRITION)
        // -------------------------------------------------------------
        const track = document.getElementById('panelsTrack');
        const brandPill = document.getElementById('brandPill');

        function updateTrackAlignment() {
            if (!brandPill || !track) return;
            const brandRect = brandPill.getBoundingClientRect();
            const leftOffset = Math.max(16, brandRect.left);
            track.style.setProperty('--track-pad-left', leftOffset + 'px');
            track.style.paddingRight = Math.max(leftOffset, 48) + 'px';
        }

        // -------------------------------------------------------------
        // 4. 3D COVERFLOW DYNAMIC SCALE ANIMATION ON HORIZONTAL SCROLL
        // -------------------------------------------------------------
        const cards = Array.from(document.querySelectorAll('.apple-panel'));

        function updateCarousel3D() {
            if (!track || cards.length === 0) return;

            const cardWidth = cards[0].offsetWidth;
            const gap = parseFloat(getComputedStyle(track).gap) || 24;
            const step = cardWidth + gap;
            if (step <= 0) return;

            // Fractional active index based on scroll offset
            const activeIndex = track.scrollLeft / step;

            cards.forEach((card, i) => {
                const dist = Math.abs(i - activeIndex);

                // Smooth dynamic scale:
                // Active panel = 1.0
                // 1 panel away = ~0.90
                // 2 panels away = ~0.81
                // 3 panels away = ~0.73
                let scale = 1.0 - (dist * 0.095);
                if (scale < 0.73) scale = 0.73;

                // Subtle opacity depth
                let opacity = 1.0 - (dist * 0.08);
                if (opacity < 0.72) opacity = 0.72;

                const zIndex = 30 - Math.round(dist * 5);

                card.style.transform = `scale(${scale.toFixed(3)})`;
                card.style.opacity = opacity.toFixed(3);
                card.style.zIndex = zIndex;
            });
        }

        track.addEventListener('scroll', () => {
            requestAnimationFrame(updateCarousel3D);
        }, { passive: true });

        window.addEventListener('resize', () => {
            updateTrackAlignment();
            requestAnimationFrame(updateCarousel3D);
        });

        // -------------------------------------------------------------
        // 5. CLICK INTERACTION & FLUID WAVE TRANSITIONS
        // -------------------------------------------------------------
        cards.forEach((card, idx) => {
            card.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                
                // If it's a placeholder link (Calories, Protein, Fiber), scroll that panel into focus!
                if (!destination || destination === '#' || destination.startsWith('javascript:')) {
                    e.preventDefault();
                    const cardWidth = cards[0].offsetWidth;
                    const gap = parseFloat(getComputedStyle(track).gap) || 24;
                    const step = cardWidth + gap;
                    track.scrollTo({ left: idx * step, behavior: 'smooth' });
                    return;
                }

                // If navigating to mm.html (Track the Nutrients):
                e.preventDefault();
                cards.forEach(l => {
                    l.classList.remove('is-wave-loading');
                    l.classList.remove('is-card-lifted');
                });

                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');
                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        // Other target links (footer, brand pill)
        const otherTargetLinks = document.querySelectorAll('.brand-pill, footer .footer-links-row a');
        otherTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('javascript:')) return;

                e.preventDefault();
                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');
                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            updateTrackAlignment();
            updateCarousel3D();
        });

        window.addEventListener('load', () => {
            updateTrackAlignment();
            updateCarousel3D();
        });

        window.addEventListener('pageshow', () => {
            updateTrackAlignment();
            updateCarousel3D();
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight;
                requestAnimationFrame(() => {
                    document.querySelectorAll('.is-wave-loading, .is-card-lifted').forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('is-card-lifted');
                    });
                });
            });
        });
    </script>
    <script src="/script.js"></script>
</body>
</html>
