<html lang="en">
<head>

    <script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Nutrition Workspace Dark Theme */
            --bg-color: #0a130d;
            --text-main: #ffffff;
            --text-muted: #88888e;

            /* Panels: Background matches site bg, border transparent until hover (Image 2 & 3) */
            --panel-bg: transparent;
            --panel-border: transparent;
            --panel-border-hover: rgba(255, 255, 255, 0.22);
            
            --corner-radius: 24px;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #6e6e73;

            /* Panels (Light Theme) */
            --panel-bg: transparent;
            --panel-border: transparent;
            --panel-border-hover: rgba(0, 0, 0, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 38px 24px 32px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 16px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        .top-nav-bar, .workspace-heading-area, main, footer {
            position: relative;
            z-index: 1;
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1s var(--ease-smooth) backwards;
        }

        .top-nav-bar { animation-delay: 0.04s; }
        .workspace-heading-area { animation-delay: 0.08s; }
        main { animation-delay: 0.12s; }
        footer { animation-delay: 0.22s; }

        /* -------------------------------------------------------------
           1. TOP NAVIGATION: 's.' BRAND PILL WITH ACCURATE BASELINE PEACH DOT
           ------------------------------------------------------------- */
        .top-nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        /* Top Left 's.' brand link directly to main home */
        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-start;
            height: auto;
            padding: 0 2px;
            background-color: transparent;
            border: none;
            text-decoration: none !important;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1.2px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            transition: transform 0.55s var(--ease-smooth);
        }

        /* 's' font color follows device theme */
        .brand-letter {
            color: var(--text-main);
            transition: color 0.8s var(--ease-smooth);
            line-height: 1;
        }

        /* Peach dot: sits right at the bottom baseline of 's', never elevated */
        .brand-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ff9e79 !important;
            border-radius: 50% !important;
            margin-left: 2px;
            margin-bottom: 0 !important;
            vertical-align: -1px;
            flex-shrink: 0;
            line-height: 1;
            transition: background-color 0.8s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:focus-within,
        .brand-pill:active,
        .brand-pill.is-pill-lifted {
            transform: translate3d(0, -4px, 0) scale3d(1.02, 1.02, 1);
            box-shadow: none !important;
        }

        /* -------------------------------------------------------------
           2. WORKSPACE HEADING: 'Nutrition' MOVED DOWN CLOSER TO PANELS
           ------------------------------------------------------------- */
        .workspace-heading-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 52px;
            margin-bottom: 24px;
            padding: 0 2px;
        }

        .page-main-heading {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.2px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.2;
            transition: color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           3. MAIN PANELS TRACK: 100% IN LINE WITH s. & NUTRITION
           ------------------------------------------------------------- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            padding: 6px 0 28px 0;
            overflow: visible;
        }

        .panels-scroll-track {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: stretch;
            gap: 24px;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 14px 6px 24px 6px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .panels-scroll-track::-webkit-scrollbar {
            display: none;
        }

        /* -------------------------------------------------------------
           4. UNIFORM PANELS: EXACT SIZE OF CALORIES PANEL (240px x 350px)
              IDLE: SEAMLESS NO-BG NO-BORDER (MATCHES IMG 2)
              HOVER/TOUCH: BORDER-ONLY APPEARS WITH SMOOTH LIFT (MATCHES IMG 3)
           ------------------------------------------------------------- */
        .apple-panel {
            width: 240px;
            min-width: 240px;
            max-width: 240px;
            height: 350px;
            min-height: 350px;
            aspect-ratio: 1 / 1.46;
            flex-shrink: 0;
            
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--corner-radius);
            padding: 28px 20px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            text-decoration: none !important;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            overflow: hidden;
            box-sizing: border-box;
            
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            
            /* Smooth lift-up & border-fade transition */
            transition: transform 0.45s var(--ease-smooth), 
                        border-color 0.35s var(--ease-smooth), 
                        background-color 0.4s var(--ease-smooth);

            /* Rapid smooth entrance on load */
            animation: rapidCascadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .apple-panel:nth-child(1) { animation-delay: 0.04s; }
        .apple-panel:nth-child(2) { animation-delay: 0.10s; }
        .apple-panel:nth-child(3) { animation-delay: 0.16s; }
        .apple-panel:nth-child(4) { animation-delay: 0.22s; }

        @keyframes rapidCascadeIn {
            0% {
                opacity: 0;
                transform: translate3d(0, 16px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* Lift-up & BORDER ONLY APPEARS when cursor reaches the panel (Img 3) */
        @media (hover: hover) and (pointer: fine) {
            .apple-panel:hover {
                transform: translate3d(0, -6px, 0);
                border-color: var(--panel-border-hover) !important;
                background-color: var(--panel-bg);
                box-shadow: none !important;
            }

            .apple-panel:hover .panel-icon-wrap {
                transform: scale3d(1.05, 1.05, 1);
            }

            .footer-links-row a:hover .nav-text,
            .brand-pill:hover .nav-text {
                transform: scale3d(1.05, 1.05, 1) !important;
            }
        }

        /* Touch / tap: BORDER ONLY APPEARS with smooth lift */
        .apple-panel:active,
        .apple-panel.is-card-lifted {
            transform: translate3d(0, -6px, 0) !important;
            border-color: var(--panel-border-hover) !important;
            background-color: var(--panel-bg);
            box-shadow: none !important;
        }

        .apple-panel.is-card-lifted .panel-icon-wrap {
            transform: scale3d(1.05, 1.05, 1) !important;
        }

        /* Artwork Stages & Rapid Smooth Icon Loading */
        .panel-artwork-stage {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-top: 4px;
        }

        .panel-icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.55s var(--ease-smooth);
        }

        /* Smooth rapid entrance for icons without stuttering */
        @keyframes iconSmoothIn {
            0% {
                opacity: 0;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .panel-icon-wrap img {
            width: 105px;
            height: 105px;
            object-fit: contain;
            transition: transform 0.55s var(--ease-smooth);
            filter: none !important;
            -webkit-filter: none !important;
            animation: iconSmoothIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .apple-panel:nth-child(1) .panel-icon-wrap img { animation-delay: 0.08s; }
        .apple-panel:nth-child(2) .panel-icon-wrap img { animation-delay: 0.14s; }
        .apple-panel:nth-child(3) .panel-icon-wrap img { animation-delay: 0.20s; }
        .apple-panel:nth-child(4) .panel-icon-wrap img { animation-delay: 0.26s; }

        body.light-mode .panel-icon-wrap img {
            filter: none !important;
            -webkit-filter: none !important;
        }

        .panel-bottom-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-bottom: 6px;
            width: 100%;
        }

        .panel-title {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-main);
            line-height: 1.15;
            transition: color 0.8s var(--ease-smooth);
        }

        .panel-subtext {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            transition: color 0.8s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           5. FOOTER
           ------------------------------------------------------------- */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 18px; 
            width: 100%; 
            padding-top: 24px;
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 28px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { 
            color: var(--text-muted); 
            opacity: 0.6; 
            font-size: 12px; 
            letter-spacing: 0.2px; 
            transition: color 0.8s var(--ease-smooth); 
        }

        .nav-text {
            display: inline-block !important;
            white-space: normal;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted) !important; white-space: nowrap !important; }
        .footer-links-row a:hover .nav-text { color: var(--text-main) !important; }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        /* -------------------------------------------------------------
           6. MOBILE VIEWPORT (< 700px):
           Sleek Vertical Rectangles Aligned Perfectly With s. & Nutrition
           ------------------------------------------------------------- */
        @media (max-width: 700px) {
            body {
                padding: 26px 18px 20px 18px;
            }

            .brand-pill {
                font-size: 36px;
            }

            .brand-dot {
                width: 7px;
                height: 7px;
                vertical-align: -1px;
            }

            .workspace-heading-area {
                margin-top: 36px;
                margin-bottom: 16px;
            }

            .page-main-heading {
                font-size: 18px;
            }

            main {
                padding: 6px 0 16px 0;
            }

            .panels-scroll-track {
                gap: 16px;
                padding-top: 10px;
                padding-bottom: 18px;
            }

            .apple-panel {
                width: 210px !important;
                min-width: 210px !important;
                max-width: 210px !important;
                height: 320px !important;
                min-height: 320px !important;
                aspect-ratio: 1 / 1.48 !important;
                padding: 24px 16px 20px 16px !important;
                border-radius: 20px !important;
            }

            .panel-icon-wrap img {
                width: 90px !important;
                height: 90px !important;
            }

            .panel-title {
                font-size: 21px !important;
            }

            .panel-subtext {
                font-size: 12px !important;
            }
        }
    </style>
</head>

    <!-- Interactive Navigation & Theme Engine -->
    <script>
        // -------------------------------------------------------------
        // 1. AUTOMATIC DEVICE THEME DETECTOR
        // -------------------------------------------------------------
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        function applyDeviceTheme() {
            const saved = sessionStorage.getItem('dashboard-theme');
            if (saved) {
                bodyElement.classList.toggle('light-mode', saved === 'light');
                document.documentElement.classList.toggle('light-mode', saved === 'light');
            } else {
                bodyElement.classList.toggle('light-mode', systemLightQuery.matches);
                document.documentElement.classList.toggle('light-mode', systemLightQuery.matches);
            }
        }

        applyDeviceTheme();
        systemLightQuery.addEventListener('change', applyDeviceTheme);

        // -------------------------------------------------------------
        // 2. BREADCRUMB SESSION STATE INITIALIZATION FOR NUTRITION
        // -------------------------------------------------------------
        try {
            sessionStorage.setItem('breadcrumbTrail', JSON.stringify([
                { name: "Home", path: "/nutrition/index.html" }
            ]));
        } catch (e) {}

        // -------------------------------------------------------------
        // 3. CLICK INTERACTIONS & FLUID WAVE TRANSITIONS
        // -------------------------------------------------------------
        const cards = Array.from(document.querySelectorAll('.apple-panel'));

        cards.forEach((card, idx) => {
            card.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                
                // If it's a placeholder link (Calories, Protein, Fiber):
                if (!destination || destination === '#' || destination.startsWith('javascript:')) {
                    e.preventDefault();
                    return;
                }

                // If navigating to mm.html (Track):
                e.preventDefault();
                cards.forEach(l => {
                    l.classList.remove('is-wave-loading');
                    l.classList.remove('is-card-lifted');
                });

                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');
                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        // Other target links (footer, brand pill)
        const otherTargetLinks = document.querySelectorAll('.brand-pill, footer .footer-links-row a');
        otherTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('javascript:')) return;

                e.preventDefault();
                this.classList.add('is-card-lifted');
                this.classList.add('is-wave-loading');
                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                setTimeout(() => {
                    window.location.href = destination;
                }, 700);
            });
        });

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight;
                requestAnimationFrame(() => {
                    document.querySelectorAll('.is-wave-loading, .is-card-lifted').forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('is-card-lifted');
                    });
                });
            });
        });
    </script>
    <script src="/script.js"></script>
</body>
</html>
