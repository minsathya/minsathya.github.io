    <!-- Instant Theme Evaluation to Prevent Theme Flash on Reload -->
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
        } catch(e) {}
        window.scrollTo(0, 0);

        const activeTheme = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const isLight = (activeTheme === 'light' || (!activeTheme && prefersLight));
        if (isLight) {
          document.documentElement.classList.add('light-mode');
          document.documentElement.style.setProperty('color-scheme', 'light');
        } else {
          document.documentElement.classList.remove('light-mode');
          document.documentElement.style.setProperty('color-scheme', 'dark');
        }
      })();
    </script>

      const favicon = document.getElementById('favicon');
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)');

        favicon.href = e.matches ? '../favicon-dark.png?v=3' : '../favicon-light.png?v=3';

      updateFavicon(darkMode);

    </script>

    <style>
        /* Sleek scrollbar matching background with zero edge strip */
        html,
        body {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0;
            background-color: var(--bg-color) !important;
            transition: none !important;
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) #0b0b0b;
            color-scheme: dark;
        }
        html.light-mode,
        html.light-mode body,
        body.light-mode {
            --bg-color: #f5f5f7 !important;
            background-color: #f5f5f7 !important;
            color-scheme: light !important;
            scrollbar-color: rgba(0, 0, 0, 0.22) #f5f5f7 !important;
        }
        html:not(.light-mode),
        html:not(.light-mode) body,
        body:not(.light-mode) {
            --bg-color: #0b0b0b !important;
            background-color: #0b0b0b !important;
            color-scheme: dark !important;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background-color: #0b0b0b !important; }
        html.light-mode ::-webkit-scrollbar-track, 
        html.light-mode body ::-webkit-scrollbar-track,
        body.light-mode ::-webkit-scrollbar-track { background-color: #f5f5f7 !important; }
        ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2) !important; border-radius: 4px; }
        html.light-mode ::-webkit-scrollbar-thumb, 
        html.light-mode body ::-webkit-scrollbar-thumb,
        body.light-mode ::-webkit-scrollbar-thumb { background-color: rgba(0, 0, 0, 0.22) !important; }

        /* Article Main Heading Panels (from Important Facts onwards) */
        .section-heading-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
        }
        .panel-heading-title {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-main);
            margin: 0;
            line-height: 1.3;
        }
        :root {
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #88888e;
            --panel-bg: #121212;
            --panel-border: #222222;
            --panel-border-hover: rgba(255, 255, 255, 0.14);
            --heading-accent-bar: #8aafe8;
            --item-card-bg: rgba(255, 255, 255, 0.03);
            --item-card-hover: rgba(255, 255, 255, 0.05);
            --row-divider: #1c1c1c;

            /* Brand Green Tokens */
            --theme-green: #244b40;
            --theme-green-hover: #2e5c50;
            --btn-blue: #244b40;
            --btn-blue-hover: #2e5c50;
            --pill-selected-bg: #244b40;

            --pill-bg: rgba(255, 255, 255, 0.06);
            --pill-border: rgba(255, 255, 255, 0.08);
            --accent-tag-bg: #1c2720;
            --accent-tag-text: #6ec981;
        }

        html.light-mode,
        body.light-mode {
            --bg-color: #f5f5f7;
            --text-main: #111111;
            --text-muted: #77777e;
            --panel-bg: #ffffff;
            --panel-border: #e2e2e7;
            --panel-border-hover: rgba(0, 0, 0, 0.12);
            --heading-accent-bar: #0064ff;
            --item-card-bg: rgba(0, 0, 0, 0.025);
            --item-card-hover: rgba(0, 0, 0, 0.045);
            --row-divider: #f2f2f7;

            /* Light mode Brand Green */
            --theme-green: #296556;
            --theme-green-hover: #1e4d42;
            --btn-blue: #296556;
            --btn-blue-hover: #1e4d42;
            --pill-selected-bg: #296556;

            --pill-bg: rgba(0, 0, 0, 0.05);
            --pill-border: rgba(0, 0, 0, 0.08);
            --accent-tag-bg: #e2ede5;
            --accent-tag-text: #1d6e35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
            outline: none;
        }

        html {
            background-color: var(--bg-color) !important;
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-y: auto;
            transition: none !important;
        }

        body {
            background-color: var(--bg-color) !important;
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px 36px 24px !important;
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            box-sizing: border-box !important;
            -webkit-font-smoothing: antialiased;
            overflow-x: clip;
            transition: none !important;
        }

        .page-wrapper {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: calc(100vh - 76px);
            position: relative;
            background: transparent !important;
        }

        /* TOP NAVIGATION */
        .top-nav-bar {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 28px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            height: auto;
            padding: 0 4px;
            background-color: transparent !important;
            border: none !important;
            text-decoration: none !important;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: -0.8px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transform: translateZ(0);
            transition: transform 0.45s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:active {
            transform: translate3d(0, -3px, 0) scale3d(1.02, 1.02, 1);
        }

        .brand-letter {
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif !important;
            line-height: 1;
            transition: color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Round Twinkling Star (Scales small to large in #ff9e79 with soft glow) */
        .brand-star {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff9e79;
            box-shadow: 0 0 6px rgba(255, 158, 121, 0.75), 0 0 12px rgba(255, 158, 121, 0.4);
            margin-left: 2px;
            margin-bottom: 0;
            vertical-align: -1px;
            flex-shrink: 0;
            line-height: 1;
            transform-origin: center center;
            animation: roundStarPulse 3s infinite ease-in-out alternate;
        }

        @keyframes roundStarPulse {
            0% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
            50% {
                transform: scale(1.0) translateZ(0);
                opacity: 1;
                box-shadow: 0 0 8px rgba(255, 158, 121, 0.85), 0 0 14px rgba(255, 158, 121, 0.45);
            }
            100% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
        }

        /* STANDARDIZED HEADER ROW WITH BACK BUTTON */
        .page-header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 24px auto;
            position: relative;
            z-index: 5;
        }

        .back-icon-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            padding: 0;
            margin: 0;
            flex-shrink: 0;
            transition: background-color 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
        }

        .back-icon-btn:hover {
            background-color: var(--item-card-hover, rgba(255, 255, 255, 0.08));
            transform: translate3d(-2px, 0, 0);
        }

        .back-icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .page-title {
            font-size: 28px !important;
            font-weight: 500 !important;
            letter-spacing: -0.6px !important;
            color: var(--text-main);
            line-height: 1.25 !important;
            margin: 0;
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        @media (max-width: 700px) {
            .page-title {
                font-size: 21px !important;
                line-height: 1.35 !important;
            }
        }

        /* CONTENT CONTAINER - UNIFIED 1000PX WIDTH */
        .content-wrapper {
            position: relative;
            z-index: 100;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* ---------------------------------------------------- */
        /* CATEGORY & CONTROLS ROW                             */
        /* ---------------------------------------------------- */
        .category-row {
            position: relative;
            z-index: 105;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            position: relative;
            z-index: 100;
        }

        .category-title-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            user-select: none;
            -webkit-user-select: none;
        }

        .category-controls-cluster {
            position: relative;
            z-index: 110;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 110;
        }

        /* Sort Button */
        .sort-action-btn {
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.2s var(--ease-smooth), background-color 0.2s ease, border-color 0.2s ease;
        }
        .sort-action-btn:hover {
            background-color: var(--item-card-hover);
        }
        .sort-action-btn:active {
            transform: scale(0.92);
        }
        .sort-action-btn svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.28s var(--ease-smooth);
        }
        .sort-action-btn.is-asc svg {
            transform: rotate(180deg);
        }

        /* Calendar Trigger Button */
        .cal-trigger-action-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s var(--ease-smooth), opacity 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        .cal-trigger-action-btn:hover {
            transform: scale(1.05);
        }
        .cal-trigger-action-btn:active {
            transform: scale(0.92);
        }
        .cal-trigger-action-btn svg {
            width: 32px;
            height: 32px;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
        }
        .cal-active-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
            display: none;
        }
        .cal-active-dot.is-visible {
            display: block;
        }
        html.light-mode .cal-active-dot,
        body.light-mode .cal-active-dot {
            background-color: #000000;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
        }

        /* Category Dropdown Pill */
        .day-action-wrap {
            position: relative;
            z-index: 120;
        }

        .day-action-btn {
            background: var(--btn-blue);
            color: #ffffff !important;
            border: none;
            outline: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 68px;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.2s var(--ease-smooth), opacity 0.2s ease, background-color 0.2s ease;
        }
        .day-action-btn:active {
            transform: scale(0.94);
            opacity: 0.9;
        }
        .day-action-chevron {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.25s var(--ease-smooth);
        }
        .day-action-btn.is-expanded .day-action-chevron {
            transform: rotate(180deg);
        }

        /* Floating Backdrop for category menu blur (Restored to exact smooth behavior) */
        .floating-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .floating-backdrop.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        body.category-menu-open .category-title-text,
        body.category-menu-open .sort-action-btn,
        body.category-menu-open .sort-action-wrap,
        body.category-menu-open .cal-trigger-action-btn,
        body.category-menu-open .today-action-btn,
        body.category-menu-open .page-header-row,
        body.category-menu-open .organised-ca-cards-list {
            filter: blur(8px);
            opacity: 0.55;
            transition: filter 0.28s var(--ease-smooth), opacity 0.28s var(--ease-smooth);
        }

        .category-title-text,
        .sort-action-btn,
        .sort-action-wrap,
        .cal-trigger-action-btn,
        .today-action-btn,
        .page-header-row,
        .organised-ca-cards-list {
            transition: filter 0.28s var(--ease-smooth), opacity 0.28s var(--ease-smooth);
        }

        /* Floating Category Dropdown Panel */
        .floating-days-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 230px;
            max-width: calc(100vw - 36px);
            width: max-content;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 8px 6px;
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
            z-index: 130 !important;
            display: none;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body.light-mode .floating-days-panel {
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.12);
        }
        .floating-days-panel.is-open {
            display: flex;
            flex-direction: column;
            animation: floatingMasterEntrance 0.32s var(--ease-smooth) forwards;
            pointer-events: auto;
        }
        .floating-days-panel.is-closing {
            display: flex;
            flex-direction: column;
            animation: floatingMasterExit 0.2s var(--ease-smooth) forwards;
            pointer-events: none;
        }
        @keyframes floatingMasterEntrance {
            0% { opacity: 0; transform: translate3d(0, 14px, 0); }
            100% { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        @keyframes floatingMasterExit {
            0% { opacity: 1; transform: translate3d(0, 0, 0); }
            100% { opacity: 0; transform: translate3d(0, 10px, 0); }
        }

        .day-item-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        .day-item-btn:hover,
        .day-item-btn:focus-visible,
        .day-item-btn:active {
            background-color: rgba(255, 255, 255, 0.12) !important;
        }
        body.light-mode .day-item-btn:hover,
        body.light-mode .day-item-btn:focus-visible,
        body.light-mode .day-item-btn:active,
        html.light-mode .day-item-btn:hover,
        html.light-mode .day-item-btn:focus-visible,
        html.light-mode .day-item-btn:active {
            background-color: rgba(0, 0, 0, 0.08) !important;
        }
        .day-item-btn.is-selected {
            background-color: var(--pill-selected-bg) !important;
            color: #ffffff !important;
        }
        body.light-mode .day-item-btn.is-selected {
            background-color: var(--btn-blue) !important;
            color: #ffffff !important;
        }

        .category-item-count-badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--pill-bg);
            padding: 2px 7px;
            border-radius: 10px;
            line-height: 1.2;
            flex-shrink: 0;
        }
        .day-item-btn.is-selected .category-item-count-badge {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }

        /* ---------------------------------------------------- */
        /* CARDS LIST & SINGLE COLUMN RESPONSIVE DIMENSIONS     */
        /* ---------------------------------------------------- */
        .ca-empty-state-notice {
            padding: 60px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15.5px;
            font-weight: 500;
            letter-spacing: -0.2px;
            animation: masterEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .organised-ca-cards-list {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        /* Card: Outer Panel (Panel pressing animation exactly like Today button) */
        .organised-ca-card {
            position: relative;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 26px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            text-decoration: none !important;
            box-sizing: border-box;
            width: 100%;
            min-height: 104px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;

            will-change: transform;
            transition: transform 0.15s ease,
                        background-color 0.25s ease,
                        border-color 0.25s ease;
        }

        @media (hover: hover) {
            .organised-ca-card:hover {
                border-color: rgba(255, 255, 255, 0.12);
            }
            body.light-mode .organised-ca-card:hover {
                border-color: rgba(0, 0, 0, 0.12);
            }
        }

        .organised-ca-card:active,
        .organised-ca-card.is-card-pressed {
            transform: scale(0.95) !important;
            transition: transform 0.15s ease !important;
        }

        /* Left thumbnail / placeholder */
        .organised-ca-card-left-thumb {
            flex-shrink: 0;
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .ca-card-thumb-img {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            object-fit: cover;
            display: block;
            border: 1px solid var(--panel-border);
        }
        .ca-card-no-image {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            background-color: var(--item-card-bg);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
        }
        .ca-card-no-image svg { opacity: 0.6; }
        .ca-card-no-image-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Right content: Title vertically centered to thumbnail */
        .organised-ca-card-right-content {
            flex: 1;
            min-width: 0;
            min-height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 90px;
            box-sizing: border-box;
        }
        .organised-ca-card-title {
            font-size: 15.5px;
            font-weight: 500;
            line-height: 1.38;
            color: var(--text-main);
            margin: 0;
            text-align: left;
            text-wrap: wrap !important;
            hyphens: none !important;
            -webkit-hyphens: none !important;
            word-break: normal !important;
            overflow-wrap: break-word !important;
            display: inline-block;
            width: fit-content;
            max-width: 100%;
            transition: color 0.25s ease;
        }

        /* Bottom-Right Date Tag */
        .organised-ca-card-footer {
            position: absolute;
            right: 18px;
            bottom: 12px;
            display: flex;
            align-items: center;
        }
        .note-card-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            white-space: nowrap;
        }

        /* ---------------------------------------------------- */
        /* ARTICLE DETAIL VIEW (SLIDE-UP ENTRANCE, EXACT GAP)   */
        /* ---------------------------------------------------- */
        #organisedCaArticleView {
            display: none;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            flex-direction: column;
        }
        #organisedCaArticleView.is-active {
            display: flex;
        }

        .article-slide-up-run {
            animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            will-change: transform, opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        @keyframes masterEntrance {
            0% {
                opacity: 0;
                transform: translate3d(0, 26px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        @-webkit-keyframes articleSlideUpEntrance {
            0% {
                opacity: 0;
                -webkit-transform: translate3d(0, 24px, 0);
            }
            100% {
                opacity: 1;
                -webkit-transform: translate3d(0, 0, 0);
            }
        }

        @keyframes cardsSlideUpEntrance {
            0% {
                opacity: 0;
                transform: translate3d(0, 22px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* Controls Panel: EXACT 24px margin to title */
        /* Redesigned Article Controls Panel */
        .ca-controls-panel {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin-bottom: 24px !important;
            transition: background-color 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth);
        }

        .ca-panel-layout {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .ca-panel-thumb {
            width: 240px;
            height: 148px;
            min-width: 240px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ca-panel-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

        .ca-panel-thumb .ca-thumb-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
        }

        .ca-panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            min-width: 0;
            min-height: 148px;
            box-sizing: border-box;
            padding: 2px 0;
        }

        .ca-panel-meta-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }

        .meta-pill {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-pill strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .read-toggle-pill {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 4px 6px 4px 14px;
            border-radius: 18px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .ca-direct-action-btn,
        .read-action-btn {
            background: var(--btn-blue) !important;
            color: #ffffff !important;
            border: none;
            outline: none;
            padding: 5px 0;
            border-radius: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none !important;
            user-select: none;
            -webkit-user-select: none;
            min-width: 68px;
            width: 68px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            transform-origin: center center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent !important;
            transition: transform 0.18s var(--ease-smooth), opacity 0.18s ease;
        }

        .ca-direct-action-btn:hover,
        .read-action-btn:hover {
            opacity: 0.94;
        }

        .ca-direct-action-btn:active,
        .read-action-btn:active {
            transform: scale(0.93) !important;
            opacity: 0.9;
        }

        html.light-mode .meta-pill,
        body.light-mode .meta-pill,
        html.light-mode .read-toggle-pill,
        body.light-mode .read-toggle-pill {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.05);
        }

        html.light-mode .ca-panel-thumb,
        body.light-mode .ca-panel-thumb {
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.06);
        }

        /* Today Action Button */
        .today-action-btn {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 7px 16px;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.2s var(--ease-smooth), border-color 0.2s var(--ease-smooth), transform 0.15s ease;
        }

        .today-action-btn:hover {
            background-color: var(--item-card-hover, rgba(255, 255, 255, 0.08));
        }

        .today-action-btn:active {
            transform: scale(0.95);
        }

        .today-action-btn.is-active {
            background-color: var(--btn-blue, #258BF5) !important;
            color: #ffffff !important;
            border-color: transparent !important;
        }

        /* ARTICLE CONTENT AREA: Rest on background without boxed panel */
        .ca-article-feed-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-top: 0;
        }

        .article-title {
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-size: 24px !important;
            font-weight: 500 !important;
            letter-spacing: -0.35px !important;
            color: var(--text-main) !important;
            line-height: 1.34 !important;
            margin-top: 0 !important;
            margin-bottom: 20px !important;
            text-align: left !important;
        }

        /* 
           The Anti-Jerk Mechanism: CSS Grid Row Animation
           Smoothly scales container height between content states dynamically.
        */
        .grid-animator {
            display: block;
            width: 100%;
        }

        .grid-content {
            width: 100%;
            min-height: 100%;
        }

        /* Cross-fading View Panes */
        .view-pane {
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            width: 100%;
        }

        /* Active Text State */
        .view-pane.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Safe dynamic layout collapsing without layout snaps */
        .view-pane.hidden-layout {
            height: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        /* Standard Typography */
        .note-section {
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--row-divider);
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            width: 100%;
        }
        .note-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-heading {
            position: relative;
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            margin-bottom: 6px;
            text-align: left;
        }

        .section-heading::before {
            content: '';
            display: inline-block;
            width: 3.5px;
            height: 16px;
            background-color: var(--heading-accent-bar, #8aafe8);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* Matching Font Size for ALL content including Important Facts downwards */
        .note-p,
        .point-bullet-item,
        .info-callout-row {
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.92;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            text-align: left;
        }

        .point-bullet-item {
            position: relative;
            padding-left: 18px;
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.92;
            text-align: left;
            margin-bottom: 6px;
        }

        .point-bullet-item::before {
            content: "•";
            position: absolute;
            left: 3px;
            top: 0;
            font-size: 15px;
            color: var(--text-main);
        }

        .point-subheading {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.8;
            color: var(--text-main) !important;
            margin-top: 12px;
            margin-bottom: 6px;
            text-align: left;
        }

        .point-subheading::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 14px;
            background-color: var(--heading-accent-bar, #8aafe8);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .info-callout-row strong {
            color: var(--text-main) !important;
        }

        .point-sublist {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .info-callout {
            background: transparent !important;
            border: none !important;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-callout-row strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* ---------------------------------------------------- */
        /* DRUM WHEEL DATE PICKER MODAL (TAP-TO-SELECT ENABLED) */
        /* ---------------------------------------------------- */
        .picker-backdrop {
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            margin: 0 !important;
            background: rgba(0, 0, 0, 0.65) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 99999 !important;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        backdrop-filter 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        -webkit-backdrop-filter 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px;
            box-sizing: border-box;
        }
        .picker-backdrop.is-open {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        .picker-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: auto !important;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 24px 20px 28px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translate3d(0, 48px, 0) scale(0.97);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
            box-sizing: border-box;
        }
        .picker-backdrop.is-open .picker-card {
            opacity: 1 !important;
            transform: translate3d(0, 0, 0) scale(1) !important;
        }
        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 6px;
        }
        .picker-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
        }
        .picker-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .picker-clear-btn {
            background: transparent;
            border: 1px solid var(--pill-border);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .picker-clear-btn:hover {
            color: var(--text-main);
            border-color: var(--panel-border-hover);
        }
        .picker-apply-btn {
            background: var(--btn-blue) !important;
            color: #ffffff !important;
            border: none;
            padding: 6px 18px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }
        .picker-apply-btn:active {
            transform: scale(0.94);
        }
        .picker-col-headers {
            display: grid;
            grid-template-columns: 1fr 1.35fr 1fr;
            width: 100%;
            margin-bottom: 6px;
            padding: 0 4px;
        }
        .picker-col-hdr {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .picker-drum-stage {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.35fr 1fr;
            height: 200px;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.25);
            mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
        }
        html.light-mode .picker-drum-stage {
            background: rgba(0, 0, 0, 0.04);
        }
        .picker-center-capsule {
            position: absolute;
            top: 50%;
            left: 8px;
            right: 8px;
            height: 48px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            pointer-events: none;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        html.light-mode .picker-center-capsule {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.06);
        }
        .drum-column {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            touch-action: pan-y;
            overscroll-behavior-y: contain;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            padding: 76px 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .drum-column::-webkit-scrollbar {
            display: none;
        }
        .drum-cell {
            width: 100%;
            height: 48px;
            min-height: 48px;
            max-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 19px;
            font-weight: 500;
            color: var(--text-muted);
            scroll-snap-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.2s;
        }
        .drum-cell.is-selected {
            color: var(--text-main);
            font-weight: 600;
        }

        /* ---------------------------------------------------- */
        /* FOOTER                                               */
        /* ---------------------------------------------------- */
        footer {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 36px;
            padding-top: 6px;
            border-top: none !important;
        }
        .footer-links-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .footer-links-row a {
            color: var(--text-muted);
            font-size: 13.5px;
            text-decoration: none !important;
            transition: color 0.2s ease;
        }
        .footer-links-row a:hover {
            color: var(--text-main);
        }
        .copyright-tag {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.7;
        }

        @media (max-width: 700px) {
            body { padding: 24px 16px 20px 16px; }
            .page-title {
                font-size: 24px !important;
                letter-spacing: -0.5px !important;
            }
            footer {
                margin-top: 28px;
                padding-top: 6px;
            }
            .footer-links-row {
                display: flex !important;
                flex-wrap: nowrap !important;
                justify-content: flex-start !important;
                align-items: center !important;
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch !important;
                width: 100vw !important;
                max-width: 100vw !important;
                margin-left: -16px !important;
                margin-right: -16px !important;
                padding: 6px 16px !important;
                gap: 20px !important;
                scrollbar-width: none !important;
                box-sizing: border-box !important;
            }
            .footer-links-row::-webkit-scrollbar {
                display: none !important;
            }
            .footer-links-row a {
                white-space: nowrap !important;
                flex-shrink: 0 !important;
            }
            .brand-pill { font-size: 34px; }
            .category-row { max-width: 100%; margin-bottom: 16px; }
            .organised-ca-card { padding: 12px 14px; min-height: 96px; gap: 12px; }
            .organised-ca-card-left-thumb { width: 70px; height: 70px; }
            .ca-card-thumb-img, .ca-card-no-image { width: 70px; height: 70px; border-radius: 16px; }
            .organised-ca-card-right-content { min-height: 70px; padding-right: 76px; }
            .organised-ca-card-title { font-size: 14.5px; }
            .note-p, .point-bullet-item, .info-callout-row, .point-subheading { font-size: 15.5px; }
            .ca-panel-layout { flex-direction: column; align-items: flex-start; gap: 14px; }
            .ca-panel-thumb { width: 100%; height: 130px; min-width: 100%; }
        }
            @media (min-width: 769px) { .brand-pill { font-size: 36px; } }
    </style>
</head>
<body>
    <div class="page-wrapper" id="pageWrapper">
        <!-- Floating Backdrop for Category Menu Blur -->
        <div class="floating-backdrop" id="floatingBackdrop" onclick="closeOrganisedCaCategoryDropdown()"></div>

        <!-- Standardized Page Header Row -->
        <div class="page-header-row" id="pageHeaderRow">
            <button type="button" class="back-icon-btn" id="headerBackBtn" onclick="handleOrganisedBack()" aria-label="Go back">
                <svg viewBox="0 0 24 24">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h1 class="page-title" id="pageTitleText">Daily current affairs</h1>
        </div>

        <main class="content-wrapper">
            <!-- 1. DIRECTORY / LIST VIEW -->
            <div id="organisedCaDirectoryView">
                <!-- Category, Sort, and Calendar Row -->
                <div class="category-row">
                    <span class="category-title-text" id="categoryHeaderLabel">Category</span>

                    <div class="category-controls-cluster">
                        <!-- Sort Button: Toggles New to Old <-> Old to New -->
                        <button type="button" class="sort-action-btn" id="orgSortBtn" onclick="toggleOrganisedCaSort()" aria-label="Toggle Date Sort Order">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 6h18M6 12h12M9 18h6"/>
                            </svg>
                        </button>

                        <!-- Calendar Icon Button: Opens Drum Wheel Date Picker -->
                        <button type="button" class="cal-trigger-action-btn" id="orgCalendarBtn" onclick="openOrganisedCaDatePicker()" aria-label="Filter by Date">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- 3. DRUM WHEEL DATE PICKER MODAL (Mounted directly under body for perfect viewport centering) -->
    <div class="picker-backdrop" id="orgPickerModal" onclick="if(event.target===this)closeOrganisedCaDatePicker()">
        <div class="picker-card" onclick="event.stopPropagation()">
            <div class="picker-header">
                <span class="picker-title">Select Date</span>
                <div class="picker-header-actions">
                    <button type="button" class="picker-clear-btn" onclick="clearOrganisedCaDateFilter()">All Dates</button>
                    <button type="button" class="picker-apply-btn" id="orgPickerApplyBtn" onclick="applyOrganisedCaDateFilter()">Apply</button>
                </div>

            <div class="picker-col-headers">
                <div class="picker-col-hdr">Day</div>
                <div class="picker-col-hdr">Month</div>
                <div class="picker-col-hdr">Year</div>

            <div class="picker-drum-stage">
                <div class="picker-center-capsule"></div>
                <div class="drum-column" id="orgDayCol"></div>

                <div class="drum-column" id="orgYearCol"></div>
