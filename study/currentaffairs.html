<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Organised Current Affairs - sathya.</title>

    <!-- Instant Theme Evaluation to Prevent Theme Flash on Reload -->
    <script>
      (function() {
        const activeTheme = sessionStorage.getItem('dashboard-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const isLight = (activeTheme === 'light' || (!activeTheme && prefersLight));
        if (isLight) {
          document.documentElement.classList.add('light-mode');
        }
        document.documentElement.style.backgroundColor = isLight ? '#f5f5f7' : '#0b0b0b';
      })();
    </script>

    <meta name="description" content="Organised Current Affairs for UPSC Civil Services Examination.">
    <meta name="keywords" content="UPSC current affairs, Organised current affairs, Prelims, Mains, Civil Services.">

    <!-- Google Tag (gtag.js) -->

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <!-- Favicon Engine -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=3">
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png?v=3">
    <link id="favicon" rel="icon" type="image/png" href="/favicon-light.png?v=3">
    <script>
      const favicon = document.getElementById('favicon');
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)');
      function updateFavicon(e) {
        favicon.href = e.matches ? '../favicon-dark.png?v=3' : '../favicon-light.png?v=3';
      }
      updateFavicon(darkMode);
      darkMode.addEventListener('change', updateFavicon);
    </script>

    <!-- Google Fonts: Google Sans Flex -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Pre-load Current Affairs Knowledge Base -->
    <script src="/study/study-data.js"></script>

    <style>
        :root {
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #88888e;
            --panel-bg: #121212;
            --panel-border: #222222;
            --panel-border-hover: rgba(255, 255, 255, 0.14);
            --item-card-bg: rgba(255, 255, 255, 0.03);
            --item-card-hover: rgba(255, 255, 255, 0.05);
            --row-divider: #1c1c1c;

            /* Brand Green Tokens */
            --theme-green: #244b40;
            --theme-green-hover: #2e5c50;
            --btn-blue: #244b40;
            --btn-blue-hover: #2e5c50;
            --pill-selected-bg: #244b40;

            --pill-bg: rgba(255, 255, 255, 0.06);
            --pill-border: rgba(255, 255, 255, 0.08);
            --accent-tag-bg: #1c2720;
            --accent-tag-text: #6ec981;
        }

        html.light-mode,
        body.light-mode {
            --bg-color: #f5f5f7;
            --text-main: #111111;
            --text-muted: #77777e;
            --panel-bg: #ffffff;
            --panel-border: #e2e2e7;
            --panel-border-hover: rgba(0, 0, 0, 0.12);
            --item-card-bg: rgba(0, 0, 0, 0.025);
            --item-card-hover: rgba(0, 0, 0, 0.045);
            --row-divider: #f2f2f7;

            /* Light mode Brand Green */
            --theme-green: #296556;
            --theme-green-hover: #1e4d42;
            --btn-blue: #296556;
            --btn-blue-hover: #1e4d42;
            --pill-selected-bg: #296556;

            --pill-bg: rgba(0, 0, 0, 0.05);
            --pill-border: rgba(0, 0, 0, 0.08);
            --accent-tag-bg: #e2ede5;
            --accent-tag-text: #1d6e35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
            outline: none;
        }

        html {
            background-color: #0b0b0b;
        }
        html.light-mode {
            background-color: #f5f5f7;
        }
        html {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px 36px 24px;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: clip;
            transition: background-color 0.4s var(--ease-smooth), color 0.4s var(--ease-smooth);
        }

        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: calc(100vh - 76px);
            position: relative;
        }

        /* TOP NAVIGATION */
        .top-nav-bar {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 28px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            height: auto;
            padding: 0 4px;
            background-color: transparent !important;
            border: none !important;
            text-decoration: none !important;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: -0.8px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transform: translateZ(0);
            transition: transform 0.45s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:active {
            transform: translate3d(0, -3px, 0) scale3d(1.02, 1.02, 1);
        }

        .brand-letter {
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif !important;
            line-height: 1;
            transition: color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Round Twinkling Star (Scales small to large in #ff9e79 with soft glow) */
        .brand-star {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff9e79;
            box-shadow: 0 0 6px rgba(255, 158, 121, 0.75), 0 0 12px rgba(255, 158, 121, 0.4);
            margin-left: 2px;
            margin-bottom: 0;
            vertical-align: -1px;
            flex-shrink: 0;
            line-height: 1;
            transform-origin: center center;
            animation: roundStarPulse 3s infinite ease-in-out alternate;
        }

        @keyframes roundStarPulse {
            0% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
            50% {
                transform: scale(1.0) translateZ(0);
                opacity: 1;
                box-shadow: 0 0 8px rgba(255, 158, 121, 0.85), 0 0 14px rgba(255, 158, 121, 0.45);
            }
            100% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
        }

        /* STANDARDIZED HEADER ROW WITH BACK BUTTON */
        .page-header-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 24px auto;
            position: relative;
            z-index: 5;
        }

        .back-icon-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            padding: 0;
            flex-shrink: 0;
            transition: background-color 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
        }

        .back-icon-btn:hover {
            background-color: var(--item-card-hover, rgba(255, 255, 255, 0.08));
            transform: translate3d(-2px, 0, 0);
        }

        .back-icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .page-title {
            font-size: 28px !important;
            font-weight: 500 !important;
            letter-spacing: -0.6px !important;
            color: var(--text-main);
            line-height: 1.2 !important;
        }

        /* CONTENT CONTAINER - UNIFIED 1000PX WIDTH */
        .content-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 60px auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* ---------------------------------------------------- */
        /* CATEGORY & CONTROLS ROW                             */
        /* ---------------------------------------------------- */
        .category-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            position: relative;
            z-index: 100;
        }

        .category-title-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            user-select: none;
            -webkit-user-select: none;
        }

        .category-controls-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 110;
        }

        /* Sort Button */
        .sort-action-btn {
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.2s var(--ease-smooth), background-color 0.2s ease, border-color 0.2s ease;
        }
        .sort-action-btn:hover {
            background-color: var(--item-card-hover);
        }
        .sort-action-btn:active {
            transform: scale(0.92);
        }
        .sort-action-btn svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.28s var(--ease-smooth);
        }
        .sort-action-btn.is-asc svg {
            transform: rotate(180deg);
        }

        /* Calendar Trigger Button */
        .cal-trigger-action-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s var(--ease-smooth), opacity 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        .cal-trigger-action-btn:hover {
            transform: scale(1.05);
        }
        .cal-trigger-action-btn:active {
            transform: scale(0.92);
        }
        .cal-trigger-action-btn svg {
            width: 32px;
            height: 32px;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
        }
        .cal-active-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4caf50;
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.8);
            display: none;
        }
        .cal-active-dot.is-visible {
            display: block;
        }

        /* Category Dropdown Pill */
        .day-action-wrap {
            position: relative;
            z-index: 110;
        }

        .day-action-btn {
            background: var(--btn-blue);
            color: #ffffff !important;
            border: none;
            outline: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 68px;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.2s var(--ease-smooth), opacity 0.2s ease, background-color 0.2s ease;
        }
        .day-action-btn:active {
            transform: scale(0.94);
            opacity: 0.9;
        }
        .day-action-chevron {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.25s var(--ease-smooth);
        }
        .day-action-btn.is-expanded .day-action-chevron {
            transform: rotate(180deg);
        }

        /* Floating Backdrop for category menu blur */
        .floating-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100 !important;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.28s var(--ease-smooth);
        }
        body.category-menu-open .category-title-text,
        body.category-menu-open .sort-action-wrap,
        body.category-menu-open .cal-trigger-action-btn {
            filter: blur(8px);
            opacity: 0.55;
            transition: filter 0.28s var(--ease-smooth), opacity 0.28s var(--ease-smooth);
        }

        .category-title-text,
        .sort-action-wrap,
        .cal-trigger-action-btn {
            transition: filter 0.28s var(--ease-smooth), opacity 0.28s var(--ease-smooth);
        }

        .floating-backdrop.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Floating Category Dropdown Panel */
        .floating-days-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 230px;
            max-width: calc(100vw - 36px);
            width: max-content;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 8px 6px;
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
            z-index: 120 !important;
            display: none;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body.light-mode .floating-days-panel {
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.12);
        }
        .floating-days-panel.is-open {
            display: flex;
            flex-direction: column;
            animation: floatingMasterEntrance 0.32s var(--ease-smooth) forwards;
            pointer-events: auto;
        }
        .floating-days-panel.is-closing {
            display: flex;
            flex-direction: column;
            animation: floatingMasterExit 0.2s var(--ease-smooth) forwards;
            pointer-events: none;
        }
        @keyframes floatingMasterEntrance {
            0% { opacity: 0; transform: translate3d(0, 14px, 0); }
            100% { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        @keyframes floatingMasterExit {
            0% { opacity: 1; transform: translate3d(0, 0, 0); }
            100% { opacity: 0; transform: translate3d(0, 10px, 0); }
        }

        .day-item-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        .day-item-btn:hover {
            background-color: var(--pill-bg);
        }
        .day-item-btn.is-selected {
            background-color: var(--pill-selected-bg) !important;
            color: #ffffff !important;
        }
        body.light-mode .day-item-btn.is-selected {
            background-color: var(--btn-blue) !important;
            color: #ffffff !important;
        }

        .category-item-count-badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--pill-bg);
            padding: 2px 7px;
            border-radius: 10px;
            line-height: 1.2;
            flex-shrink: 0;
        }
        .day-item-btn.is-selected .category-item-count-badge {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }

        /* ---------------------------------------------------- */
        /* CARDS LIST & SINGLE COLUMN RESPONSIVE DIMENSIONS     */
        /* ---------------------------------------------------- */
        .organised-ca-cards-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        /* Card: Static Outer Panel (Stationary, No Movement) */
        .organised-ca-card {
            position: relative;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 26px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            text-decoration: none !important;
            box-sizing: border-box;
            width: 100%;
            min-height: 104px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transform: none !important;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            animation: cardsSlideUpEntrance 0.45s var(--ease-premium) both;
        }
        .organised-ca-card:hover {
            border-color: var(--panel-border) !important;
            transform: none !important;
        }
        /* Static Card Container on Active/Tap */
        .organised-ca-card:active {
            transform: none !important;
            opacity: 1 !important;
        }

        /* Left thumbnail / placeholder */
        .organised-ca-card-left-thumb {
            flex-shrink: 0;
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ca-card-thumb-img {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            object-fit: cover;
            display: block;
            border: 1px solid var(--panel-border);
        }
        .ca-card-no-image {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            background-color: var(--item-card-bg);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
        }
        .ca-card-no-image svg { opacity: 0.6; }
        .ca-card-no-image-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Right content: Title vertically centered to thumbnail */
        .organised-ca-card-right-content {
            flex: 1;
            min-width: 0;
            min-height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 90px;
            box-sizing: border-box;
        }
        .organised-ca-card-title {
            font-size: 15.5px;
            font-weight: 500;
            line-height: 1.38;
            color: var(--text-main);
            margin: 0;
            text-align: left;
            text-wrap: wrap !important;
            hyphens: none !important;
            -webkit-hyphens: none !important;
            word-break: normal !important;
            overflow-wrap: break-word !important;
            display: inline-block;
            width: fit-content;
            max-width: 100%;
            transform-origin: center center !important;
            transition: transform 0.28s var(--ease-smooth), color 0.2s ease;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
            backface-visibility: hidden;
        }

        .organised-ca-card:hover .organised-ca-card-title {
            transform: scale(1.024) !important;
            color: var(--text-main);
        }

        @media (hover: none), (pointer: coarse) {
            .organised-ca-card:active .organised-ca-card-title {
                transform: scale(1.024) !important;
            }
        }

        /* Bottom-Right Date Tag */
        .organised-ca-card-footer {
            position: absolute;
            right: 18px;
            bottom: 12px;
            display: flex;
            align-items: center;
        }
        .note-card-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            white-space: nowrap;
        }

        /* ---------------------------------------------------- */
        /* ARTICLE DETAIL VIEW (SLIDE-UP ENTRANCE, EXACT GAP)   */
        /* ---------------------------------------------------- */
        #organisedCaArticleView {
            display: none;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            flex-direction: column;
        }
        #organisedCaArticleView.is-active {
            display: flex;
        }

        .article-slide-up-run {
            animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            will-change: transform, opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        @keyframes masterEntrance {
            0% {
                opacity: 0;
                transform: translate3d(0, 28px, 0) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }
        @-webkit-keyframes articleSlideUpEntrance {
            0% {
                opacity: 0;
                -webkit-transform: translate3d(0, 24px, 0);
            }
            100% {
                opacity: 1;
                -webkit-transform: translate3d(0, 0, 0);
            }
        }

        @keyframes cardsSlideUpEntrance {
            0% {
                opacity: 0;
                transform: translate3d(0, 22px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* Controls Panel: EXACT 24px margin to title */
        .ca-controls-panel {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin-bottom: 24px !important;
            transition: background-color 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth);
        }

        .ca-controls-main-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .ca-action-buttons-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .ca-action-label-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
            user-select: none;
            -webkit-user-select: none;
        }

        .ca-direct-action-btn,
        .image-action-btn,
        .read-action-btn {
            background: var(--btn-blue) !important;
            color: #ffffff !important;
            border: none;
            outline: none;
            padding: 5px 15px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none !important;
            user-select: none;
            -webkit-user-select: none;
            min-width: 58px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            transition: transform 0.18s var(--ease-smooth), opacity 0.18s ease;
        }
        .ca-direct-action-btn:active {
            transform: scale(0.93);
            opacity: 0.9;
        }

        .ca-dropdown-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: color 0.2s ease, transform 0.25s var(--ease-smooth);
            user-select: none;
            -webkit-user-select: none;
        }
        .ca-dropdown-toggle-btn.is-rotated {
            transform: rotate(180deg);
            color: var(--text-main);
        }
        .ca-dropdown-toggle-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Image Drawer: Uncropped natural image presentation */
        .ca-image-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s var(--ease-smooth);
            width: 100%;
            overflow: hidden;
        }
        .ca-image-drawer.is-open {
            grid-template-rows: 1fr;
        }
        .ca-image-drawer-inner {
            min-height: 0;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            padding-top: 0;
            transition: opacity 0.3s var(--ease-smooth), padding-top 0.35s var(--ease-smooth);
        }
        .ca-image-drawer.is-open .ca-image-drawer-inner {
            opacity: 1;
            padding-top: 14px;
        }
        .ca-image-drawer-inner img {
            max-width: 100%;
            width: auto;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 16px;
            display: block;
            margin: 0 auto;
        }
        .ca-image-caption {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
        }

        /* Metadata Drawer */
        .ca-meta-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.42s var(--ease-smooth);
            width: 100%;
            overflow: hidden;
        }
        .ca-meta-drawer.is-open {
            grid-template-rows: 1fr;
        }
        .ca-meta-drawer-inner {
            min-height: 0;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            padding-top: 0;
            transition: opacity 0.3s var(--ease-smooth), padding-top 0.35s var(--ease-smooth);
        }
        .ca-meta-drawer.is-open .ca-meta-drawer-inner {
            opacity: 1;
            padding-top: 14px;
        }
        .ca-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 400;
            background: var(--pill-bg, rgba(255, 255, 255, 0.04));
            border: 1px solid var(--pill-border, rgba(255, 255, 255, 0.08));
            color: var(--text-muted);
            transition: background-color 0.4s var(--ease-smooth), 
                        border-color 0.4s var(--ease-smooth), 
                        color 0.4s var(--ease-smooth);
        }
        .meta-pill strong {
            color: var(--text-main);
            font-weight: 500;
        }

        /* ARTICLE CONTENT AREA: Rest on background without boxed panel */
        .ca-article-feed-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-top: 0;
        }

        .article-title {
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-size: 24px !important;
            font-weight: 500 !important;
            letter-spacing: -0.35px !important;
            color: var(--text-main) !important;
            line-height: 1.34 !important;
            margin-top: 0 !important;
            margin-bottom: 20px !important;
            text-align: left !important;
        }

        /* Smooth Transition for Short Revision Drawer (Matches minsathya-app) */
        .ca-content-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.42s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            width: 100%;
            margin: 0;
            will-change: grid-template-rows;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .ca-content-drawer.is-open {
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.48s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ca-content-overflow {
            min-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.28s ease;
            will-change: opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .ca-content-drawer.is-open .ca-content-overflow {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.34s ease;
        }

        /* Smooth Transition for Detailed Analysis Drawer (Matches minsathya-app) */
        .ca-detailed-content-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.42s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            width: 100%;
            margin: 0;
            will-change: grid-template-rows;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .ca-detailed-content-drawer.is-open {
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.48s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ca-detailed-overflow {
            min-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.28s ease;
            will-change: opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .ca-detailed-content-drawer.is-open .ca-detailed-overflow {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.34s ease;
        }

        /* Standard Typography */
        .note-section {
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--row-divider);
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            width: 100%;
        }
        .note-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-heading {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            margin-bottom: 4px;
            text-align: left;
        }

        /* Matching Font Size for ALL content including Important Facts downwards */
        .note-p,
        .point-bullet-item,
        .info-callout-row {
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.92;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            text-align: left;
        }

        .point-bullet-item {
            position: relative;
            padding-left: 18px;
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.92;
            text-align: left;
            margin-bottom: 6px;
        }

        .point-bullet-item::before {
            content: "•";
            position: absolute;
            left: 3px;
            top: 0;
            font-size: 15px;
            color: var(--text-main);
        }

        .point-subheading {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.8;
            color: var(--text-main);
            margin-top: 12px;
            margin-bottom: 6px;
            text-align: left;
        }

        .point-sublist {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .info-callout {
            background: transparent !important;
            border: none !important;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-callout-row strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* ---------------------------------------------------- */
        /* DRUM WHEEL DATE PICKER MODAL (TAP-TO-SELECT ENABLED) */
        /* ---------------------------------------------------- */
        .picker-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px;
            box-sizing: border-box;
        }
        .picker-backdrop.is-open {
            opacity: 1;
            pointer-events: auto;
        }
        .picker-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 24px 20px 28px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform: translate3d(0, 100vh, 0);
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
            box-sizing: border-box;
        }
        .picker-backdrop.is-open .picker-card {
            transform: translate3d(0, 0, 0);
        }
        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 6px;
        }
        .picker-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
        }
        .picker-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .picker-clear-btn {
            background: transparent;
            border: 1px solid var(--pill-border);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .picker-clear-btn:hover {
            color: var(--text-main);
            border-color: var(--panel-border-hover);
        }
        .picker-apply-btn {
            background: var(--btn-blue) !important;
            color: #ffffff !important;
            border: none;
            padding: 6px 18px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }
        .picker-apply-btn:active {
            transform: scale(0.94);
        }
        .picker-col-headers {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 100%;
            margin-bottom: 6px;
            padding: 0 4px;
        }
        .picker-col-hdr {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .picker-drum-stage {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            height: 200px;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.25);
            mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
        }
        html.light-mode .picker-drum-stage {
            background: rgba(0, 0, 0, 0.04);
        }
        .picker-center-capsule {
            position: absolute;
            top: 50%;
            left: 8px;
            right: 8px;
            height: 48px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            pointer-events: none;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        html.light-mode .picker-center-capsule {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.06);
        }
        .drum-column {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            touch-action: pan-y;
            overscroll-behavior-y: contain;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            padding: 76px 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .drum-column::-webkit-scrollbar {
            display: none;
        }
        .drum-cell {
            width: 100%;
            height: 48px;
            min-height: 48px;
            max-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 19px;
            font-weight: 500;
            color: var(--text-muted);
            scroll-snap-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.2s;
        }
        .drum-cell.is-selected {
            color: var(--text-main);
            font-weight: 600;
        }

        /* ---------------------------------------------------- */
        /* FOOTER                                               */
        /* ---------------------------------------------------- */
        footer {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 60px;
            padding-top: 12px;
            border-top: none !important;
        }
        .footer-links-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .footer-links-row a {
            color: var(--text-muted);
            font-size: 13.5px;
            text-decoration: none !important;
            transition: color 0.2s ease;
        }
        .footer-links-row a:hover {
            color: var(--text-main);
        }
        .copyright-tag {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.7;
        }

        @media (max-width: 700px) {
            body { padding: 24px 16px 28px 16px; }
            .brand-pill { font-size: 34px; }
            /* .page-title consistent on all devices */
            .category-row { max-width: 100%; margin-bottom: 16px; }
            .organised-ca-card { padding: 12px 14px; min-height: 96px; gap: 12px; }
            .organised-ca-card-left-thumb { width: 70px; height: 70px; }
            .ca-card-thumb-img, .ca-card-no-image { width: 70px; height: 70px; border-radius: 16px; }
            .organised-ca-card-right-content { min-height: 70px; padding-right: 76px; }
            .organised-ca-card-title { font-size: 14.5px; }
            .note-p, .point-bullet-item, .info-callout-row, .point-subheading { font-size: 15.5px; }
        }
            @media (min-width: 769px) { .brand-pill { font-size: 36px; } }
    </style>
</head>
