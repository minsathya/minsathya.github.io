    <!-- MAIN ENGINE SCRIPT -->
    <script>
        // State Management
        let organisedCaSelectedCategory = 'All';
        let organisedCaSelectedDateKey = null; // null = all dates
        let organisedCaSortOrder = 'newest'; // 'newest' | 'oldest'
        let organisedCaActiveTopic = null;
        let orgViewMode = 'detailed'; // 'detailed' | 'short'
        let orgImageDrawerOpen = false;
        let orgMetaDrawerOpen = false;
        let organisedCaFloatingOpen = false;

        // Drum Picker Temporary State
        let orgTempDay = 5;
        let orgTempMonth = 10;
        let orgTempYear = 2026;
        const CELL_HEIGHT = 48;

        const orgDayCol = document.getElementById('orgDayCol');
        const orgMonthCol = document.getElementById('orgMonthCol');
        const orgYearCol = document.getElementById('orgYearCol');
        const orgPickerModal = document.getElementById('orgPickerModal');

        // Helper: Convert DD-MM-YYYY to Timestamp for accurate sorting
        function parseDateKeyTimestamp(key) {
            if (!key) return 0;
            const parts = key.split('-');
            if (parts.length === 3) {
                return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10)).getTime();
            }
            return 0;
        }

        // 1. INTELLIGENT CATEGORY SPLITTER & DATA EXTRACTION
        function splitTopicCategories(rawCategory) {
            if (!rawCategory || typeof rawCategory !== 'string') return [];
            
            let s = rawCategory.trim();
            
            const protectedTerms = [
                { regex: /energy\s*(?:&|\/|and)\s*mineral\s*resources/gi, replacement: '__ENERGY_MINERAL__' },
                { regex: /art\s*(?:&|and)\s*culture/gi, replacement: '__ART_CULTURE__' },
                { regex: /science\s*(?:&|and)\s*technology/gi, replacement: '__SCI_TECH__' },
                { regex: /international\s*relations/gi, replacement: '__INTL_REL__' },
                { regex: /indian\s*society/gi, replacement: '__IND_SOC__' },
                { regex: /social\s*justice/gi, replacement: '__SOC_JUST__' },
                { regex: /internal\s*security/gi, replacement: '__INT_SEC__' },
                { regex: /disaster\s*management/gi, replacement: '__DIS_MGMT__' },
                { regex: /polity\s*(?:&|and)\s*governance/gi, replacement: '__POLITY_GOV__' }
            ];
            
            s = s.replace(/geography\s*(?:&|\/|and)\s*energy\s*\/\s*mineral\s*resources/gi, 'Geography / Energy and mineral resources');
            s = s.replace(/economy\s*\/\s*energy\s*&?\s*infrastructure/gi, 'Economy / Energy and mineral resources');
            
            protectedTerms.forEach(p => {
                s = s.replace(p.regex, p.replacement);
            });
            
            const rawTokens = s.split(/[\/;,&]|(?:\s+and\s+)/i);
            const result = [];
            
            rawTokens.forEach(token => {
                let clean = token.trim();
                if (!clean) return;
                
                clean = clean
                    .replace(/__ENERGY_MINERAL__/g, 'Energy and mineral resources')
                    .replace(/__ART_CULTURE__/g, 'Culture')
                    .replace(/__SCI_TECH__/g, 'Science and technology')
                    .replace(/__INTL_REL__/g, 'International relations')
                    .replace(/__IND_SOC__/g, 'Indian society')
                    .replace(/__SOC_JUST__/g, 'Social justice')
                    .replace(/__INT_SEC__/g, 'Internal security')
                    .replace(/__DIS_MGMT__/g, 'Disaster management')
                    .replace(/__POLITY_GOV__/g, 'Polity');
                
                const low = clean.toLowerCase();
                if (low === 'geography') clean = 'Geography';
                else if (low === 'economy') clean = 'Economy';
                else if (low === 'energy and mineral resources' || low === 'mineral resources' || low === 'energy') clean = 'Energy and mineral resources';
                else if (low === 'sports') clean = 'Sports';
                else if (low === 'culture' || low === 'art & culture' || low === 'art and culture') clean = 'Culture';
                else if (low === 'polity') clean = 'Polity';
                else if (low === 'history') clean = 'History';
                else if (low === 'indian society') clean = 'Indian society';
                else {
                    clean = clean.charAt(0).toUpperCase() + clean.slice(1);
                }
                
                if (clean && !result.includes(clean)) {
                    result.push(clean);
                }
            });
            
            return result;
        }

        // Fetch All Topics Across all dates
        function getAllOrganisedCaTopics() {
            const raw = window.RAW_STUDY_DATA && window.RAW_STUDY_DATA.dailyCurrentAffairsData;
            if (!raw) return [];

            const allTopics = [];
            const dateKeys = Object.keys(raw);

            dateKeys.forEach(dateKey => {
                const dayObj = raw[dateKey];
                if (dayObj && Array.isArray(dayObj.topics)) {
                    const dateStr = dayObj.dateText || dateKey;
                    const timestamp = parseDateKeyTimestamp(dateKey);

                    dayObj.topics.forEach((topic, idx) => {
                        const categories = splitTopicCategories(topic.category);
                        allTopics.push({
                            ...topic,
                            categories: categories.length > 0 ? categories : [(topic.category || 'General')],
                            dateKey: dateKey,
                            dateStr: dateStr,
                            timestamp: timestamp,
                            originalIndex: idx
                        });
                    });
                }
            });

            return allTopics;
        }

        // Fetch list of available categories
        function getOrganisedCaCategories() {
            const topics = getAllOrganisedCaTopics();
            const discoveredSet = new Set();

            topics.forEach(t => {
                if (t.categories && Array.isArray(t.categories)) {
                    t.categories.forEach(c => discoveredSet.add(c));
                }
            });

            // Specific order requested: geography, sports, culture, etc., with long words like energy and mineral resources on last
            const preferredOrder = [
                'All',
                'Geography',
                'Sports',
                'Culture',
                'Economy',
                'Polity',
                'Indian society',
                'History',
                'Energy and mineral resources'
            ];

            const orderedCategories = [];
            preferredOrder.forEach(cat => {
                if (cat === 'All' || discoveredSet.has(cat)) {
                    orderedCategories.push(cat);
                    discoveredSet.delete(cat);
                }
            });

            // Append any remaining categories: shorter first, long words on last
            const remaining = Array.from(discoveredSet).sort((a, b) => a.length - b.length || a.localeCompare(b));
            remaining.forEach(cat => {
                orderedCategories.push(cat);
            });

            return orderedCategories;
        }

        // Calculate count of topics for a given category (respecting active date filter)
        function getCategoryTopicCount(cat, allTopics) {
            let list = allTopics;
            if (organisedCaSelectedDateKey) {
                list = list.filter(t => t.dateKey === organisedCaSelectedDateKey);
            }
            if (cat === 'All') return list.length;
            return list.filter(t => t.categories && t.categories.includes(cat)).length;
        }

        // ----------------------------------------------------
        // DIRECTORY / LIST VIEW RENDERING
        // ----------------------------------------------------
        function renderDirectoryView(playSlideUp) {
            if (playSlideUp === undefined) playSlideUp = true;

            const dirView = document.getElementById('organisedCaDirectoryView');
            const artView = document.getElementById('organisedCaArticleView');
            const pageTitle = document.getElementById('pageTitleText');

            if (dirView) dirView.style.display = 'block';
            if (artView) artView.classList.remove('is-active');
            if (pageTitle) pageTitle.textContent = 'Organised current affairs';

            const allTopics = getAllOrganisedCaTopics();
            const categories = getOrganisedCaCategories();

            if (!categories.includes(organisedCaSelectedCategory)) {
                organisedCaSelectedCategory = 'All';
            }

            // Sync category label & active button state
            const labelEl = document.getElementById('selectedCategoryLabel');
            if (labelEl) labelEl.textContent = organisedCaSelectedCategory;

            // Render floating panel category buttons with post count badges
            const panelEl = document.getElementById('floatingOrganisedCaCategoryPanel');
            if (panelEl) {
                panelEl.innerHTML = categories.map(cat => {
                    const count = getCategoryTopicCount(cat, allTopics);
                    const isSelected = (cat === organisedCaSelectedCategory) ? ' is-selected' : '';
                    return (
                        '<button type="button" class="day-item-btn' + isSelected + '" data-cat="' + encodeURIComponent(cat) + '">' +
                            '<span>' + cat + '</span>' +
                            '<span class="category-item-count-badge">' + count + '</span>' +
                        '</button>'
                    );
                }).join('');

                // Attach safe click listeners to category buttons
                panelEl.querySelectorAll('.day-item-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const cat = decodeURIComponent(btn.getAttribute('data-cat'));
                        selectOrganisedCaCategory(cat);
                    });
                });
            }

            // Sync Calendar Active Dot
            const calDot = document.getElementById('calActiveDot');
            if (calDot) {
                calDot.classList.toggle('is-visible', !!organisedCaSelectedDateKey);
            }

            // Sync Sort Button
            const sortBtn = document.getElementById('orgSortBtn');
            if (sortBtn) {
                sortBtn.classList.toggle('is-asc', organisedCaSortOrder === 'oldest');
                sortBtn.removeAttribute('title');
            }

            // Apply Filters: 1. Category 2. Date
            let filtered = allTopics;

            if (organisedCaSelectedCategory !== 'All') {
                filtered = filtered.filter(t => t.categories && t.categories.includes(organisedCaSelectedCategory));
            }

            if (organisedCaSelectedDateKey) {
                filtered = filtered.filter(t => t.dateKey === organisedCaSelectedDateKey);
            }

            // Apply Sorting: 'newest' (recent to oldest) | 'oldest' (oldest to recent)
            filtered.sort((a, b) => {
                if (organisedCaSortOrder === 'newest') {
                    return b.timestamp - a.timestamp;
                } else {
                    return a.timestamp - b.timestamp;
                }
            });

            const container = document.getElementById('organisedCaCardsContainer');
            if (!container) return;

            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding: 48px 16px; text-align: center; color: var(--text-muted); font-size: 15px;">No current affairs entries found for this selection.</div>';
                return;
            }

            container.innerHTML = filtered.map(topic => {
                const hasThumb = topic.image && topic.image.url;
                const thumbHtml = hasThumb ? 
                    '<img src="' + topic.image.url + '" alt="' + topic.topicTitle + '" class="ca-card-thumb-img" loading="lazy">' :
                    ('<div class="ca-card-no-image">' +
                        '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                            '<rect x="3" y="3" width="18" height="18" rx="4"></rect>' +
                            '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
                            '<polyline points="21 15 16 10 5 21"></polyline>' +
                        '</svg>' +
                        '<span class="ca-card-no-image-text">no image</span>' +
                    '</div>');

                return (
                    '<div class="organised-ca-card" data-title="' + encodeURIComponent(topic.topicTitle) + '">' +
                        '<div class="organised-ca-card-left-thumb">' + thumbHtml + '</div>' +
                        '<div class="organised-ca-card-right-content">' +
                            '<h3 class="organised-ca-card-title">' + topic.topicTitle + '</h3>' +
                        '</div>' +
                        '<div class="organised-ca-card-footer">' +
                            '<span class="note-card-date">' + topic.dateStr + '</span>' +
                        '</div>' +
                    '</div>'
                );
            }).join('');

            // Attach click listeners to cards matching the smooth All button behavior
            container.querySelectorAll('.organised-ca-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    const title = decodeURIComponent(card.getAttribute('data-title'));
                    openOrganisedCaArticle(title);
                });
            });

            // Attach touch / pointer feedback for bouncy press animation across all devices
            // pure CSS active touch feedback

            // Smooth slide-up transition animation on list change
            if (playSlideUp) {
                container.classList.remove('article-slide-up-run');
                void container.offsetWidth;
                requestAnimationFrame(() => {
                    container.classList.add('article-slide-up-run');
                });
            }
        }

        // Toggle Sort Order
        function toggleOrganisedCaSort() {
            organisedCaSortOrder = (organisedCaSortOrder === 'newest') ? 'oldest' : 'newest';
            renderDirectoryView(true);
        }
        window.toggleOrganisedCaSort = toggleOrganisedCaSort;

        // ----------------------------------------------------
        // FLOATING CATEGORY DROPDOWN LOGIC
        // ----------------------------------------------------
        function toggleOrganisedCaCategoryDropdown(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById('floatingOrganisedCaCategoryPanel');
            const backdrop = document.getElementById('floatingBackdrop');
            const btn = document.getElementById('organisedCaCategoryBtn');
            if (!panel) return;

            if (panel.classList.contains('is-open')) {
                closeOrganisedCaCategoryDropdown();
            } else {
                panel.classList.remove('is-closing');
                panel.classList.add('is-open');
                if (btn) btn.classList.add('is-expanded');
                if (backdrop) backdrop.classList.add('is-active');
                document.body.classList.add('category-menu-open');
                organisedCaFloatingOpen = true;
            }
        }
        window.toggleOrganisedCaCategoryDropdown = toggleOrganisedCaCategoryDropdown;

        function closeOrganisedCaCategoryDropdown() {
            const panel = document.getElementById('floatingOrganisedCaCategoryPanel');
            const backdrop = document.getElementById('floatingBackdrop');
            const btn = document.getElementById('organisedCaCategoryBtn');
            if (backdrop) backdrop.classList.remove('is-active');
            document.body.classList.remove('category-menu-open');
            if (btn) btn.classList.remove('is-expanded');
            if (!panel || !panel.classList.contains('is-open') || panel.classList.contains('is-closing')) {
                organisedCaFloatingOpen = false;
                return;
            }
            panel.classList.add('is-closing');
            organisedCaFloatingOpen = false;
            setTimeout(() => {
                panel.classList.remove('is-open', 'is-closing');
            }, 200);
        }
        window.closeOrganisedCaCategoryDropdown = closeOrganisedCaCategoryDropdown;

        function selectOrganisedCaCategory(cat) {
            organisedCaSelectedCategory = cat;
            closeOrganisedCaCategoryDropdown();
            setTimeout(() => {
                renderDirectoryView(true);
            }, 140);
        }
        window.selectOrganisedCaCategory = selectOrganisedCaCategory;

        // Dismiss dropdown on outside click
        document.addEventListener('click', (e) => {
            if (organisedCaFloatingOpen) {
                const panel = document.getElementById('floatingOrganisedCaCategoryPanel');
                const btn = document.getElementById('organisedCaCategoryBtn');
                if (panel && !panel.contains(e.target) && (!btn || !btn.contains(e.target))) {
                    closeOrganisedCaCategoryDropdown();
                }
            }
        });

        // ----------------------------------------------------
        // DRUM WHEEL DATE PICKER MODAL & FILTERING
        // ----------------------------------------------------
        function initPickerColumns() {
            if (!orgDayCol || !orgMonthCol || !orgYearCol) return;

            // Day loop (5 repetitions of 1..31)
            orgDayCol.innerHTML = '';
            const DAY_LOOPS = 5;
            for (let l = 0; l < DAY_LOOPS; l++) {
                for (let d = 1; d <= 31; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'drum-cell';
                    cell.textContent = String(d).padStart(2, '0');
                    cell.dataset.val = d;
                    /* Tap to select date */
                    cell.addEventListener('click', () => {
                        orgDayCol.scrollTo({ top: (l * 31 + d - 1) * CELL_HEIGHT, behavior: 'smooth' });
                    });
                    orgDayCol.appendChild(cell);
                }
            }

            // Month loop
            orgMonthCol.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = String(m).padStart(2, '0');
                cell.dataset.val = m;
                /* Tap to select month */
                cell.addEventListener('click', () => {
                    orgMonthCol.scrollTo({ top: (m - 1) * CELL_HEIGHT, behavior: 'smooth' });
                });
                orgMonthCol.appendChild(cell);
            }

            // Year loop
            orgYearCol.innerHTML = '';
            const minYear = 2026;
            const maxYear = 2027;
            for (let y = minYear; y <= maxYear; y++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = y;
                cell.dataset.val = y;
                /* Tap to select year */
                cell.addEventListener('click', () => {
                    orgYearCol.scrollTo({ top: (y - minYear) * CELL_HEIGHT, behavior: 'smooth' });
                });
                orgYearCol.appendChild(cell);
            }
        }

        function scrollDrumTo(col, val) {
            if (!col) return;
            if (col === orgDayCol) {
                const middleTargetIndex = 2 * 31 + (parseInt(val, 10) - 1);
                col.scrollTo({ top: middleTargetIndex * CELL_HEIGHT, behavior: 'instant' });
                return;
            }
            const cells = Array.from(col.querySelectorAll('.drum-cell'));
            const target = cells.find(c => parseInt(c.dataset.val, 10) === parseInt(val, 10));
            if (target) {
                const index = cells.indexOf(target);
                col.scrollTo({ top: index * CELL_HEIGHT, behavior: 'instant' });
            }
        }

        function setupDrumScrollHighlight(col, onSelected) {
            if (!col) return;
            col.addEventListener('scroll', () => {
                if (col === orgDayCol) {
                    const loopHeight = 31 * CELL_HEIGHT;
                    if (col.scrollTop < loopHeight * 0.8) {
                        col.scrollTop += loopHeight * 2;
                    } else if (col.scrollTop > loopHeight * 3.8) {
                        col.scrollTop -= loopHeight * 2;
                    }
                }

                const index = Math.round(col.scrollTop / CELL_HEIGHT);
                const cells = col.querySelectorAll('.drum-cell');
                cells.forEach((cell, i) => {
                    const isSelected = (i === index);
                    cell.classList.toggle('is-selected', isSelected);
                    if (isSelected && onSelected) {
                        onSelected(parseInt(cell.dataset.val, 10));
                    }
                });
            });
        }

        function openOrganisedCaDatePicker() {
            if (orgPickerModal) orgPickerModal.classList.add('is-open');

            if (organisedCaSelectedDateKey) {
                const p = organisedCaSelectedDateKey.split('-');
                orgTempDay = parseInt(p[0], 10) || 5;
                orgTempMonth = parseInt(p[1], 10) || 10;
                orgTempYear = parseInt(p[2], 10) || 2026;
            } else {
                orgTempDay = 5;
                orgTempMonth = 10;
                orgTempYear = 2026;
            }

            setTimeout(() => {
                scrollDrumTo(orgDayCol, orgTempDay);
                scrollDrumTo(orgMonthCol, orgTempMonth);
                scrollDrumTo(orgYearCol, orgTempYear);
            }, 60);
        }
        window.openOrganisedCaDatePicker = openOrganisedCaDatePicker;

        function closeOrganisedCaDatePicker() {
            if (orgPickerModal) orgPickerModal.classList.remove('is-open');
        }
        window.closeOrganisedCaDatePicker = closeOrganisedCaDatePicker;

        function applyOrganisedCaDateFilter() {
            organisedCaSelectedDateKey = String(orgTempDay).padStart(2, '0') + '-' + String(orgTempMonth).padStart(2, '0') + '-' + orgTempYear;
            closeOrganisedCaDatePicker();
            renderDirectoryView(true);
        }
        window.applyOrganisedCaDateFilter = applyOrganisedCaDateFilter;

        function clearOrganisedCaDateFilter() {
            organisedCaSelectedDateKey = null;
            closeOrganisedCaDatePicker();
            renderDirectoryView(true);
        }
        window.clearOrganisedCaDateFilter = clearOrganisedCaDateFilter;

        // ----------------------------------------------------
        // ARTICLE DETAIL VIEW LOGIC
        // ----------------------------------------------------
        function openOrganisedCaArticle(topicTitle) {
            const allTopics = getAllOrganisedCaTopics();
            const topic = allTopics.find(t => t.topicTitle === topicTitle);
            if (!topic) return;

            organisedCaActiveTopic = topic;
            try {
                sessionStorage.setItem('oca_active_topic', topicTitle);
                history.replaceState(null, '', '#' + encodeURIComponent(topicTitle));
            } catch(e) {}
            orgImageDrawerOpen = false;
            orgMetaDrawerOpen = false;
            orgViewMode = 'detailed';

            const dirView = document.getElementById('organisedCaDirectoryView');
            const artView = document.getElementById('organisedCaArticleView');
            const pageTitle = document.getElementById('pageTitleText');

            if (dirView) dirView.style.display = 'none';
            if (artView) {
                artView.classList.remove('is-active', 'article-slide-up-run');
                void artView.offsetWidth;
                artView.classList.add('is-active', 'article-slide-up-run');
            }

            if (pageTitle) {
                let catTitle = '';
                if (organisedCaSelectedCategory && organisedCaSelectedCategory !== 'All') {
                    catTitle = organisedCaSelectedCategory;
                } else if (topic.categories && topic.categories.length > 0) {
                    catTitle = topic.categories[0];
                } else if (topic.category) {
                    catTitle = topic.category;
                } else {
                    catTitle = 'Current affairs';
                }
                pageTitle.textContent = catTitle;
            }

            // Populate Title
            const titleEl = document.getElementById('orgArticleTitle');
            if (titleEl) titleEl.textContent = topic.topicTitle;

            // Populate Image Drawer (Uncropped & always enabled)
            const hasImage = !!(topic.image && topic.image.url);
            const imgBtn = document.getElementById('orgImageActionBtn');
            if (imgBtn) {
                imgBtn.textContent = 'View';
                imgBtn.style.opacity = '1';
                imgBtn.style.pointerEvents = 'auto';
            }
            const imgDrawer = document.getElementById('orgImageDrawer');
            if (imgDrawer) imgDrawer.classList.remove('is-open');

            const imgInner = document.getElementById('orgImageDrawerInner');
            if (imgInner) {
                imgInner.innerHTML = hasImage ?
                    ('<img src="' + topic.image.url + '" alt="' + (topic.image.caption || 'Topic Image') + '" loading="lazy">' +
                    (topic.image.caption ? '<div class="ca-image-caption">' + topic.image.caption + '</div>' : '')) :
                    '<div style="font-size: 14px; color: var(--text-muted); padding: 14px 0; text-align: center;">No graphic or infographic attached for this topic.</div>';
            }

            // Populate Metadata Drawer
            const metaDrawer = document.getElementById('orgMetaDrawer');
            const metaBtn = document.getElementById('orgMetaDropdownBtn');
            if (metaDrawer) metaDrawer.classList.remove('is-open');
            if (metaBtn) metaBtn.classList.remove('is-rotated');

            const metaInner = document.getElementById('orgMetaDrawerInner');
            if (metaInner) {
                metaInner.innerHTML = 
                    '<div class="ca-meta-row">' +
                        '<span class="meta-pill">GS Paper : <strong>' + (topic.gsPaper || 'General Studies') + '</strong></span>' +
                        '<span class="meta-pill">Category : <strong>' + (topic.category || (topic.categories ? topic.categories.join(', ') : 'National')) + '</strong></span>' +
                        '<span class="meta-pill">Date : <strong>' + topic.dateStr + '</strong></span>' +
                    '</div>';
            }

            // Populate Short & Detailed Drawers
            const readBtn = document.getElementById('orgReadActionBtn');
            if (readBtn) readBtn.textContent = 'Short';

            const shortContent = document.getElementById('orgShortContent');
            if (shortContent) shortContent.innerHTML = renderCaShortRevision(topic);

            const detailedContent = document.getElementById('orgDetailedContent');
            if (detailedContent) detailedContent.innerHTML = renderCaArticleSections(topic);

            const shortDrawer = document.getElementById('orgShortDrawer');
            const detailedDrawer = document.getElementById('orgDetailedDrawer');
            if (shortDrawer) shortDrawer.classList.remove('is-open');
            if (detailedDrawer) detailedDrawer.classList.add('is-open');

            window.scrollTo({ top: 0, behavior: 'instant' });
        }
        window.openOrganisedCaArticle = openOrganisedCaArticle;

        function handleOrganisedBack() {
            const artView = document.getElementById('organisedCaArticleView');
            if (artView && artView.classList.contains('is-active')) {
                try {
                    sessionStorage.removeItem('oca_active_topic');
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                } catch(e) {}
                renderDirectoryView(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/index.html';
                }
            }
        }
        window.handleOrganisedBack = handleOrganisedBack;

        // Article Controls: Image Drawer Toggle
        function toggleOrgImage() {
            orgImageDrawerOpen = !orgImageDrawerOpen;
            const drawer = document.getElementById('orgImageDrawer');
            const btn = document.getElementById('orgImageActionBtn');
            if (drawer) drawer.classList.toggle('is-open', orgImageDrawerOpen);
            if (btn) btn.textContent = orgImageDrawerOpen ? 'Close' : 'View';
        }
        window.toggleOrgImage = toggleOrgImage;

        // Article Controls: Read Mode Toggle (Short <-> Full) - Smooth Drawer Animation Matching minsathya-app
        function toggleOrgReadMode() {
            orgViewMode = (orgViewMode === 'detailed') ? 'short' : 'detailed';
            const readBtn = document.getElementById('orgReadActionBtn');
            if (readBtn) readBtn.textContent = (orgViewMode === 'short') ? 'Full' : 'Short';

            const shortDrawer = document.getElementById('orgShortDrawer');
            const detailedDrawer = document.getElementById('orgDetailedDrawer');

            if (orgViewMode === 'short') {
                if (shortDrawer) shortDrawer.classList.add('is-open');
                if (detailedDrawer) detailedDrawer.classList.remove('is-open');
            } else {
                if (shortDrawer) shortDrawer.classList.remove('is-open');
                if (detailedDrawer) detailedDrawer.classList.add('is-open');
            }
        }
        window.toggleOrgReadMode = toggleOrgReadMode;

        // Article Controls: Metadata Drawer Toggle
        function toggleOrgMetaDropdown() {
            orgMetaDrawerOpen = !orgMetaDrawerOpen;
            const drawer = document.getElementById('orgMetaDrawer');
            const btn = document.getElementById('orgMetaDropdownBtn');
            if (drawer) drawer.classList.toggle('is-open', orgMetaDrawerOpen);
            if (btn) btn.classList.toggle('is-rotated', orgMetaDrawerOpen);
        }
        window.toggleOrgMetaDropdown = toggleOrgMetaDropdown;

        // ----------------------------------------------------
        // ARTICLE DATA TEMPLATING (LEFT-ALIGNED, NO GREEN DOTS)
        // ----------------------------------------------------
        // 7. ARTICLE DATA RENDERERS (EXACT DCA PARITY)
        function renderCaListBlock(list) {
            if (!list || !list.length) return '';
            return list.map(rawText => {
                if (!rawText || typeof rawText !== 'string') return '';

                let labelPart = '';
                let restPart = rawText;

                if (rawText.includes('</strong>')) {
                    const parts = rawText.split('</strong>');
                    labelPart = parts[0].replace(/<[^>]+>/g, '').trim();
                    restPart = parts.slice(1).join('</strong>').trim();
                    if (restPart.startsWith(':')) {
                        labelPart += ' :';
                        restPart = restPart.substring(1).trim();
                    }
                } else if (rawText.includes(':')) {
                    const colonIdx = rawText.indexOf(':');
                    labelPart = rawText.substring(0, colonIdx + 1).trim();
                    restPart = rawText.substring(colonIdx + 1).trim();
                }

                const subItems = restPart ? restPart.split(';').map(s => s.trim().replace(/^,s*/, '')).filter(Boolean) : [];
                if (subItems.length === 0 && restPart) {
                    subItems.push(restPart);
                }

                if (labelPart) {
                    return (
                        '<div class="note-item-group">' +
                            '<div class="point-subheading">' + labelPart + '</div>' +
                            '<ul class="point-sublist">' +
                                subItems.map(s => '<li class="point-bullet-item">' + s + '</li>').join('') +
                            '</ul>' +
                        '</div>'
                    );
                } else {
                    return (
                        '<div class="note-item-group">' +
                            '<ul class="point-sublist">' +
                                subItems.map(s => '<li class="point-bullet-item">' + s + '</li>').join('') +
                            '</ul>' +
                        '</div>'
                    );
                }
            }).join('');
        }

        function renderCaShortRevision(topic) {
            if (!topic) return '';
            const shortData = topic.shortArticle || topic;
            return renderCaArticleSections(shortData);
        }

        function renderCaArticleSections(data) {
            if (!data) return '';

            let orgRowsHtml = '';
            if (data.whoOrg && data.whoOrg.length > 0) {
                orgRowsHtml = data.whoOrg.map(row => (
                    '<div class="info-callout-row"><strong>' + row.label + ' :</strong> ' + row.val + '</div>'
                )).join('');
            }

            return (
                (data.whyInNews ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Why in News?</h3>' +
                        '<p class="note-p">' + data.whyInNews + '</p>' +
                    '</section>' : '') +

                (data.whatConcept ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">What / Concept</h3>' +
                        '<p class="note-p">' + data.whatConcept + '</p>' +
                    '</section>' : '') +

                (orgRowsHtml ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Who / Organisation</h3>' +
                        '<div class="info-callout">' + orgRowsHtml + '</div>' +
                    '</section>' : '') +

                (data.importantFacts && data.importantFacts.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Important Facts ⭐</h3>' +
                        '<div class="note-items-wrapper">' + renderCaListBlock(data.importantFacts) + '</div>' +
                    '</section>' : '') +

                (data.background && data.background.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Background / Static Linkage</h3>' +
                        '<div class="note-items-wrapper">' + renderCaListBlock(data.background) + '</div>' +
                    '</section>' : '') +

                (data.significance && data.significance.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Significance</h3>' +
                        '<div class="note-items-wrapper">' + renderCaListBlock(data.significance) + '</div>' +
                    '</section>' : '') +

                (data.challenges && data.challenges.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Challenges / Concerns</h3>' +
                        '<div class="note-items-wrapper">' + renderCaListBlock(data.challenges) + '</div>' +
                    '</section>' : '') +

                (data.wayForward && data.wayForward.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Way Forward</h3>' +
                        '<div class="note-items-wrapper">' + renderCaListBlock(data.wayForward) + '</div>' +
                    '</section>' : '')
            );
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPickerColumns();
            setupDrumScrollHighlight(orgDayCol, v => orgTempDay = v);
            setupDrumScrollHighlight(orgMonthCol, v => orgTempMonth = v);
            setupDrumScrollHighlight(orgYearCol, v => orgTempYear = v);

            // Fresh load: Always reset to unselected date and category 'All'
            organisedCaSelectedDateKey = null;
            organisedCaSelectedCategory = 'All';
            organisedCaSortOrder = 'newest';

            renderDirectoryView(false);

            // If page was refreshed while viewing an article, stay on that article!
            let savedTopic = '';
            if (window.location.hash && window.location.hash.length > 1) {
                savedTopic = decodeURIComponent(window.location.hash.substring(1));
            } else {
                try { savedTopic = sessionStorage.getItem('oca_active_topic') || ''; } catch(e) {}
            }

            if (savedTopic) {
                const allTopics = getAllOrganisedCaTopics();
                const matched = allTopics.find(t => t.topicTitle === savedTopic);
                if (matched) {
                    openOrganisedCaArticle(savedTopic);
                }
            }
        });

        // Reset state freshly whenever navigating back
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                organisedCaSelectedDateKey = null;
                organisedCaSelectedCategory = 'All';
                organisedCaSortOrder = 'newest';
                renderDirectoryView(false);
            }
        });
    </script>
</body>
</html>
