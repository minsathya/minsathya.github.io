<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organised Current Affairs - sathya.</title>

    <!-- Instant Theme Evaluation to Prevent Theme Flash on Reload -->
    <script>
      (function() {
        const activeTheme = sessionStorage.getItem('dashboard-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const isLight = (activeTheme === 'light' || (!activeTheme && prefersLight));
        if (isLight) {
          document.documentElement.classList.add('light-mode');
        }
        document.documentElement.style.backgroundColor = isLight ? '#f5f5f7' : '#0b0b0b';
      })();
    </script>

    <meta name="description" content="Organised Current Affairs for UPSC Civil Services Examination.">
    <meta name="keywords" content="UPSC current affairs, Organised current affairs, Prelims, Mains, Civil Services.">

      gtag('js', new Date());
      gtag('config', 'G-5VGX2K64Y4');
    </script>

    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=3">
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png?v=3">
    <link id="favicon" rel="icon" type="image/png" href="/favicon-light.png?v=3">

    <script>
      const favicon = document.getElementById('favicon');
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)');
      function updateFavicon(e) {
        favicon.href = e.matches ? '../favicon-dark.png?v=3' : '../favicon-light.png?v=3';
      }
      updateFavicon(darkMode);
      darkMode.addEventListener('change', updateFavicon);
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Study Data Engine -->
    <script src="/study-data.js"></script>

    <style>
        :root {
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #88888e;
            --panel-bg: #121212;
            --panel-border: #222222;
            --panel-border-hover: rgba(255, 255, 255, 0.11);
            --row-divider: #1c1c1c;
            --btn-blue: #244b40;
            --btn-blue-hover: #2e5c50;
            --theme-green: #244b40;
            --pill-bg: rgba(255, 255, 255, 0.06);
            --pill-border: rgba(255, 255, 255, 0.08);
            --floating-bg: #161616;
            --floating-border: #2a2a2a;
            --pill-selected-bg: #1c3830;
            --item-card-bg: #181818;
        }

        html.light-mode,
        body.light-mode {
            --bg-color: #f5f5f7;
            --text-main: #111111;
            --text-muted: #88888e;
            --panel-bg: #ffffff;
            --panel-border: #e2e2e7;
            --panel-border-hover: rgba(0, 0, 0, 0.10);
            --row-divider: #f2f2f7;
            --btn-blue: #296556;
            --btn-blue-hover: #1e4d42;
            --theme-green: #296556;
            --pill-bg: rgba(0, 0, 0, 0.05);
            --pill-border: rgba(0, 0, 0, 0.08);
            --floating-bg: #ffffff;
            --floating-border: #e5e5ea;
            --pill-selected-bg: #296556;
            --item-card-bg: #f2f2f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
        }

        html {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px 36px 24px;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.4s var(--ease-smooth), color 0.4s var(--ease-smooth);
        }

        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100%;
        }

        /* Top Brand Header */
        .top-nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 28px;
            position: relative;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 19px;
            font-weight: 500;
            color: var(--text-main);
            text-decoration: none !important;
            letter-spacing: -0.4px;
            transition: transform 0.35s var(--ease-smooth);
        }
        .brand-pill:hover {
            transform: translate3d(0, -2px, 0);
        }
        .brand-letter { font-weight: 500; }
        .brand-star {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #ff9e79;
            margin-left: 2px;
            animation: brandStarTwinkle 2.8s infinite ease-in-out;
        }
        @keyframes brandStarTwinkle {
            0%, 100% { opacity: 0.4; transform: scale(0.6); }
            50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 6px #ff9e79; }
        }

        main {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-bottom: 60px;
        }

        /* Standard Page Header */
        .page-header-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            margin-bottom: 24px;
            animation: pageSlideUpEntrance 0.5s var(--ease-premium) both;
        }

        .back-icon-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            padding: 0;
            flex-shrink: 0;
            transition: background-color 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
        }
        .back-icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            transform: translate3d(-2px, 0, 0);
        }
        body.light-mode .back-icon-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .back-icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        /* Category Header Row (Schedule style) */
        .category-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            position: relative;
            z-index: 100;
        }

        .category-heading {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .day-action-wrap {
            position: relative;
            z-index: 100;
        }

        .day-action-btn {
            background: var(--btn-blue);
            color: #ffffff;
            border: none;
            outline: none;
            padding: 6px 18px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 76px;
            transition: transform 0.2s var(--ease-smooth), opacity 0.2s var(--ease-smooth);
        }
        .day-action-btn:active {
            transform: scale(0.94);
            opacity: 0.9;
        }

        /* Floating Backdrop for category menu blur */
        .floating-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s var(--ease-smooth);
        }
        .floating-backdrop.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Floating Category Dropdown Panel */
        .floating-days-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 220px;
            max-width: calc(100vw - 36px);
            width: max-content;
            background-color: var(--floating-bg);
            border: 1px solid var(--floating-border);
            border-radius: 20px;
            padding: 7px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            z-index: 110;
            display: none;
            pointer-events: none;
            overflow: hidden;
        }
        body.light-mode .floating-days-panel {
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.12);
        }
        .floating-days-panel.is-open {
            display: flex;
            flex-direction: column;
            animation: floatingMasterEntrance 0.32s var(--ease-smooth) forwards;
            pointer-events: auto;
        }
        .floating-days-panel.is-closing {
            display: flex;
            flex-direction: column;
            animation: floatingMasterExit 0.2s var(--ease-smooth) forwards;
            pointer-events: none;
        }
        @keyframes floatingMasterEntrance {
            0% { opacity: 0; transform: translate3d(0, 14px, 0); }
            100% { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        @keyframes floatingMasterExit {
            0% { opacity: 1; transform: translate3d(0, 0, 0); }
            100% { opacity: 0; transform: translate3d(0, 10px, 0); }
        }

        .day-item-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            padding: 10px 16px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            transition: background-color 0.18s ease, color 0.18s ease;
        }
        .day-item-btn:hover {
            background-color: var(--pill-bg);
        }
        .day-item-btn.is-selected {
            background-color: var(--pill-selected-bg) !important;
            color: #ffffff !important;
        }
        body.light-mode .day-item-btn.is-selected {
            background-color: var(--btn-blue) !important;
            color: #ffffff !important;
        }

        /* ---------------------------------------------------- */
        /* CARDS LIST & RESPONSIVE DIMENSIONS                   */
        /* ---------------------------------------------------- */
        .organised-ca-cards-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }
        @media (max-width: 768px) {
            .organised-ca-cards-list {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        .organised-ca-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 26px;
            padding: 16px 18px;
            display: flex;
            align-items: stretch;
            gap: 14px;
            cursor: pointer;
            text-decoration: none !important;
            box-sizing: border-box;
            transition: transform 0.24s var(--ease-smooth), border-color 0.2s ease, box-shadow 0.24s ease;
            animation: pageSlideUpEntrance 0.45s var(--ease-premium) both;
        }
        .organised-ca-card:hover {
            border-color: var(--panel-border-hover);
            transform: translate3d(0, -3px, 0);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }
        .organised-ca-card:active {
            transform: scale3d(0.985, 0.985, 1);
        }

        .organised-ca-card-left-thumb {
            flex-shrink: 0;
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
        }
        .ca-card-thumb-img {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            object-fit: cover;
            display: block;
            border: 1px solid var(--panel-border);
        }
        .ca-card-no-image {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            background-color: var(--item-card-bg);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
        }
        .ca-card-no-image svg { opacity: 0.6; }
        .ca-card-no-image-text {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .organised-ca-card-right-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px 0;
        }
        .organised-ca-card-title {
            font-size: 15.5px;
            font-weight: 500;
            line-height: 1.38;
            color: var(--text-main);
            margin: 0;
            text-align: left;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .organised-ca-card-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .organised-ca-card-footer .note-card-date {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ---------------------------------------------------- */
        /* ARTICLE DETAIL VIEW (MATCHES DAILY CA STYLING)        */
        /* ---------------------------------------------------- */
        #organisedCaArticleView {
            display: none;
            width: 100%;
            flex-direction: column;
        }
        #organisedCaArticleView.is-active {
            display: flex;
            animation: pageSlideUpEntrance 0.45s var(--ease-premium) both;
        }

        .ca-controls-panel {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin-bottom: 24px;
            transition: background-color 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth);
        }

        .ca-controls-main-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
        }
        .ca-action-buttons-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ca-action-label-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .ca-direct-action-btn {
            background: var(--btn-blue);
            color: #ffffff !important;
            border: none;
            outline: none;
            padding: 5px 15px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.18s var(--ease-smooth), opacity 0.18s var(--ease-smooth);
        }
        .ca-direct-action-btn:active {
            transform: scale(0.93);
            opacity: 0.9;
        }
        .ca-dropdown-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.3s var(--ease-smooth), color 0.3s var(--ease-smooth);
        }
        .ca-dropdown-toggle-btn.is-rotated {
            transform: rotate(180deg);
            color: var(--text-main);
        }
        .ca-dropdown-toggle-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Drawers inside panel */
        .ca-image-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s var(--ease-smooth);
            width: 100%;
            overflow: hidden;
        }
        .ca-image-drawer.is-open {
            grid-template-rows: 1fr;
        }
        .ca-image-drawer-inner {
            min-height: 0;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            padding-top: 0;
            transition: opacity 0.3s var(--ease-smooth), padding-top 0.35s var(--ease-smooth);
        }
        .ca-image-drawer.is-open .ca-image-drawer-inner {
            opacity: 1;
            padding-top: 14px;
        }
        .ca-image-drawer-inner img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 16px;
            display: block;
        }
        .ca-image-caption {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
        }

        .ca-meta-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s var(--ease-smooth);
            width: 100%;
            overflow: hidden;
        }
        .ca-meta-drawer.is-open {
            grid-template-rows: 1fr;
        }
        .ca-meta-drawer-inner {
            min-height: 0;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            padding-top: 0;
            transition: opacity 0.3s var(--ease-smooth), padding-top 0.35s var(--ease-smooth);
        }
        .ca-meta-drawer.is-open .ca-meta-drawer-inner {
            opacity: 1;
            padding-top: 14px;
        }
        .ca-meta-row {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 12.5px;
            font-weight: 500;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: var(--text-muted);
            white-space: nowrap;
        }
        .meta-pill strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Article stage rests on background */
        .ca-article-feed-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .article-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.35px;
            color: var(--text-main);
            line-height: 1.34;
            margin-bottom: 22px;
            text-align: left;
        }

        .ca-content-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.42s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            width: 100%;
            will-change: grid-template-rows;
        }
        .ca-content-drawer.is-open {
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.48s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ca-content-overflow {
            min-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.28s ease;
            will-change: opacity;
        }
        .ca-content-drawer.is-open .ca-content-overflow {
            opacity: 1;
            transition: opacity 0.34s ease;
        }

        .ca-detailed-content-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.42s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            width: 100%;
            will-change: grid-template-rows;
        }
        .ca-detailed-content-drawer.is-open {
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.48s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ca-detailed-overflow {
            min-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.28s ease;
            will-change: opacity;
        }
        .ca-detailed-content-drawer.is-open .ca-detailed-overflow {
            opacity: 1;
            transition: opacity 0.34s ease;
        }

        .note-section {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--row-divider);
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        .note-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-heading {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            margin-bottom: 6px;
            text-align: left;
        }
        .note-p {
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-main);
            opacity: 0.92;
            padding-left: 0;
            text-align: left;
            margin: 0;
        }

        .note-items-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .note-item-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            text-align: left;
        }
        .point-subheading {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 6px;
            text-align: left;
        }
        .point-sublist {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .point-bullet-item {
            position: relative;
            padding-left: 18px;
            font-size: 14.5px;

    <!-- Interactive Organised CA Script -->
    <script>
        let organisedCaSelectedCategory = 'All';
        let organisedCaFloatingOpen = false;
        let organisedCaCurrentTopic = null;
        let organisedCaViewMode = 'full'; // 'full' | 'short'
        let organisedCaImageDrawerOpen = false;
        let organisedCaMetaDrawerOpen = false;

        function splitTopicCategories(rawCategory) {
            if (!rawCategory || typeof rawCategory !== 'string') return [];
            let s = rawCategory.trim();

            const protectedTerms = [
                { regex: /energy\s*(?:&|\/|and)\s*mineral\s*resources/gi, replacement: '__ENERGY_MINERAL__' },
                { regex: /art\s*(?:&|and)\s*culture/gi, replacement: '__ART_CULTURE__' },
                { regex: /science\s*(?:&|and)\s*technology/gi, replacement: '__SCI_TECH__' },
                { regex: /international\s*relations/gi, replacement: '__INTL_REL__' },
                { regex: /indian\s*society/gi, replacement: '__IND_SOC__' },
                { regex: /social\s*justice/gi, replacement: '__SOC_JUST__' },
                { regex: /internal\s*security/gi, replacement: '__INT_SEC__' },
                { regex: /disaster\s*management/gi, replacement: '__DIS_MGMT__' },
                { regex: /polity\s*(?:&|and)\s*governance/gi, replacement: '__POLITY_GOV__' }
            ];

            s = s.replace(/geography\s*(?:&|\/|and)\s*energy\s*\/\s*mineral\s*resources/gi, 'Geography / Energy and mineral resources');
            s = s.replace(/economy\s*\/\s*energy\s*&?\s*infrastructure/gi, 'Economy / Energy and mineral resources');

            protectedTerms.forEach(p => {
                s = s.replace(p.regex, p.replacement);
            });

            const rawTokens = s.split(/[\/;,&]|(?:\s+and\s+)/i);
            const result = [];

            rawTokens.forEach(token => {
                let clean = token.trim();
                if (!clean) return;

                clean = clean
                    .replace(/__ENERGY_MINERAL__/g, 'Energy and mineral resources')
                    .replace(/__ART_CULTURE__/g, 'Culture')
                    .replace(/__SCI_TECH__/g, 'Science and technology')
                    .replace(/__INTL_REL__/g, 'International relations')
                    .replace(/__IND_SOC__/g, 'Indian society')
                    .replace(/__SOC_JUST__/g, 'Social justice')
                    .replace(/__INT_SEC__/g, 'Internal security')
                    .replace(/__DIS_MGMT__/g, 'Disaster management')
                    .replace(/__POLITY_GOV__/g, 'Polity');

                const low = clean.toLowerCase();
                if (low === 'geography') clean = 'Geography';
                else if (low === 'economy') clean = 'Economy';
                else if (low === 'energy and mineral resources' || low === 'mineral resources' || low === 'energy') clean = 'Energy and mineral resources';
                else if (low === 'sports') clean = 'Sports';
                else if (low === 'culture' || low === 'art & culture' || low === 'art and culture') clean = 'Culture';
                else if (low === 'polity') clean = 'Polity';
                else if (low === 'history') clean = 'History';
                else if (low === 'indian society') clean = 'Indian society';
                else {
                    clean = clean.charAt(0).toUpperCase() + clean.slice(1);
                }

                if (clean && !result.includes(clean)) {
                    result.push(clean);
                }
            });

            return result;
        }

        function getAllOrganisedCaTopics() {
            const caAll = window.RAW_STUDY_DATA && window.RAW_STUDY_DATA.dailyCurrentAffairsData;
            if (!caAll) return [];

            const allTopics = [];
            Object.entries(caAll).forEach(([dateKey, dateObj]) => {
                const dateStr = dateObj.dateStr || dateKey;
                if (dateObj.topics && Array.isArray(dateObj.topics)) {
                    dateObj.topics.forEach(t => {
                        const categories = splitTopicCategories(t.category);
                        allTopics.push({
                            ...t,
                            categories: categories.length > 0 ? categories : [(t.category || 'General')],
                            dateKey: dateKey,
                            dateStr: dateStr
                        });
                    });
                }
            });

            return allTopics;
        }

        function getOrganisedCaCategories() {
            const topics = getAllOrganisedCaTopics();
            const discoveredSet = new Set();

            topics.forEach(t => {
                if (t.categories && Array.isArray(t.categories)) {
                    t.categories.forEach(c => discoveredSet.add(c));
                }
            });

            const preferredOrder = [
                'All',
                'Geography',
                'Economy',
                'Energy and mineral resources',
                'Sports',
                'Culture',
                'Polity',
                'Indian society',
                'History'
            ];

            const orderedCategories = [];
            preferredOrder.forEach(cat => {
                if (cat === 'All' || discoveredSet.has(cat)) {
                    orderedCategories.push(cat);
                    discoveredSet.delete(cat);
                }
            });

            Array.from(discoveredSet).sort().forEach(cat => {
                orderedCategories.push(cat);
            });

            return orderedCategories;
        }

        function renderDirectoryView() {
            const dirView = document.getElementById('organisedCaDirectoryView');
            const artView = document.getElementById('organisedCaArticleView');
            const pageTitle = document.getElementById('pageTitleText');
            if (dirView) dirView.style.display = 'block';
            if (artView) artView.classList.remove('is-active');
            if (pageTitle) pageTitle.textContent = 'Organised current affairs';

            const allTopics = getAllOrganisedCaTopics();
            const categories = getOrganisedCaCategories();

            if (!categories.includes(organisedCaSelectedCategory)) {
                organisedCaSelectedCategory = 'All';
            }

            const labelEl = document.getElementById('selectedCategoryLabel');
            if (labelEl) labelEl.textContent = organisedCaSelectedCategory;

            // Render floating panel category buttons
            const panelEl = document.getElementById('floatingOrganisedCaCategoryPanel');
            if (panelEl) {
                panelEl.innerHTML = categories.map(cat => 
                    '<button type="button" class="day-item-btn ' + (cat === organisedCaSelectedCategory ? 'is-selected' : '') + '" onclick="selectOrganisedCaCategory(\'' + cat.replace(/'/g, "\\'") + '\', event)">' + cat + '</button>'
                ).join('');
            }

            const filteredTopics = (organisedCaSelectedCategory === 'All')
                ? allTopics
                : allTopics.filter(t => t.categories && t.categories.includes(organisedCaSelectedCategory));

            const container = document.getElementById('organisedCaCardsContainer');
            if (!container) return;

            if (filteredTopics.length === 0) {
                container.innerHTML = '<div style="padding: 48px 16px; text-align: center; color: var(--text-muted); grid-column: 1 / -1;">No articles found in this category.</div>';
                return;
            }

            container.innerHTML = filteredTopics.map(topic => {
                const hasThumb = topic.image && topic.image.url;
                const thumbHtml = hasThumb ? 
                    '<img src="' + topic.image.url + '" alt="' + topic.topicTitle + '" class="ca-card-thumb-img" loading="lazy">' :
                    ('<div class="ca-card-no-image">' +
                        '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                            '<rect x="3" y="3" width="18" height="18" rx="4"></rect>' +
                            '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
                            '<polyline points="21 15 16 10 5 21"></polyline>' +
                        '</svg>' +
                        '<span class="ca-card-no-image-text">no image</span>' +
                    '</div>');

                return (
                    '<div class="organised-ca-card" onclick="openOrganisedCaArticle(\'' + topic.topicTitle.replace(/'/g, "\\'") + '\')">' +
                        '<div class="organised-ca-card-left-thumb">' + thumbHtml + '</div>' +
                        '<div class="organised-ca-card-right-content">' +
                            '<h3 class="organised-ca-card-title">' + topic.topicTitle + '</h3>' +
                            '<div class="organised-ca-card-footer">' +
                                '<span class="note-card-date">' + (topic.dateStr || 'Recent') + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</div>'
                );
            }).join('');
        }

        function toggleOrganisedCaCategoryDropdown(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById('floatingOrganisedCaCategoryPanel');
            const backdrop = document.getElementById('floatingBackdrop');
            if (!panel) return;

            if (panel.classList.contains('is-open')) {
                closeOrganisedCaCategoryDropdown();
            } else {
                panel.classList.remove('is-closing');
                panel.classList.add('is-open');
                if (backdrop) backdrop.classList.add('is-active');
                organisedCaFloatingOpen = true;
            }
        }
        window.toggleOrganisedCaCategoryDropdown = toggleOrganisedCaCategoryDropdown;

        function closeOrganisedCaCategoryDropdown() {
            const panel = document.getElementById('floatingOrganisedCaCategoryPanel');
            const backdrop = document.getElementById('floatingBackdrop');
            if (backdrop) backdrop.classList.remove('is-active');
            if (!panel || !panel.classList.contains('is-open') || panel.classList.contains('is-closing')) {
                organisedCaFloatingOpen = false;
                return;
            }
            panel.classList.add('is-closing');
            organisedCaFloatingOpen = false;
            setTimeout(() => {
                panel.classList.remove('is-open', 'is-closing');
            }, 200);
        }
        window.closeOrganisedCaCategoryDropdown = closeOrganisedCaCategoryDropdown;

        function selectOrganisedCaCategory(cat, e) {
            if (e) e.stopPropagation();
            organisedCaSelectedCategory = cat;
            closeOrganisedCaCategoryDropdown();
            setTimeout(() => {
                renderDirectoryView();
            }, 160);
        }
        window.selectOrganisedCaCategory = selectOrganisedCaCategory;

        // Dismiss dropdown on outside click
        document.addEventListener('click', (e) => {
            if (organisedCaFloatingOpen) {
                const panel = document.getElementById('floatingOrganisedCaCategoryPanel');
                const btn = document.getElementById('organisedCaCategoryBtn');
                if (panel && !panel.contains(e.target) && (!btn || !btn.contains(e.target))) {
                    closeOrganisedCaCategoryDropdown();
                }
            }
        });

        function openOrganisedCaArticle(topicTitle) {
            const allTopics = getAllOrganisedCaTopics();
            const topic = allTopics.find(t => t.topicTitle && t.topicTitle.toLowerCase() === topicTitle.toLowerCase());
            if (!topic) return;

            organisedCaCurrentTopic = topic;
            organisedCaViewMode = 'full';
            organisedCaImageDrawerOpen = false;
            organisedCaMetaDrawerOpen = false;

            const dirView = document.getElementById('organisedCaDirectoryView');
            const artView = document.getElementById('organisedCaArticleView');
            const pageTitle = document.getElementById('pageTitleText');

            if (dirView) dirView.style.display = 'none';
            if (artView) {
                artView.classList.remove('is-active');
                void artView.offsetWidth;
                artView.classList.add('is-active');
            }

            if (pageTitle) {
                if (organisedCaSelectedCategory && organisedCaSelectedCategory !== 'All') {
                    pageTitle.textContent = organisedCaSelectedCategory;
                } else if (topic.categories && topic.categories.length > 0) {
                    pageTitle.textContent = topic.categories[0];
                } else {
                    pageTitle.textContent = 'Organised current affairs';
                }
            }

            // Controls panel
            const hasImage = !!(topic.image && topic.image.url);
            const imgBtn = document.getElementById('orgImageActionBtn');
            if (imgBtn) {
                imgBtn.textContent = 'View';
                imgBtn.style.opacity = hasImage ? '1' : '0.4';
                imgBtn.style.pointerEvents = hasImage ? 'auto' : 'none';
            }
            const imgInner = document.getElementById('orgImageDrawerInner');
            if (imgInner) {
                imgInner.innerHTML = hasImage ? 
                    ('<img src="' + topic.image.url + '" alt="' + (topic.image.caption || 'Topic Graphic') + '" loading="lazy">' +
                    (topic.image.caption ? '<div class="ca-image-caption">' + topic.image.caption + '</div>' : ''))
                    : '<div style="font-size: 13px; color: var(--text-muted); padding: 8px 0;">No graphic or infographic attached for this topic.</div>';
            }

            const metaInner = document.getElementById('orgMetaDrawerInner');
            if (metaInner) {
                metaInner.innerHTML = 
                    '<div class="ca-meta-row">' +
                        '<span class="meta-pill">GS Paper : <strong>' + (topic.gsPaper || 'General Studies') + '</strong></span>' +
                    '</div>' +
                    '<div class="ca-meta-row">' +
                        '<span class="meta-pill">Category : <strong>' + (topic.category || 'National') + '</strong></span>' +
                    '</div>' +
                    '<div class="ca-meta-row">' +
                        '<span class="meta-pill">Comes under : <strong>' + (topic.comesUnder || 'Prelims & Mains') + '</strong></span>' +
                    '</div>';
            }

            const readBtn = document.getElementById('orgReadActionBtn');
            if (readBtn) readBtn.textContent = 'Short';

            // Article content
            const titleEl = document.getElementById('orgArticleTitle');
            if (titleEl) titleEl.textContent = topic.topicTitle;

            const shortContent = document.getElementById('orgShortContent');
            if (shortContent) shortContent.innerHTML = renderOrganisedCaShortRevision(topic);

            const detailedContent = document.getElementById('orgDetailedContent');
            if (detailedContent) detailedContent.innerHTML = renderOrganisedCaArticleSections(topic);

            const shortDrawer = document.getElementById('orgShortDrawer');
            const detailedDrawer = document.getElementById('orgDetailedDrawer');
            if (shortDrawer) shortDrawer.classList.remove('is-open');
            if (detailedDrawer) detailedDrawer.classList.add('is-open');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.openOrganisedCaArticle = openOrganisedCaArticle;

        function handleOrganisedBack() {
            const artView = document.getElementById('organisedCaArticleView');
            if (artView && artView.classList.contains('is-active')) {
                renderDirectoryView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '/index.html';
                }
            }
        }
        window.handleOrganisedBack = handleOrganisedBack;

        function toggleOrgImage() {
            organisedCaImageDrawerOpen = !organisedCaImageDrawerOpen;
            const imgBtn = document.getElementById('orgImageActionBtn');
            if (imgBtn) imgBtn.textContent = organisedCaImageDrawerOpen ? 'Close' : 'View';
            const drawer = document.getElementById('orgImageDrawer');
            if (drawer) drawer.classList.toggle('is-open', organisedCaImageDrawerOpen);
        }
        window.toggleOrgImage = toggleOrgImage;

        function toggleOrgReadMode() {
            organisedCaViewMode = (organisedCaViewMode === 'full') ? 'short' : 'full';
            const readBtn = document.getElementById('orgReadActionBtn');
            if (readBtn) readBtn.textContent = (organisedCaViewMode === 'short') ? 'Full' : 'Short';
            const shortDrawer = document.getElementById('orgShortDrawer');
            const detailedDrawer = document.getElementById('orgDetailedDrawer');
            if (organisedCaViewMode === 'short') {
                if (shortDrawer) shortDrawer.classList.add('is-open');
                if (detailedDrawer) detailedDrawer.classList.remove('is-open');
            } else {
                if (shortDrawer) shortDrawer.classList.remove('is-open');
                if (detailedDrawer) detailedDrawer.classList.add('is-open');
            }
        }
        window.toggleOrgReadMode = toggleOrgReadMode;

        function toggleOrgMetaDropdown() {
            organisedCaMetaDrawerOpen = !organisedCaMetaDrawerOpen;
            const btn = document.getElementById('orgMetaDropdownBtn');
            if (btn) btn.classList.toggle('is-rotated', organisedCaMetaDrawerOpen);
            const drawer = document.getElementById('orgMetaDrawer');
            if (drawer) drawer.classList.toggle('is-open', organisedCaMetaDrawerOpen);
        }
        window.toggleOrgMetaDropdown = toggleOrgMetaDropdown;

        function renderOrganisedCaListBlock(list) {
            if (!list || !list.length) return '';
            return list.map(rawText => {
                if (!rawText || typeof rawText !== 'string') return '';

                let labelPart = '';
                let restPart = rawText;

                if (rawText.includes('</strong>')) {
                    const parts = rawText.split('</strong>');
                    labelPart = parts[0].replace(/<[^>]+>/g, '').trim();
                    restPart = parts.slice(1).join('</strong>').trim();
                    if (restPart.startsWith(':')) {
                        labelPart += ' :';
                        restPart = restPart.substring(1).trim();
                    }
                } else if (rawText.includes(':')) {
                    const colonIdx = rawText.indexOf(':');
                    labelPart = rawText.substring(0, colonIdx + 1).trim();
                    restPart = rawText.substring(colonIdx + 1).trim();
                }

                const subItems = restPart ? restPart.split(';').map(s => s.trim().replace(/^,\s*/, '')).filter(Boolean) : [];
                if (subItems.length === 0 && restPart) subItems.push(restPart);

                if (labelPart) {
                    return (
                        '<div class="note-item-group">' +
                            '<div class="point-subheading">' + labelPart + '</div>' +
                            '<ul class="point-sublist">' +
                                subItems.map(s => '<li class="point-bullet-item">' + s + '</li>').join('') +
                            '</ul>' +
                        '</div>'
                    );
                } else {
                    return (
                        '<div class="note-item-group">' +
                            '<ul class="point-sublist">' +
                                subItems.map(s => '<li class="point-bullet-item">' + s + '</li>').join('') +
                            '</ul>' +
                        '</div>'
                    );
                }
            }).join('');
        }

        function renderOrganisedCaShortRevision(topic) {
            if (!topic) return '';
            const why = (topic.shortArticle && topic.shortArticle.whyInNews) || topic.whyInNews;
            const concept = (topic.shortArticle && topic.shortArticle.whatConcept) || topic.whatConcept;
            return (
                '<section class="note-section">' +
                    '<h3 class="section-heading">Quick Revision</h3>' +
                    (why ? '<p class="note-p">' + why + '</p>' : '') +
                    (concept ? '<p class="note-p" style="margin-top: 10px;">' + concept + '</p>' : '') +
                '</section>'
            );
        }

        function renderOrganisedCaArticleSections(data) {
            if (!data) return '';

            let orgRowsHtml = '';
            if (data.whoOrg && data.whoOrg.length > 0) {
                orgRowsHtml = data.whoOrg.map(row => (
                    '<div class="info-callout-row"><strong>' + row.label + ' :</strong> ' + row.val + '</div>'
                )).join('');
            }

            return (
                (data.whyInNews ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Why in News?</h3>' +
                        '<p class="note-p">' + data.whyInNews + '</p>' +
                    '</section>' : '') +

                (data.whatConcept ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">What / Concept</h3>' +
                        '<p class="note-p">' + data.whatConcept + '</p>' +
                    '</section>' : '') +

                (orgRowsHtml ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Who / Organisation</h3>' +
                        '<div class="info-callout">' + orgRowsHtml + '</div>' +
                    '</section>' : '') +

                (data.importantFacts && data.importantFacts.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Important Facts ⭐</h3>' +
                        '<div class="note-items-wrapper">' + renderOrganisedCaListBlock(data.importantFacts) + '</div>' +
                    '</section>' : '') +

                (data.background && data.background.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Background / Static Linkage</h3>' +
                        '<div class="note-items-wrapper">' + renderOrganisedCaListBlock(data.background) + '</div>' +
                    '</section>' : '') +

                (data.significance && data.significance.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Significance</h3>' +
                        '<div class="note-items-wrapper">' + renderOrganisedCaListBlock(data.significance) + '</div>' +
                    '</section>' : '') +

                (data.challenges && data.challenges.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Challenges / Concerns</h3>' +
                        '<div class="note-items-wrapper">' + renderOrganisedCaListBlock(data.challenges) + '</div>' +
                    '</section>' : '') +

                (data.wayForward && data.wayForward.length > 0 ? 
                    '<section class="note-section">' +
                        '<h3 class="section-heading">Way Forward</h3>' +
                        '<div class="note-items-wrapper">' + renderOrganisedCaListBlock(data.wayForward) + '</div>' +
                    '</section>' : '')
            );
        }

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', () => {
            renderDirectoryView();
        });
    </script>
    <script src="/script.js"></script>
</body>
