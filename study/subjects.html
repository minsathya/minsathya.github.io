<html lang="en">
<head>

    <!-- Instant Theme Evaluation to Prevent Theme Flash on Reload -->
    <script>
      (function() {
        const activeTheme = sessionStorage.getItem('dashboard-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const isLight = (activeTheme === 'light' || (!activeTheme && prefersLight));
        if (isLight) {
          document.documentElement.classList.add('light-mode');
        }
        document.documentElement.style.backgroundColor = isLight ? '#f5f5f7' : '#0b0b0b';
      })();
    </script>

    <!-- Universal iPad stabilization -->
    <script>
      if (window.location.search.includes('tf=1') || window.location.href.includes(':~:text=')) {
        document.documentElement.classList.add('instant-landing');
      }

    <!-- Favicon & Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=3">
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png?v=3">
    <link id="favicon" rel="icon" type="image/png" href="/favicon-light.png?v=3">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);

            /* Theme Tokens: Dark Mode Default */
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #737373;
            --panel-bg: #141414;
            --panel-border: #222222;
            --panel-border-hover: rgba(255, 255, 255, 0.11);
            --row-divider: #1c1c1c;
            --row-hover: rgba(255, 255, 255, 0.03);

            /* Pill Buttons */
            --open-btn-bg: #222222;
            --open-btn-text: #ffffff;
            --close-btn-bg: #0080FF;
            --close-btn-text: #ffffff;
            --back-btn-hover: rgba(255, 255, 255, 0.08);
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --text-main: #111111;
            --text-muted: #8e8e93;
            --panel-bg: #ffffff;
            --panel-border: #e2e2e7;
            --panel-border-hover: rgba(0, 0, 0, 0.10);
            --row-divider: #f2f2f7;
            --row-hover: rgba(0, 0, 0, 0.02);

            --open-btn-bg: #ebebf0;
            --open-btn-text: #1c1c1e;
            --close-btn-bg: #0080FF;
            --close-btn-text: #ffffff;
            --back-btn-hover: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        html {
            background-color: var(--bg-color);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 36px 24px;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.4s var(--ease-smooth), color 0.4s var(--ease-smooth);
        }

        /* -------------------------------------------------------------
           TOP NAVIGATION: 's' BRANDMARK WITH TWINKLING STAR
           ------------------------------------------------------------- */
        
        /* 60FPS MASTER ENTRANCE ANIMATION */
        @keyframes masterEntrance {
            from {
                opacity: 0;
                transform: translate3d(0, 16px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* Animation runner class */
        .master-entrance-run {
            animation: masterEntrance 0.38s var(--ease-premium) backwards !important;
            will-change: transform, opacity;
        }

        .top-nav-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 24px;
            position: relative;
            z-index: 10;
            animation: masterEntrance 0.38s var(--ease-premium) both;
        }

        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            justify-content: flex-start;
            height: auto;
            padding: 0 4px;
            background-color: transparent !important;
            border: none !important;
            text-decoration: none !important;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1.2px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            transform: translateZ(0);
            transition: transform 0.45s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:active {
            transform: translate3d(0, -3px, 0) scale3d(1.02, 1.02, 1);
        }

        .brand-letter {
            color: var(--text-main);
            line-height: 1;
            transition: color 0.4s var(--ease-smooth);
        }

        /* Round Twinkling Star (Scales small to large in #ff9e79 with soft glow) */
        .brand-star {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff9e79;
            box-shadow: 0 0 6px rgba(255, 158, 121, 0.75), 0 0 12px rgba(255, 158, 121, 0.4);
            margin-left: 2px;
            margin-bottom: 0;
            vertical-align: -1px;
            flex-shrink: 0;
            line-height: 1;
            transform-origin: center center;
            animation: roundStarPulse 3s infinite ease-in-out alternate;
        }

        @keyframes roundStarPulse {
            0% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
            50% {
                transform: scale(1.0) translateZ(0);
                opacity: 1;
                box-shadow: 0 0 8px rgba(255, 158, 121, 0.85), 0 0 14px rgba(255, 158, 121, 0.45);
            }
            100% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
        }

        .subjects-header-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 24px auto;
        }

        .back-icon-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            padding: 0;
            flex-shrink: 0;
            transition: background-color 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
        }

        .back-icon-btn:hover {
            background-color: var(--back-btn-hover);
            transform: translate3d(-2px, 0, 0);
        }

        .back-icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .page-title {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: -0.6px;
            color: var(--text-main);
            line-height: 1.2;
        }

        /* -------------------------------------------------------------
           SPLIT MASTER-DETAIL SUBJECTS LAYOUT (LAPTOP & IPAD RATIO)
           ------------------------------------------------------------- */
        main.subjects-main-container {
            flex-grow: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            gap: 48px;
            padding-bottom: 48px;
        }

        /* Left Sidebar - Subjects List (No background, muted dots to white on hover/active) */
        .subjects-sidebar {
            width: 270px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .subject-nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 12px 14px;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            user-select: none;
            touch-action: manipulation;
            border-radius: 12px;
            -webkit-tap-highlight-color: transparent !important;
            transition: color 0.25s var(--ease-smooth);
        }

        .subject-nav-name {
            font-size: 17px;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.3;
            display: inline-block;
            transform-origin: left center !important;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), 
                        color 0.28s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Muted Dot - NO BLUE DOTS */
        .subject-nav-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-muted);
            opacity: 0.35;
            flex-shrink: 0;
            transition: background-color 0.28s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.28s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Hover: dot becomes white smoothly, word zoom little straight */
        @media (hover: hover) and (pointer: fine) {
            .subject-nav-item:hover .subject-nav-name {
                color: var(--text-main);
                transform: scale3d(1.028, 1.028, 1) !important;
            }

            .subject-nav-item:hover .subject-nav-dot {
                opacity: 1;
                background-color: #ffffff;
            }

            body.light-mode .subject-nav-item:hover .subject-nav-dot {
                background-color: #111111;
            }
        }

        /* Active / Selected Subject */
        .subject-nav-item.is-active .subject-nav-name {
            color: var(--text-main);
            font-weight: 500;
        }

        .subject-nav-item.is-active .subject-nav-dot {
            opacity: 1;
            background-color: #ffffff;
        }

        body.light-mode .subject-nav-item.is-active .subject-nav-dot {
            background-color: #111111;
        }

        /* Right Content Panel (Rounded capsule container matching Image 1) */
        .subjects-detail-panel {
            flex: 1;
            min-width: 0;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 32px 36px;
            box-shadow: none !important;
            will-change: transform, opacity;
            transition: background-color 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth);
        }

        .panel-header-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--row-divider);
            margin-bottom: 24px;
        }

        .panel-subject-title {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: -0.4px;
            color: var(--text-main);
            line-height: 1.2;
        }

        /* Sub-section Uppercase Heading (e.g. INDIAN HISTORY, WORLD HISTORY) */
        .subject-sub-heading {
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 24px 0 12px 0;
        }

        .subject-sub-heading:first-child {
            margin-top: 4px;
        }

        /* Topics List Inside Content Panel */
        .subject-topics-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .subject-topic-item {
            display: flex;
            align-items: center;
        }

        .subject-topic-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 4px;
            text-decoration: none !important;
            color: var(--text-main);
            font-size: 17px;
            cursor: pointer;
            width: fit-content;
        }

        .topic-bullet {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1;
            opacity: 0.6;
            user-select: none;
            flex-shrink: 0;
        }

        .topic-title {
            font-size: 17px;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.4;
            display: inline-block;
            transform-origin: left center !important;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), 
                        color 0.28s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .subject-topic-link:hover .topic-title {
            transform: scale3d(1.028, 1.028, 1) !important;
            color: var(--text-main);
        }

        /* -------------------------------------------------------------
           FOOTER
           ------------------------------------------------------------- */
        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            margin-top: 24px;
        }

        .footer-links-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 26px;
            flex-wrap: wrap;
            width: 100%;
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            transition: color 0.3s var(--ease-smooth);
        }

        .footer-links-row a:hover {
            color: var(--text-main) !important;
        }

        .copyright-tag {
            color: var(--text-muted);
            opacity: 0.7;
            font-size: 12px;
            letter-spacing: 0.2px;
        }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            backface-visibility: hidden !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        /* Responsive Breakpoints - Full Screen Edge-to-Edge Pill Scrolling on iPad & Mobile */
        @media (max-width: 860px) {
            main.subjects-main-container {
                flex-direction: column;
                gap: 24px;
                overflow: visible;
            }

            .subjects-sidebar {
                width: calc(100% + 48px);
                margin-left: -24px;
                margin-right: -24px;
                padding-left: 24px;
                padding-right: 24px;
                flex-direction: row;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 6px;
                gap: 8px;
                scrollbar-width: none;
            }

            .subjects-sidebar::-webkit-scrollbar {
                display: none;
            }

            .subject-nav-item {
                flex-shrink: 0;
                width: auto;
                padding: 9px 16px;
                border: 1px solid var(--panel-border) !important;
                border-radius: 20px;
                gap: 8px;
            }

            .subject-nav-name {
                font-size: 15px;
            }

            .subjects-detail-panel {
                width: 100%;
                padding: 24px 20px;
                border-radius: 20px;
            }

            .panel-subject-title {
                font-size: 20px;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 24px 16px 24px 16px;
            }

            .subjects-sidebar {
                width: calc(100% + 32px);
                margin-left: -16px;
                margin-right: -16px;
                padding-left: 16px;
                padding-right: 16px;
            }

            .brand-pill {
                font-size: 34px;
            }

            .page-title {
                font-size: 24px;
            }
        }
    
        /* UNIVERSAL FLAT DESIGN: ZERO PANEL SHADOWS SITE-WIDE */
        .capsule-panel,
        .subject-accordion-card,
        .card,
        .wide-capsule,
        .article-card,
        .date-topics-capsule,
        .macro-card,
        .day-switcher-capsule {
            box-shadow: none !important;
        }

        .capsule-panel:hover,
        .capsule-panel:active,
        .capsule-panel:focus-within,
        .subject-accordion-card:hover,
        .subject-accordion-card:active,
        .subject-accordion-card:focus-within,
        .card:hover,
        .card:active,
        .wide-capsule:hover,
        .wide-capsule:active,
        .article-card:hover,
        .article-card:active {
            box-shadow: none !important;
        }

        /* TOUCH OPTIMIZATION (IPAD / TOUCHSCREEN): NO STICKY HOVER LAG */
        @media (hover: none) {
            .capsule-panel:hover,
            .subject-accordion-card:hover,
            .card:hover,
            .wide-capsule:hover,
            .article-card:hover {
                transform: none !important;
            }
            .capsule-panel:active,
            .subject-accordion-card:active,
            .card:active,
            .wide-capsule:active {
                transform: scale3d(0.985, 0.985, 1) !important;
                transition: transform 0.12s ease-out !important;
            }
        }

        /* CLICKABLE WORDS ZOOM TOWARDS US STRAIGHT */
        .nav-text,
        .topic-title,
        .site-name,
        .sortable {
            display: inline-block !important;
            transform-origin: left center !important;
            will-change: transform !important;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }

        .footer-links-row a,
        .footer-links-row a .nav-text,
        .sortable {
            transform-origin: center center !important;
        }

        @media (hover: hover) and (pointer: fine) {
            .subject-topic-link:hover .topic-title,
            .topics-column-grid a:hover,
            .topics-column-grid a:hover .nav-text,
            .site-name:hover,
            .sortable:hover,
            a:not(.brand-pill):not(.back-icon-btn):hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
            }
            .footer-links-row a:hover,
            .footer-links-row a:hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
            }
        }

    </style>
</head>

    <!-- Top Left Brand 's' with Animated Twinkling Star -->
    <nav class="top-nav-bar" id="topNavBar">
        <a href="/index.html" class="logo brand-pill" id="brandPill" aria-label="sathya.">
            <span class="brand-letter">s</span>
            <span class="brand-star" aria-hidden="true"></span>
        </a>
    </nav>

    <!-- Header Row: Back Arrow + Subjects Title (Matches Image 1 & 2) -->
    <div class="subjects-header-row">
        <button type="button" class="back-icon-btn" onclick="goBackToHome()" aria-label="Go Back">
            <svg viewBox="0 0 24 24">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <h1 class="page-title">Subjects</h1>
    </div>

    <!-- Main Container: Split Master-Detail Layout (Laptop & iPad) -->
    <main class="subjects-main-container master-entrance-run" id="subjectsListContainer">

        <!-- Left Sidebar: Subjects List (No background, muted dots to white on hover/active, dot at START) -->
        <nav class="subjects-sidebar" id="subjectsSidebar" aria-label="Subjects Navigation">

                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">History</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-geography" onclick="selectSubject('subject-geography', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">Geography</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-indian-society" onclick="selectSubject('subject-indian-society', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">Indian society</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-polity" onclick="selectSubject('subject-polity', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">Polity</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-governance" onclick="selectSubject('subject-governance', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">Governance</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-social-justice" onclick="selectSubject('subject-social-justice', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">Social justice</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-international-relations" onclick="selectSubject('subject-international-relations', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">International relations</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-economy" onclick="selectSubject('subject-economy', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">Economy</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-science-technology" onclick="selectSubject('subject-science-technology', true)">
                <span class="subject-nav-dot"></span>
                <span class="subject-nav-name">Science and technology</span>
            </button>
            <button type="button" class="subject-nav-item" data-id="subject-environment" onclick="selectSubject('subject-environment', true)">
                <span class="subject-nav-dot"></span>

            element.classList.remove('master-entrance-run');
            element.style.opacity = '0';
            element.style.transform = 'translate3d(0, 14px, 0)';
            element.style.transition = 'none';
            requestAnimationFrame(() => {
                element.style.transition = 'opacity 0.36s cubic-bezier(0.16, 1, 0.3, 1), transform 0.36s cubic-bezier(0.16, 1, 0.3, 1)';
                element.style.opacity = '1';

        function selectSubject(subjectId, animate = true) {
            const subject = SUBJECTS_DATA.find(s => s.id === subjectId || s.id.replace('subject-', '') === subjectId);
            if (!subject) return;

            // Update active state in sidebar
            document.querySelectorAll('.subject-nav-item').forEach(item => {
                if (item.getAttribute('data-id') === subject.id) {
                    item.classList.add('is-active');
                } else {
                    item.classList.remove('is-active');
                }
            });

            // Update right detail panel
            const panel = document.getElementById('subjectDetailPanel');
            if (!panel) return;

            let sectionsHtml = '';
            subject.sections.forEach(sec => {
                if (sec.subTitle) {
                    sectionsHtml += `<div class="subject-sub-heading">${sec.subTitle}</div>`;
                }
                sectionsHtml += '<ul class="subject-topics-list">';
                sec.topics.forEach(topic => {
                    sectionsHtml += `
                        <li class="subject-topic-item">
                            <a href="#" class="subject-topic-link">
                                <span class="topic-bullet">•</span>
                                <span class="topic-title">${topic}</span>
                            </a>
                        </li>`;
                });
                sectionsHtml += '</ul>';
            });

            panel.innerHTML = `
                <div class="panel-header-row">
                    <h2 class="panel-subject-title">${subject.title}</h2>
                </div>
                <div class="panel-body">
                    ${sectionsHtml}
                </div>
            `;

            // Trigger smooth master entrance animation
            if (animate) {
                triggerMasterEntrance(panel);
            }

            // Sync URL hash without jumping
            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, '', '#' + subject.id.replace('subject-', ''));
            }
        }

        // Initialize based on URL hash if present, otherwise default to Art and culture
        window.addEventListener('DOMContentLoaded', () => {
            let activeId = 'subject-art-culture';
            if (window.location.hash) {
                const hash = window.location.hash.replace('#', '').toLowerCase();
                const matched = SUBJECTS_DATA.find(s => s.id === 'subject-' + hash || s.id === hash || s.id.replace('subject-', '') === hash);
                if (matched) {
                    activeId = matched.id;
                }
            }
            selectSubject(activeId, false);
        });
