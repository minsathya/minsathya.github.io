    <!-- Instant Theme Evaluation to Prevent Theme Flash on Reload -->
    <script>
      (function() {
        const activeTheme = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const isLight = (activeTheme === 'light' || (!activeTheme && prefersLight));
        if (isLight) {
          document.documentElement.classList.add('light-mode');
          document.documentElement.style.backgroundColor = '#f5f5f7';
        } else {
          document.documentElement.classList.remove('light-mode');
          document.documentElement.style.backgroundColor = '#0b0b0b';
        }
        document.documentElement.style.backgroundColor = isLight ? '#f5f5f7' : '#0b0b0b';
      })();
    </script>

    <style>
      html {

      }

      :root {
        --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
        --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
        --bg-color: #0b0b0b;
        --text-main: #ffffff;
        --text-muted: #777777;
        --panel-bg: #121212;
        --panel-border: #222222;
        --panel-border-hover: rgba(255, 255, 255, 0.11);
        --row-divider: #1c1c1c;
        --header-bg: #1a231e;
        --header-border: #222c26;
        --accent-tag-bg: #1c2720;
        --accent-tag-text: #6ec981;
        --pill-box-bg: rgba(255, 255, 255, 0.025);
        --pill-box-border: #222222;

        --btn-blue: #244b40;
        --btn-blue-hover: #2e5c50;
        --theme-green: #244b40;
        --pill-bg: rgba(255, 255, 255, 0.06);
        --pill-border: rgba(255, 255, 255, 0.08);

        --link-color: #2997ff;
        --link-underline: rgba(41, 151, 255, 0.35);

        --cascade-distance: 24px;
        --cascade-duration-exit: 0.2s;
        --cascade-duration-entry: 0.28s;
      }

      html.light-mode,
      body.light-mode {
        --bg-color: #f5f5f7;
        --text-main: #111111;
        --text-muted: #88888e;
        --panel-bg: #ffffff;
        --panel-border: #e2e2e7;
        --panel-border-hover: rgba(0, 0, 0, 0.10);
        --row-divider: #f2f2f7;
        --header-bg: #ffffff;
        --header-border: #d4d8cf;
        --accent-tag-bg: #e2ede5;
        --accent-tag-text: #1d6e35;
        --pill-box-bg: rgba(0, 0, 0, 0.025);
        --pill-box-border: #e2e2e7;

        --btn-blue: #296556;
        --btn-blue-hover: #1e4d42;
        --theme-green: #296556;
        --pill-bg: rgba(0, 0, 0, 0.05);
        --pill-border: rgba(0, 0, 0, 0.08);

        --link-color: #0066cc;
        --link-underline: rgba(0, 102, 204, 0.35);
      }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px 36px 24px;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            /* overflow-x on html */
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        
        /* TOP NAVIGATION: 's' BRANDMARK & ROUND TWINKLING STAR */
        .top-nav-bar {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 28px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            animation: masterEntrance 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .brand-pill {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            height: auto;
            padding: 0 4px;
            background-color: transparent !important;
            border: none !important;
            text-decoration: none !important;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: -0.8px;
            line-height: 1;
            box-shadow: none !important;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transform: translateZ(0);
            transition: transform 0.45s var(--ease-smooth);
        }

        .brand-pill:hover,
        .brand-pill:active {
            transform: translate3d(0, -3px, 0) scale3d(1.02, 1.02, 1);
        }

        .brand-letter {
            color: var(--text-main);
            line-height: 1;
            transition: color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Round Twinkling Star (Scales small to large in #ff9e79 with soft glow) */
        .brand-star {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff9e79;
            box-shadow: 0 0 6px rgba(255, 158, 121, 0.75), 0 0 12px rgba(255, 158, 121, 0.4);
            margin-left: 2px;
            margin-bottom: 0;
            vertical-align: -1px;
            flex-shrink: 0;
            line-height: 1;
            transform-origin: center center;
            animation: roundStarPulse 3s infinite ease-in-out alternate;
        }

        @keyframes roundStarPulse {
            0% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
            50% {
                transform: scale(1.0) translateZ(0);
                opacity: 1;
                box-shadow: 0 0 8px rgba(255, 158, 121, 0.85), 0 0 14px rgba(255, 158, 121, 0.45);
            }
            100% {
                transform: scale(0.4) translateZ(0);
                opacity: 0.5;
                box-shadow: 0 0 3px rgba(255, 158, 121, 0.4);
            }
        }
    
        /* MASTER ENTRANCE */
        @keyframes masterEntrance {
            0% {
                opacity: 0;
                transform: translate3d(0, 28px, 0) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        .master-entrance-run {
            animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            will-change: transform, opacity;
        }

        .date-topics-capsule, .topics-feed {
            animation: masterEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
        }

        @keyframes sideNavEntrance {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .side-nav-btn {
            opacity: 1;
            will-change: opacity;
            animation: sideNavEntrance 0.45s var(--ease-smooth) backwards;
        }

        /* HEADER */
        header {
            position: relative;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-radius: 28px;
            width: 100%;
            max-width: 1200px;
            height: 72px;
            margin: 0 auto 50px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            touch-action: manipulation;
            z-index: 10;
            will-change: transform, box-shadow, border-color;
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) header { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }

        header:hover,
        header:focus-within,
        header:active,
        header.is-header-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1);
            border-color: #1E1E1E;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
        }

        body.light-mode header:hover,
        body.light-mode header:focus-within,
        body.light-mode header:active,
        body.light-mode header.is-header-lifted {
            border-color: #b8b8bc;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.09);
        }

        .header-inner-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        #headerMainView { opacity: 1; transform: translate3d(0, 0, 0); pointer-events: auto; z-index: 2; }
        #headerSearchView { opacity: 0; transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); pointer-events: none; z-index: 1; }

        header.state-search #headerMainView { animation: skyfallExit var(--cascade-duration-exit) ease-in both; pointer-events: none; }
        header.state-search #headerSearchView { animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both; animation-delay: var(--cascade-duration-exit); pointer-events: auto; }
        header.state-main #headerSearchView { animation: skyfallExit var(--cascade-duration-exit) ease-in both; pointer-events: none; }
        header.state-main #headerMainView { animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both; animation-delay: var(--cascade-duration-exit); pointer-events: auto; }

        @keyframes skyfallExit {
            0% { transform: translate3d(0, 0, 0); opacity: 1; }
            100% { transform: translate3d(0, var(--cascade-distance), 0); opacity: 0; }
        }

        @keyframes skyfallEntry {
            0% { transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }

        .header-right-cluster, .search-control-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;

        }

        .logo {

        }

        .ctrl-btn {

        }

        .ctrl-btn:hover { opacity: 0.6; }

        .ctrl-btn svg, .search-static-icon {

        .search-core-input {

        .clear-text-btn svg { opacity: 0.4; }

        .theme-toggle {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .theme-toggle svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform-origin: center center;
            transition: transform 0.8s var(--ease-smooth), opacity 0.8s var(--ease-smooth), stroke 0.8s var(--ease-smooth);
        }

        .theme-toggle .sun-icon { opacity: 0; transform: translate(-50%, -50%) rotate(-90deg) scale(0.4); }
        .theme-toggle .moon-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .sun-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .moon-icon { opacity: 0; transform: translate(-50%, -50%) rotate(90deg) scale(0.4); }

        /* MAIN PAGE STRUCTURE */
        main {
            flex-grow: 1;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 60px auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* BREADCRUMBS */
        .breadcrumb-nav {
            font-size: 14.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;

        }

        .breadcrumb-nav a {
            color: var(--text-muted);

        }

        .breadcrumb-nav a:hover { color: var(--text-main); }
        .bc-sep { opacity: 0.5; transition: color 0.8s var(--ease-smooth); }
        .bc-current { color: var(--text-main); font-weight: 500; transition: color 0.8s var(--ease-smooth); }

        /* DATE & TOPICS CAPSULE (STABLE CONTROL BAR - NO HARSH ZOOM) */
        .date-topics-capsule {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 16px 28px;
            margin-bottom: 12px !important;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transform: none !important;
            transition: border-color 0.4s ease, 
                        background-color 0.8s var(--ease-smooth), 
                        box-shadow 0.8s var(--ease-smooth);
        }

        body.light-mode .date-topics-capsule {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .date-topics-capsule:hover,
        .date-topics-capsule:active {
            transform: none !important;
            border-color: var(--panel-border-hover);
        }

        .capsule-date-cluster {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            transform: none !important;
        }

        .cal-trigger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.25s var(--ease-smooth);
        }

        .cal-trigger-btn:hover { opacity: 0.8; }

        .cal-trigger-btn svg {
            width: 36px;
            height: 36px;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
        }

        .date-text-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .date-label-tiny {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            transition: color 0.8s var(--ease-smooth);
        }

        .date-value-main {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            transition: color 0.8s var(--ease-smooth);
        }

        .capsule-divider {
            width: 1px;
            height: 36px;
            background-color: var(--row-divider);
            margin: 0 4px;
            flex-shrink: 0;
            transition: background-color 0.8s var(--ease-smooth);
        }

        .capsule-topics-cluster {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-grow: 1;
            min-width: 0;
        }

        /* RESTORED CLEAN TOPICS CAPSULE (PERFECTLY CENTERED GLIDER) */
        .topics-nav-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--pill-box-bg);
            border: 1px solid var(--pill-box-border);
            padding: 3px 5px 3px 12px;
            border-radius: 9999px;
            height: 32px;
            box-sizing: border-box;
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .topics-nav-pill .pill-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            user-select: none;
            white-space: nowrap;
            line-height: 1;
        }

        .topic-numbers-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 100%;
        }

        .pill-slider-glider {
            position: absolute;
            top: 1px;
            bottom: 1px;
            left: 0;
            width: 0;
            background: var(--btn-blue);
            border-radius: 9999px;
            transition: transform 0.38s cubic-bezier(0.25, 1, 0.35, 1), width 0.38s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.2s ease;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
        }

        .topic-num-btn {
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-muted);
            cursor: pointer;
            height: 24px;
            min-width: 24px;
            padding: 0 8px;
            border-radius: 9999px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            line-height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s var(--ease-smooth);
        }

        .topic-num-btn:hover { color: var(--text-main); }
        .topic-num-btn.is-active { color: #ffffff !important; font-weight: 600; }

        /* MOBILE TOPICS CLUSTER (PHONE VIEW) */
        .ca-topics-nav-cluster {
            display: none;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 100;
        }

        .ca-nav-arrow-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: opacity 0.22s var(--ease-smooth), transform 0.22s var(--ease-smooth);
        }
        .ca-nav-arrow-btn:active:not(.is-disabled) {
            transform: scale(0.84);
        }
        .ca-nav-arrow-btn.is-disabled {
            opacity: 0.22 !important;
            pointer-events: none !important;
        }
        .ca-nav-arrow-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ca-topic-number-pill {
            position: relative;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: var(--text-main);
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        .ca-topic-number-pill:active {
            transform: scale(0.92);
        }

        .ca-floating-jump-pill {
            position: absolute;

            right: 50%;

            font-weight: 600;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto;
            transition: color 0.2s, background-color 0.2s;
        }
        .ca-jump-item-btn:hover,
        .ca-jump-item-btn:active {
            color: var(--text-main);
            background: var(--pill-bg);
        }
        .ca-jump-item-btn.is-active {
            background: var(--btn-blue) !important;
            color: #ffffff !important;
        }

        @media (max-width: 680px) {
            .desktop-topics-pill { display: none !important; }
            .ca-topics-nav-cluster { display: flex !important; }
        }
        @media (min-width: 681px) {
            .desktop-topics-pill { display: inline-flex !important; }
            .ca-topics-nav-cluster { display: none !important; }
        }

        /* 2. CONTROLS PANEL (MATCHING APP) */
        .ca-controls-panel {
            width: 100%;
            max-width: 1000px;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin: 0 auto 24px auto !important;
            transition: background-color 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth);
        }

        .ca-controls-main-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
        }

        .ca-action-buttons-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .ca-action-label-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
            background: transparent !important;
            border: none !important;
            padding: 0;
        }

        .ca-direct-action-btn {
            background: var(--btn-blue);
            color: #ffffff !important;
            border: none;
            outline: none;
            padding: 5px 0;
            border-radius: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            min-width: 68px;
            width: 68px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            transition: transform 0.18s var(--ease-smooth), opacity 0.18s ease;
        }
        .ca-direct-action-btn:hover {
            opacity: 0.94;
        }
        .ca-direct-action-btn:active {
            transform: scale(0.93) !important;
            opacity: 0.9;
        }

        .ca-dropdown-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.3s var(--ease-smooth), color 0.3s var(--ease-smooth);
        }
        .ca-dropdown-toggle-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ca-dropdown-toggle-btn.is-rotated {
            transform: rotate(180deg);
            color: var(--text-main);
        }

        /* Drawers */
        .ca-image-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s var(--ease-smooth);
            width: 100%;
            overflow: hidden;
        }
        .ca-image-drawer.is-open {
            grid-template-rows: 1fr;
        }
        .ca-image-drawer-inner {
            min-height: 0;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            padding-top: 0;
            transition: opacity 0.3s var(--ease-smooth), padding-top 0.35s var(--ease-smooth);
        }
        .ca-image-drawer.is-open .ca-image-drawer-inner {
            opacity: 1;
            padding-top: 14px;
        }
        .ca-image-drawer-inner img {
            max-width: 100%;
            width: auto;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 16px;
            display: block;
        }
        .ca-image-caption {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
        }

        .ca-meta-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.45s var(--ease-smooth);
            width: 100%;
            overflow: hidden;
        }
        .ca-meta-drawer.is-open {
            grid-template-rows: 1fr;
        }
        .ca-meta-drawer-inner {
            min-height: 0;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            padding-top: 0;
            transition: opacity 0.3s var(--ease-smooth), padding-top 0.35s var(--ease-smooth);
        }
        .ca-meta-drawer.is-open .ca-meta-drawer-inner {
            opacity: 1;
            padding-top: 14px;
        }
        .ca-meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        /* 3. FULL-WIDTH ARTICLE CONTENT AREA (RESTS DIRECTLY ON BACKGROUND) */
        .ca-article-feed-stage {
            width: 100%;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        
        /* Smooth Slide-Up Transition for Topic Switching */
        @keyframes articleSlideOut {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
            100% {
                opacity: 0;
                transform: translate3d(0, -14px, 0);
            }
        }
        @-webkit-keyframes articleSlideOut {
            0% {
                opacity: 1;
                -webkit-transform: translate3d(0, 0, 0);
            }
            100% {
                opacity: 0;
                -webkit-transform: translate3d(0, -14px, 0);
            }
        }

        @keyframes articleSlideUpEntrance {
            0% {
                opacity: 0;
                transform: translate3d(0, 24px, 0);
            }
            100% {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        @-webkit-keyframes articleSlideUpEntrance {
            0% {
                opacity: 0;
                -webkit-transform: translate3d(0, 24px, 0);
            }
            100% {
                opacity: 1;
                -webkit-transform: translate3d(0, 0, 0);
            }
        }

        .article-slide-out {
            animation: articleSlideOut 0.14s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
            -webkit-animation: articleSlideOut 0.14s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
            pointer-events: none;
            will-change: opacity, transform;
        }

        .article-slide-up-run {
            animation: articleSlideUpEntrance 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            -webkit-animation: articleSlideUpEntrance 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
            will-change: opacity, transform;
        }


        .ca-article-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .article-title {
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-size: 24px !important;
            font-weight: 500 !important;
            letter-spacing: -0.35px !important;
            color: var(--text-main) !important;
            line-height: 1.34 !important;
            margin-bottom: 20px !important;
            text-align: left !important;
        }

        /* 
           The Anti-Jerk Mechanism: CSS Grid Row Animation
           Smoothly scales container height between content states dynamically.
        */
        .grid-animator {
            display: grid;
            grid-template-rows: 0fr; /* Adjusted by JS on initialization */
            transition: grid-template-rows 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
        }

        .grid-content {
            overflow: hidden;
            width: 100%;
        }

        /* Cross-fading View Panes */
        .view-pane {
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            width: 100%;
        }

        /* Active Text State */
        .view-pane.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Safe dynamic layout collapsing without layout snaps */
        .view-pane.hidden-layout {
            height: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }
        .ca-detailed-overflow {
            min-height: 0;
            overflow: hidden;
            opacity: 1 !important;
            transform: translate3d(0, 0, 0) !important;
            transition: none !important;
            will-change: auto;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .ca-detailed-content-drawer.is-open .ca-detailed-overflow {
            opacity: 1 !important;
            transform: translate3d(0, 0, 0) !important;
        }

        /* SECTIONS & TYPOGRAPHY */
        .note-section {
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--row-divider);
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            width: 100%;
        }
        .note-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-heading {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            margin-bottom: 4px;
            text-align: left;
        }

        .note-p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-main);
            opacity: 0.92;
            padding-left: 0;
            margin: 0;
            text-align: left;
            margin: 0;
        }

        /* Clean Left-Aligned Bullet Points (No green dots) */
        .note-items-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .note-item-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            text-align: left;
        }

        .point-subheading {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.8;
            margin-top: 10px;
            margin-bottom: 6px;
            text-align: left;
        }

        .point-sublist {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .point-bullet-item {
            position: relative;
            padding-left: 18px;
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.92;
            text-align: left;
            margin-bottom: 6px;
        }

        .point-bullet-item::before {
            content: "•";
            position: absolute;
            left: 3px;
            top: 0;
            font-size: 15px;
            color: var(--text-main);
        }

        /* Organisation callout: rests directly on background */
        .info-callout {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-top: 2px;
        }

        .info-callout-row {
            position: relative;
            padding-left: 0 !important;
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-main);
            text-align: left;
        }
        .info-callout-row::before {
            display: none !important;
        }
        .info-callout-row strong {
            font-weight: 600;
            color: var(--text-main);
        }

        
        /* LAPTOP FLOATING SIDE NAVIGATION ARROWS - FIXED ON EMPTY SPACE OF BOTH SIDES */
        .side-nav-btn {
            display: none;
            position: fixed !important;
            top: 50% !important;
            transform: translateY(-50%) translateZ(0) !important;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main) !important;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            z-index: 99999 !important;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
            transition: opacity 0.28s var(--ease-smooth), 
                        transform 0.22s var(--ease-smooth), 
                        background-color 0.4s var(--ease-smooth), 
                        border-color 0.4s var(--ease-smooth);
            user-select: none;
            -webkit-user-select: none;
        }

        body.light-mode .side-nav-btn { 
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12); 
        }

        .side-nav-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Fixed on empty space of both sides - never sits on content */
        @media (min-width: 901px) {
            .side-nav-btn { display: flex !important; }
            .side-nav-prev { left: max(20px, calc(50% - 500px - 70px)) !important; }
            .side-nav-next { right: max(20px, calc(50% - 500px - 70px)) !important; }
        }
        @media (max-width: 900px) {
            .side-nav-btn { display: none !important; }
        }

        /* Hover & active: subtle scale, absolutely NO green color changing */
        .side-nav-btn:hover:not(.is-disabled) {
            border-color: var(--panel-border-hover);
            transform: translateY(-50%) scale(1.08) translateZ(0) !important;
            color: var(--text-main) !important;
        }
        .side-nav-btn:active:not(.is-disabled) {
            transform: translateY(-50%) scale(0.94) translateZ(0) !important;
            color: var(--text-main) !important;
        }
        .side-nav-btn.is-disabled { 
            opacity: 0.15 !important; 
            pointer-events: none !important; 
            cursor: default !important; 
        }

/* METADATA PILLS */
        .meta-pills-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px !important;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--row-divider);
            width: 100%;
            transition: border-color 0.8s var(--ease-smooth);
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 400;
            background: var(--pill-bg, rgba(255, 255, 255, 0.04));
            border: 1px solid var(--pill-border, rgba(255, 255, 255, 0.08));
            color: var(--text-muted);
            transition: background-color 0.4s var(--ease-smooth), 
                        border-color 0.4s var(--ease-smooth), 
                        color 0.4s var(--ease-smooth);
        }

        body.light-mode .meta-pill { background: rgba(0, 0, 0, 0.03); }
        .meta-pill strong { color: var(--text-main); font-weight: 600; transition: color 0.8s var(--ease-smooth); }

        /* ACTION PILLS: IMAGE & READ */
        .image-toggle-pill,
        .read-toggle-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        body.light-mode .image-toggle-pill,
        body.light-mode .read-toggle-pill { background: rgba(0, 0, 0, 0.03); }

        .ca-direct-action-btn,
        .image-action-btn,
        .read-action-btn {
            background: var(--btn-blue) !important;
            color: #ffffff !important;
            border: none;
            outline: none;
            padding: 5px 0;
            border-radius: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none !important;
            user-select: none;
            -webkit-user-select: none;
            min-width: 68px;
            width: 68px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            transform-origin: center center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent !important;
            transition: transform 0.18s var(--ease-smooth), opacity 0.18s ease;
        }

        .ca-direct-action-btn:hover,
        .image-action-btn:hover,
        .read-action-btn:hover {
            opacity: 0.94;
        }

        .ca-direct-action-btn:active,
        .image-action-btn:active,
        .read-action-btn:active {
            transform: scale(0.93) !important;
            opacity: 0.9;
        }

        

        /* INLINE REFERENCE LINKS (APPLE BLUE) */
        a.inline-link {
            color: var(--link-color) !important;
            text-decoration: underline !important;
            text-decoration-color: var(--link-underline) !important;
            text-underline-offset: 3px !important;
            text-decoration-thickness: 1.2px !important;
            font-weight: 500 !important;
            cursor: pointer !important;
            transition: text-decoration-color 0.2s ease, opacity 0.2s ease !important;
        }

        a.inline-link:hover {
            text-decoration-color: var(--link-color) !important;
            opacity: 0.85 !important;
        }

        /* DRAWERS & ARTICLE VIEWS */
        .topic-image-drawer,
        .topic-short-drawer,
        .topic-full-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.48s cubic-bezier(0.16, 1, 0.3, 1), margin 0.48s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            margin: 0;
        }

        .topic-image-drawer.is-open {
            grid-template-rows: 1fr;
            margin: 0 0 32px 0;
        }

        .topic-short-drawer.is-open,
        .topic-full-drawer.is-open {
            grid-template-rows: 1fr;
        }

        .topic-image-inner,
        .topic-short-inner,
        .topic-full-inner {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translate3d(0, 18px, 0);
            transition: opacity 0.26s cubic-bezier(0.25, 1, 0.5, 1), transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .topic-image-inner { align-items: center; }

        .topic-image-drawer.is-open .topic-image-inner {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1) 0.05s, transform 0.42s cubic-bezier(0.16, 1, 0.3, 1) 0.05s;
        }

        /* Seamless Reveal while exiting data descends */
        .topic-short-drawer.is-open .topic-short-inner,
        .topic-full-drawer.is-open .topic-full-inner {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1) 0.16s, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.16s;
        }

        .topic-image-inner img {
            width: 100%;
            max-height: 520px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

        .topic-image-caption {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
        }

        .article-separation-divider {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0 28px 0;
            width: 100%;
        }

        .article-separation-divider::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--row-divider);
            z-index: 1;
        }

        .divider-label-pill {
            position: relative;
            z-index: 2;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* CONTENT SECTIONS */

        .section-heading {
            font-size: 18.5px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.2px;
            margin-bottom: 6px;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth);
        }

        .note-p {
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.9;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-left: 2px;
        }

        .note-list li {
            position: relative;
            padding-left: 24px;
            font-size: 17px;
            line-height: 1.75;
            color: var(--text-main);
            opacity: 0.9;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list li::before {
            content: "•";
            position: absolute;
            left: 6px;
            top: -1px;
            font-size: 18px;
            color: var(--accent-tag-text);
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list li strong { color: var(--text-main); font-weight: 500; transition: color 0.8s var(--ease-smooth); }

        .note-sub-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-left: 4px;
        }

        .note-sub-row {
            font-size: 17px;
            line-height: 1.65;
            color: var(--text-main);
            opacity: 0.95;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .sub-bullet {
            color: var(--accent-tag-text);
            font-size: 11px;
            flex-shrink: 0;
        }

        .info-callout {
            background-color: var(--pill-box-bg);
            border: 1px solid var(--pill-box-border);
            border-radius: 20px;
            padding: 22px 24px;
            margin: 6px 0;
            display: flex;

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {

            requestAnimationFrame(() => {
                document.querySelectorAll('footer .footer-links-row a, .breadcrumb-nav a, .logo').forEach(l => {
                    l.classList.remove('is-wave-loading');
                    const span = l.querySelector('.nav-text');
                    if (span) {
                        span.style.transform = '';

        // 1. DYNAMIC BREADCRUMBS STATE
        (function buildDynamicBreadcrumbs() {
            const HOME_PATH = "/study/index.html";
            const CURRENT_PATH = "/study/dailycurrentaffairs.html";
            const structuralTrail = [
                { name: "Home", path: HOME_PATH },

        // 2. DATE STATE MANAGEMENT
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        let selectedYear = 2026;
        let selectedMonth = 10;
        let selectedDay = 5;

        let tempDay = selectedDay;
        let tempMonth = selectedMonth;
        let tempYear = selectedYear;

        const dayCol = document.getElementById('dayColumn');

        // Infinite 31 -> 01 Loop: 5 sets of 1..31
        function initPickerColumns() {
            dayCol.innerHTML = '';
            const DAY_LOOPS = 5;
            for (let l = 0; l < DAY_LOOPS; l++) {
                for (let d = 1; d <= 31; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'drum-cell';
                    cell.textContent = String(d).padStart(2, '0');
                    cell.dataset.val = d;
                    /* Tap to select date in drum wheel */
                    cell.addEventListener("click", () => { dayCol.scrollTo({ top: (l * 31 + d - 1) * 48, behavior: "smooth" }); });
                    dayCol.appendChild(cell);
                }
            }

            monthCol.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = String(m).padStart(2, '0');
                cell.dataset.val = m;
                cell.addEventListener("click", () => { monthCol.scrollTo({ top: (m - 1) * 48, behavior: "smooth" }); });
                monthCol.appendChild(cell);
            }

            yearCol.innerHTML = '';
            const minYear = 2026;
            const maxYear = Math.max(minYear, new Date().getFullYear() + 1);
            for (let y = minYear; y <= maxYear; y++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = y;
                cell.dataset.val = y;
                cell.addEventListener("click", () => { yearCol.scrollTo({ top: (y - minYear) * 48, behavior: "smooth" }); });
                yearCol.appendChild(cell);
            }
        }

        function scrollColumnTo(col, val) {
            const cellHeight = 48;
            if (col === dayCol) {
                const middleTargetIndex = 2 * 31 + (parseInt(val) - 1);
                col.scrollTo({ top: middleTargetIndex * cellHeight, behavior: 'instant' });
                return;
            }
            const cells = Array.from(col.querySelectorAll('.drum-cell'));
            const target = cells.find(c => parseInt(c.dataset.val) === parseInt(val));
            if (target) {
                const index = cells.indexOf(target);
                col.scrollTo({ top: index * cellHeight, behavior: 'smooth' });
            }
        }

        function setupScrollHighlight(col, onSelected) {
            const cellHeight = 48;
            col.addEventListener('scroll', () => {
                if (col === dayCol) {
                    const loopHeight = 31 * cellHeight;
                    if (col.scrollTop < loopHeight * 0.8) {
                        col.scrollTop += loopHeight * 2;
                    } else if (col.scrollTop > loopHeight * 3.8) {
                        col.scrollTop -= loopHeight * 2;
                    }
                }

                const index = Math.round(col.scrollTop / cellHeight);
                const cells = col.querySelectorAll('.drum-cell');
                cells.forEach((cell, i) => {
                    const isSelected = (i === index);
                    cell.classList.toggle('is-selected', isSelected);
                    if (isSelected && onSelected) {
                        onSelected(parseInt(cell.dataset.val));
                    }
                });
            });
        }

        function transitionTopic(targetIndex) {
            if (targetIndex < 0 || targetIndex >= totalLoadedTopics || targetIndex === currentActiveTopicIndex) return;
            currentActiveTopicIndex = targetIndex;

            const stage = document.getElementById('caArticleFeedStage');
            if (stage) {
                if (window._caTopicSwitchTimer) clearTimeout(window._caTopicSwitchTimer);
                stage.classList.remove('article-slide-up-run');
                stage.classList.add('article-slide-out');

                window._caTopicSwitchTimer = setTimeout(() => {
                    renderActiveTopic(currentActiveTopicIndex, false);
                    stage.classList.remove('article-slide-out');
                    void stage.offsetWidth;
                    stage.classList.add('article-slide-up-run');
                }, 140);
            } else {
                renderActiveTopic(currentActiveTopicIndex, false);
            }
        }
        window.transitionTopic = transitionTopic;

        window.toggleActiveReadMode = function() {
            if (navigator.vibrate) {
                try { navigator.vibrate(8); } catch(e) {}
            }
            const readBtn = document.getElementById('caReadActionBtn');
            const paneShort = document.getElementById('ca-pane-short');

            if (caViewMode === 'detailed') {
                caViewMode = 'short';

                // 2. Mid-way through fade, shift layout parameters to eliminate structural jerks

                    if (readBtn) readBtn.textContent = 'Full';

                setTimeout(() => {
                    if (readBtn) readBtn.textContent = 'Short';

                    paneShort.classList.add('hidden-layout');
                    paneFull.classList.remove('hidden-layout');

        // Touch swipe handling on article stage
        let touchStartX = 0;
        let touchStartY = 0;
        let isHorizontalSwipe = false;
        let isTouchActive = false;

        const stageEl = document.getElementById('caArticleFeedStage');
        if (stageEl) {
            stageEl.addEventListener('touchstart', (e) => {
                if (e.target.closest('button, a, input, .info-callout')) return;
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isHorizontalSwipe = false;
                    isTouchActive = true;
                }
            }, { passive: true });

            stageEl.addEventListener('touchmove', (e) => {
                if (!isTouchActive) return;
                const diffX = e.touches[0].clientX - touchStartX;
                const diffY = e.touches[0].clientY - touchStartY;
                if (!isHorizontalSwipe && Math.abs(diffX) > 8 && Math.abs(diffX) > Math.abs(diffY)) {
                    isHorizontalSwipe = true;
                }
            }, { passive: true });

            stageEl.addEventListener('touchend', (e) => {
                if (!isTouchActive) return;
                isTouchActive = false;
                if (isHorizontalSwipe) {
                    const diffX = e.changedTouches[0].clientX - touchStartX;
                    const diffY = e.changedTouches[0].clientY - touchStartY;
                    if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX < 0 && currentActiveTopicIndex < totalLoadedTopics - 1) {
                            transitionTopic(currentActiveTopicIndex + 1);
                        } else if (diffX > 0 && currentActiveTopicIndex > 0) {
                            transitionTopic(currentActiveTopicIndex - 1);
                        }
                    }
                }
            }, { passive: true });
        }

        window.addEventListener('keydown', (e) => {

                transitionTopic(currentActiveTopicIndex + 1);
            } else if (e.key === 'ArrowLeft' && currentActiveTopicIndex > 0) {
                transitionTopic(currentActiveTopicIndex - 1);
            }
        });

        // 7. ARTICLE DATA RENDERERS (CLEAN LEFT-ALIGNED BULLETS WITHOUT GREEN DOTS)
        function renderCaListBlock(list) {
            if (!list || !list.length) return '';
            return list.map(rawText => {
                if (!rawText || typeof rawText !== 'string') return '';

                let labelPart = '';
                let restPart = rawText;

                if (rawText.includes('</strong>')) {
                    const parts = rawText.split('</strong>');
                    labelPart = parts[0].replace(/<[^>]+>/g, '').trim();
                    restPart = parts.slice(1).join('</strong>').trim();
                    if (restPart.startsWith(':')) {
                        labelPart += ' :';
                        restPart = restPart.substring(1).trim();
                    }
                } else if (rawText.includes(':')) {
                    const colonIdx = rawText.indexOf(':');
                    labelPart = rawText.substring(0, colonIdx + 1).trim();
                    restPart = rawText.substring(colonIdx + 1).trim();
                }

                const subItems = restPart ? restPart.split(';').map(s => s.trim().replace(/^,s*/, '')).filter(Boolean) : [];
                if (subItems.length === 0 && restPart) {
                    subItems.push(restPart);
                }

                if (labelPart) {
                    return (
                        '<div class="note-item-group">' +
                            '<div class="point-subheading">' + labelPart + '</div>' +
                            '<ul class="point-sublist">' +
                                subItems.map(s => '<li class="point-bullet-item">' + s + '</li>').join('') +
                            '</ul>' +
                        '</div>'
                    );
                } else {
                    return (
                        '<div class="note-item-group">' +
                            '<ul class="point-sublist">' +
                                subItems.map(s => '<li class="point-bullet-item">' + s + '</li>').join('') +
                            '</ul>' +
                        '</div>'
                    );
                }
            }).join('');
        }

        function renderCards(topics, dateText) {
            activeDateDisplay.textContent = dateText;

            if (!topics || topics.length === 0) {

        function loadDateData(year, month, day, onSuccess, onFail) {
            const dateKey = String(day).padStart(2, '0') + '-' + String(month).padStart(2, '0') + '-' + year;
            const existingScript = document.getElementById('currentAffairsDataScript');
            if (existingScript) existingScript.remove();

            window.currentDailyTopics = null;

            const script = document.createElement('script');
            script.id = 'currentAffairsDataScript';
            script.src = '/study/currentaffairs-data/' + dateKey + '.js?t=' + Date.now();

            script.onload = () => {
                if (window.currentDailyTopics) {
                    onSuccess(window.currentDailyTopics, dateKey);
                } else {
                    onFail();
                }
            };

            script.onerror = () => {
                onFail();
            };

            document.body.appendChild(script);
        }

        if (window.currentDailyTopics) {
            renderCards(window.currentDailyTopics, "05 October 2026");
        } else {
            loadDateData(2026, 10, 5, (topics) => {
                renderCards(topics, "05 October 2026");
            }, () => {
                renderCards([], "05 October 2026");
            });
        }

        // 8. MODAL CONTROLS & APPLY ACTION
        const pickerModal = document.getElementById('pickerModal');
        const openCalendarBtn = document.getElementById('openCalendarBtn');
        const applyDateBtn = document.getElementById('applyDateBtn');

        openCalendarBtn.addEventListener('click', () => {
            initPickerColumns();
            if (typeof syncPopupOrigin === 'function') syncPopupOrigin();
            document.body.classList.add('popup-active');
            pickerModal.classList.add('is-open');
            setTimeout(() => {
                scrollColumnTo(dayCol, selectedDay);
                scrollColumnTo(monthCol, selectedMonth);
                scrollColumnTo(yearCol, selectedYear);
            }, 50);
        });

        applyDateBtn.addEventListener('click', () => {
            selectedDay = tempDay;
            selectedMonth = tempMonth;
            selectedYear = tempYear;
            const formattedDateText = `${String(selectedDay).padStart(2, '0')} ${monthNames[selectedMonth - 1]} ${selectedYear}`;

            loadDateData(selectedYear, selectedMonth, selectedDay, (topics) => {
                renderCards(topics, formattedDateText);
                const dateCapsule = document.querySelector('.date-topics-capsule');
                const controls = document.getElementById('caControlsPanel');
                const stage = document.getElementById('caArticleFeedStage');
                if (typeof triggerMasterEntrance === 'function') {
                    if (dateCapsule) triggerMasterEntrance(dateCapsule);
                    if (controls) triggerMasterEntrance(controls);
                    if (stage) triggerMasterEntrance(stage);
                }
            }, () => {
                renderCards([], formattedDateText);
                const dateCapsule = document.querySelector('.date-topics-capsule');
                const stage = document.getElementById('caArticleFeedStage');
                if (typeof triggerMasterEntrance === 'function') {
                    if (dateCapsule) triggerMasterEntrance(dateCapsule);
                    if (stage) triggerMasterEntrance(stage);
                }
            });

            document.body.classList.remove('popup-active');
            pickerModal.classList.remove('is-open');
            window.scrollTo({ top: 0, behavior: 'instant' });
        });

        pickerModal.addEventListener('pointerdown', (e) => {
            if (e.target === pickerModal) {
                document.body.classList.remove('popup-active');
                pickerModal.classList.remove('is-open');
            }
        });

        // 9. THEME PALETTE SYNCHRONIZATION
        function applyTargetPalette() {
            try {
                const activeOverride = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
                if (activeOverride) {
                    if (activeOverride === 'light') {
                        document.body.classList.add('light-mode');
                        document.documentElement.classList.add('light-mode');
                    } else {
                        document.body.classList.remove('light-mode');
                        document.documentElement.classList.remove('light-mode');
                    }
                } else {
                    const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                    if (prefersLight) {
                        document.body.classList.add('light-mode');
                        document.documentElement.classList.add('light-mode');
                    } else {
                        document.body.classList.remove('light-mode');
                        document.documentElement.classList.remove('light-mode');
                    }
                }
            } catch(e) {}
        }
        applyTargetPalette();

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
                const hasManualTheme = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
                if (!hasManualTheme) {
                    if (e.matches) {
                        document.body.classList.add('light-mode');
                        document.documentElement.classList.add('light-mode');
                    } else {
                        document.body.classList.remove('light-mode');
                        document.documentElement.classList.remove('light-mode');
                    }
                }
            });
        }

        clearSearchBtn.addEventListener('click', () => {
            searchCoreInput.value = "";
            searchCoreInput.focus();
        });

        closeSearchBtn.addEventListener('click', () => handleHeaderLeaveOrBlur(true));

        const targetLinks = document.querySelectorAll('footer .footer-links-row a, .breadcrumb-nav a, .logo');
        targetLinks.forEach(link => {
            if (!link.querySelector('.nav-text')) {
                const wrapper = document.createElement('span');
                wrapper.className = 'nav-text';
                while (link.firstChild) {
                    wrapper.appendChild(link.firstChild);
                }
                link.appendChild(wrapper);
            }
            link.addEventListener('click', function(e) {
                const dest = this.getAttribute('href');
                if (!dest || dest === '#' || dest.startsWith('#')) return;
                e.preventDefault();
                targetLinks.forEach(l => l.classList.remove('is-wave-loading'));
                this.classList.add('is-wave-loading');
                setTimeout(() => { window.location.href = dest; }, 220);
            });
        });
    </script>
    <script src="/script.js"></script>
</body>
</html>
