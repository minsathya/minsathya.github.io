    <footer>
        <div class="footer-links-row">
            <a href="/study/Footer/about.html">About</a>
            <a href="/study/Footer/contact.html">Contact</a>
            <a href="/study/Footer/privacy.html">Privacy Policy</a>
            <a href="/study/Footer/terms.html">Terms &amp; Conditions</a>
            <a href="/study/Footer/disclaimer.html">Disclaimer</a>
        </div>
        <div class="copyright-tag">
            &copy; 2026 Sathya. All rights reserved.
        </div>
    </footer>

    <script>
        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }
            requestAnimationFrame(() => {
                document.querySelectorAll('footer .footer-links-row a, .breadcrumb-nav a, .logo').forEach(l => {
                    l.classList.remove('is-wave-loading');
                    const span = l.querySelector('.nav-text');
                    if (span) {
                        span.style.transform = '';
                        span.style.opacity = '';
                        span.style.background = '';
                        span.style.webkitBackgroundClip = '';
                        span.style.webkitTextFillColor = '';
                    }
                });
            });
        });

        // 1. DYNAMIC BREADCRUMBS STATE
        (function buildDynamicBreadcrumbs() {
            const HOME_PATH = "/study/index.html";
            const CURRENT_PATH = "/study/dailycurrentaffairs.html";
            const structuralTrail = [
                { name: "Home", path: HOME_PATH },
                { name: "Daily Current Affairs", path: CURRENT_PATH }
            ];
            try {
                sessionStorage.setItem('breadcrumbTrail', JSON.stringify(structuralTrail));
            } catch (e) {}
        })();

        // 2. DATE STATE MANAGEMENT
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        let selectedYear = 2026;
        let selectedMonth = 10;
        let selectedDay = 5;

        let tempDay = selectedDay;
        let tempMonth = selectedMonth;
        let tempYear = selectedYear;

        const dayCol = document.getElementById('dayColumn');
        const monthCol = document.getElementById('monthColumn');
        const yearCol = document.getElementById('yearColumn');
        const topicsFeed = document.getElementById('topicsFeed');
        const activeDateDisplay = document.getElementById('activeDateDisplay');

        // Infinite 31 -> 01 Loop: 5 sets of 1..31
        function initPickerColumns() {
            dayCol.innerHTML = '';
            const DAY_LOOPS = 5;
            for (let l = 0; l < DAY_LOOPS; l++) {
                for (let d = 1; d <= 31; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'drum-cell';
                    cell.textContent = String(d).padStart(2, '0');
                    cell.dataset.val = d;
                    dayCol.appendChild(cell);
                }
            }

            monthCol.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = String(m).padStart(2, '0');
                cell.dataset.val = m;
                monthCol.appendChild(cell);
            }

            yearCol.innerHTML = '';
            const minYear = 2026;
            const maxYear = Math.max(minYear, new Date().getFullYear() + 1);
            for (let y = minYear; y <= maxYear; y++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = y;
                cell.dataset.val = y;
                yearCol.appendChild(cell);
            }
        }

        function scrollColumnTo(col, val) {
            const cellHeight = 48;
            if (col === dayCol) {
                const middleTargetIndex = 2 * 31 + (parseInt(val) - 1);
                col.scrollTo({ top: middleTargetIndex * cellHeight, behavior: 'instant' });
                return;
            }
            const cells = Array.from(col.querySelectorAll('.drum-cell'));
            const target = cells.find(c => parseInt(c.dataset.val) === parseInt(val));
            if (target) {
                const index = cells.indexOf(target);
                col.scrollTo({ top: index * cellHeight, behavior: 'smooth' });
            }
        }

        function setupScrollHighlight(col, onSelected) {
            const cellHeight = 48;
            col.addEventListener('scroll', () => {
                if (col === dayCol) {
                    const loopHeight = 31 * cellHeight;
                    if (col.scrollTop < loopHeight * 0.8) {
                        col.scrollTop += loopHeight * 2;
                    } else if (col.scrollTop > loopHeight * 3.8) {
                        col.scrollTop -= loopHeight * 2;
                    }
                }

                const index = Math.round(col.scrollTop / cellHeight);
                const cells = col.querySelectorAll('.drum-cell');
                cells.forEach((cell, i) => {
                    const isSelected = (i === index);
                    cell.classList.toggle('is-selected', isSelected);
                    if (isSelected && onSelected) {
                        onSelected(parseInt(cell.dataset.val));
                    }
                });
            });
        }

        initPickerColumns();
        setupScrollHighlight(dayCol, v => tempDay = v);
        setupScrollHighlight(monthCol, v => tempMonth = v);
        setupScrollHighlight(yearCol, v => tempYear = v);

        // 3. IMAGE & SHORT REVISION INTERACTION ENGINES
        window.toggleTopicImage = function(btn, drawerId) {
            const drawer = document.getElementById(drawerId);
            if (!drawer) return;
            const isOpen = drawer.classList.contains('is-open');
            if (isOpen) {
                drawer.classList.remove('is-open');
                btn.textContent = 'View';
            } else {
                drawer.classList.add('is-open');
                btn.textContent = 'Close';
            }
            setTimeout(() => syncFeedHeight(), 80);
            setTimeout(() => syncFeedHeight(), 350);
            setTimeout(() => syncFeedHeight(), 580);
        };

        window.toggleShortArticle = function(btn, drawerId) {
            const drawer = document.getElementById(drawerId);
            if (!drawer) return;
            const isOpen = drawer.classList.contains('is-open');
            if (isOpen) {
                drawer.classList.remove('is-open');
                btn.textContent = 'Short';
            } else {
                drawer.classList.add('is-open');
                btn.textContent = 'Full';
            }
            setTimeout(() => syncFeedHeight(), 80);
            setTimeout(() => syncFeedHeight(), 350);
            setTimeout(() => syncFeedHeight(), 580);
        };

        // 4. DUAL-CARD STAGE ENGINE
        let currentActiveTopicIndex = 0;
        let totalLoadedTopics = 0;
        let isTransitioning = false;

        function updateNavArrows() {
            const prevBtn = document.getElementById('sidePrevBtn');
            const nextBtn = document.getElementById('sideNextBtn');
            if (!prevBtn || !nextBtn) return;

            if (currentActiveTopicIndex <= 0) {
                prevBtn.classList.add('is-disabled');
            } else {
                prevBtn.classList.remove('is-disabled');
            }

            if (currentActiveTopicIndex >= totalLoadedTopics - 1) {
                nextBtn.classList.add('is-disabled');
            } else {
                nextBtn.classList.remove('is-disabled');
            }
        }

        function updatePillGlider(activeBtn) {
            const glider = document.getElementById('pillGlider');
            if (!glider || !activeBtn) return;
            glider.style.width = `${activeBtn.offsetWidth}px`;
            glider.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
            glider.style.opacity = '1';
        }

        function renderTopicsPill(totalTopics) {
            const container = document.getElementById('topicsPillContainer');
            if (!container) return;

            if (totalTopics > 0) {
                let buttonsHtml = '';
                for (let i = 1; i <= totalTopics; i++) {
                    const activeClass = i === 1 ? ' is-active' : '';
                    buttonsHtml += `<button type="button" class="topic-num-btn${activeClass}" data-topic-btn="${i - 1}" onclick="transitionTopic(${i - 1})">${i}</button>`;
                }
                container.innerHTML = `
                    <div class="topics-nav-pill">
                        <span class="pill-label">Topics :</span>
                        <div class="topic-numbers-wrapper">
                            <span class="pill-slider-glider" id="pillGlider"></span>
                            ${buttonsHtml}
                        </div>
                    </div>
                `;
                const syncGlider = () => {
                    const firstBtn = container.querySelector('.topic-num-btn.is-active');
                    if (firstBtn) updatePillGlider(firstBtn);
                };
                requestAnimationFrame(syncGlider);
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(syncGlider);
                }
            } else {
                container.innerHTML = '';
            }
        }

        function syncFeedHeight(idx = currentActiveTopicIndex) {
            const card = document.getElementById(`topic-card-${idx}`);
            if (topicsFeed && card) {
                const targetH = card.offsetHeight;
                if (targetH > 0) {
                    topicsFeed.style.height = `${targetH}px`;
                }
            }
        }

        function transitionTopic(targetIndex, direction = null) {
            if (isTransitioning || targetIndex < 0 || targetIndex >= totalLoadedTopics || targetIndex === currentActiveTopicIndex) return;

            const isNext = direction ? (direction === 'next') : (targetIndex > currentActiveTopicIndex);
            const currentIndex = currentActiveTopicIndex;
            currentActiveTopicIndex = targetIndex;
            isTransitioning = true;

            const cards = topicsFeed.querySelectorAll('.article-card');
            const currentCard = cards[currentIndex];
            const targetCard = cards[targetIndex];

            const buttons = document.querySelectorAll('.topic-num-btn');
            buttons.forEach((btn, i) => {
                const isSelected = (i === targetIndex);
                btn.classList.toggle('is-active', isSelected);
                if (isSelected) updatePillGlider(btn);
            });

            updateNavArrows();

            targetCard.style.display = 'block';
            targetCard.style.visibility = 'hidden';
            const incomingHeight = targetCard.offsetHeight;
            targetCard.style.display = '';
            targetCard.style.visibility = '';

            topicsFeed.style.height = `${currentCard.offsetHeight}px`;
            void topicsFeed.offsetHeight;
            if (incomingHeight > 0) {
                topicsFeed.style.height = `${incomingHeight}px`;
            }

            window.scrollTo({ top: 0, behavior: 'instant' });

            if (isNext) {
                currentCard.className = 'article-card anim-out-left';
                targetCard.className = 'article-card anim-in-right';
            } else {
                currentCard.className = 'article-card anim-out-right';
                targetCard.className = 'article-card anim-in-left';
            }

            setTimeout(() => {
                cards.forEach((card, idx) => {
                    card.className = idx === targetIndex ? 'article-card is-active' : 'article-card';
                });
                topicsFeed.style.height = 'auto';
                isTransitioning = false;
                packAllMetaPills();
            }, 400);
        }

        // 5. SIDE ARROWS CLICK LISTENERS
        document.getElementById('sidePrevBtn').addEventListener('click', () => {
            if (currentActiveTopicIndex > 0) {
                transitionTopic(currentActiveTopicIndex - 1, 'prev');
            }
        });

        document.getElementById('sideNextBtn').addEventListener('click', () => {
            if (currentActiveTopicIndex < totalLoadedTopics - 1) {
                transitionTopic(currentActiveTopicIndex + 1, 'next');
            }
        });

        // 6. TOUCH CONTROLLER
        let touchStartX = 0;
        let touchStartY = 0;
        let isHorizontalSwipe = false;
        let isTouchActive = false;

        topicsFeed.addEventListener('touchstart', (e) => {
            if (isTransitioning) return;
            if (e.target.closest('button, a, input, .info-callout')) return;
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isHorizontalSwipe = false;
                isTouchActive = true;
            }
        }, { passive: true });

        topicsFeed.addEventListener('touchmove', (e) => {
            if (!isTouchActive || isTransitioning) return;
            const diffX = e.touches[0].clientX - touchStartX;
            const diffY = e.touches[0].clientY - touchStartY;

            if (!isHorizontalSwipe && Math.abs(diffX) > 8 && Math.abs(diffX) > Math.abs(diffY)) {
                isHorizontalSwipe = true;
            }
        }, { passive: true });

        topicsFeed.addEventListener('touchend', (e) => {
            if (!isTouchActive || isTransitioning) return;
            isTouchActive = false;

            if (isHorizontalSwipe) {
                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX < 0) {
                        if (currentActiveTopicIndex < totalLoadedTopics - 1) {
                            transitionTopic(currentActiveTopicIndex + 1, 'next');
                        }
                    } else {
                        if (currentActiveTopicIndex > 0) {
                            transitionTopic(currentActiveTopicIndex - 1, 'prev');
                        }
                    }
                }
            }
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight' && currentActiveTopicIndex < totalLoadedTopics - 1) {
                transitionTopic(currentActiveTopicIndex + 1, 'next');
            } else if (e.key === 'ArrowLeft' && currentActiveTopicIndex > 0) {
                transitionTopic(currentActiveTopicIndex - 1, 'prev');
            }
        });

        // 7. DYNAMIC DATA RENDERER
        function formatSubListItems(rawText) {
            if (!rawText || typeof rawText !== 'string' || !rawText.includes(';')) {
                return rawText;
            }

            let labelPart = '';
            let restPart = rawText;

            if (rawText.includes('</strong>')) {
                const parts = rawText.split('</strong>');
                labelPart = parts[0] + '</strong>';
                restPart = parts.slice(1).join('</strong>').trim();
                if (restPart.startsWith(':')) {
                    labelPart += ' :';
                    restPart = restPart.substring(1).trim();
                }
            } else if (rawText.includes(':') && rawText.indexOf(':') < rawText.indexOf(';')) {
                const colonIdx = rawText.indexOf(':');
                labelPart = rawText.substring(0, colonIdx + 1);
                restPart = rawText.substring(colonIdx + 1).trim();
            }

            const subItems = restPart.split(';').map(s => s.trim().replace(/^,\s*/, '')).filter(Boolean);
            if (subItems.length > 1) {
                const subRows = subItems.map(s => `
                    <div class="note-sub-row"><span class="sub-bullet">▸</span><span>${s}</span></div>
                `).join('');
                return `${labelPart ? labelPart : ''}<div class="note-sub-list">${subRows}</div>`;
            }
            return rawText;
        }

        function renderArticleSections(data) {
            const buildListItems = (list) => {
                if (!list || list.length === 0) return '';
                return list.map(item => `<li>${formatSubListItems(item)}</li>`).join('');
            };

            let orgRowsHtml = '';
            if (data.whoOrg && data.whoOrg.length > 0) {
                orgRowsHtml = data.whoOrg.map(row => `
                    <div class="info-callout-row"><strong>${row.label} :</strong> ${row.val}</div>
                `).join('');
            }

            return `
                ${data.whyInNews ? `
                <section class="note-section">
                    <h3 class="section-heading">Why in News?</h3>
                    <p class="note-p">${data.whyInNews}</p>
                </section>` : ''}

                ${data.whatConcept ? `
                <section class="note-section">
                    <h3 class="section-heading">What / Concept</h3>
                    <p class="note-p">${data.whatConcept}</p>
                </section>` : ''}

                ${orgRowsHtml ? `
                <section class="note-section">
                    <h3 class="section-heading">Who / Organisation</h3>
                    <div class="info-callout">${orgRowsHtml}</div>
                </section>` : ''}

                ${data.importantFacts && data.importantFacts.length > 0 ? `
                <section class="note-section">
                    <h3 class="section-heading">Important Facts ⭐</h3>
                    <ul class="note-list">${buildListItems(data.importantFacts)}</ul>
                </section>` : ''}

                ${data.background && data.background.length > 0 ? `
                <section class="note-section">
                    <h3 class="section-heading">Background / Static Linkage</h3>
                    <ul class="note-list">${buildListItems(data.background)}</ul>
                </section>` : ''}

                ${data.significance && data.significance.length > 0 ? `
                <section class="note-section">
                    <h3 class="section-heading">Significance</h3>
                    <ul class="note-list">${buildListItems(data.significance)}</ul>
                </section>` : ''}

                ${data.challenges && data.challenges.length > 0 ? `
                <section class="note-section">
                    <h3 class="section-heading">Challenges / Concerns</h3>
                    <ul class="note-list">${buildListItems(data.challenges)}</ul>
                </section>` : ''}

                ${data.wayForward && data.wayForward.length > 0 ? `
                <section class="note-section">
                    <h3 class="section-heading">Way Forward</h3>
                    <ul class="note-list">${buildListItems(data.wayForward)}</ul>
                </section>` : ''}
            `;
        }

        // SMART GAP-FILLING PILL PACKER
        function packMetaPills(row) {
            if (!row) return;
            const pills = Array.from(row.querySelectorAll('.meta-pill, .image-toggle-pill, .read-toggle-pill'));
            if (pills.length <= 1) return;

            pills.forEach(p => p.style.order = '');
            const availableWidth = row.clientWidth;
            if (availableWidth <= 0) return;

            const gap = 10;
            const items = pills.map((p) => ({
                el: p,
                width: p.getBoundingClientRect().width,
                placed: false
            }));

            const finalOrder = [];
            let unplacedCount = items.length;

            while (unplacedCount > 0) {
                let currentLineWidth = 0;
                let addedAny = false;

                for (let i = 0; i < items.length; i++) {
                    if (!items[i].placed) {
                        items[i].placed = true;
                        finalOrder.push(items[i]);
                        currentLineWidth = items[i].width;
                        unplacedCount--;
                        addedAny = true;
                        break;
                    }
                }
                if (!addedAny) break;

                let canFit = true;
                while (canFit && unplacedCount > 0) {
                    let bestCandidate = null;
                    for (let i = 0; i < items.length; i++) {
                        const candidate = items[i];
                        if (!candidate.placed && (currentLineWidth + gap + candidate.width <= availableWidth)) {
                            bestCandidate = candidate;
                            break;
                        }
                    }

                    if (bestCandidate) {
                        bestCandidate.placed = true;
                        finalOrder.push(bestCandidate);
                        currentLineWidth += gap + bestCandidate.width;
                        unplacedCount--;
                    } else {
                        canFit = false;
                    }
                }
            }

            finalOrder.forEach((item, visualIndex) => {
                item.el.style.order = visualIndex;
            });
        }

        function packAllMetaPills() {
            document.querySelectorAll('.meta-pills-row').forEach(packMetaPills);
        }

        window.addEventListener('resize', () => {
            packAllMetaPills();
            const activeBtn = document.querySelector('.topic-num-btn.is-active');
            if (activeBtn) updatePillGlider(activeBtn);
        });

        function renderCards(topics, dateText) {
            activeDateDisplay.textContent = dateText;
            topicsFeed.innerHTML = '';

            if (!topics || topics.length === 0) {
                totalLoadedTopics = 0;
                currentActiveTopicIndex = 0;
                topicsFeed.style.height = 'auto';
                renderTopicsPill(0);
                updateNavArrows();
                topicsFeed.innerHTML = `
                    <div class="empty-placeholder-card">
                        No current affairs entries found for ${dateText}.
                    </div>
                `;
                return;
            }

            const displayTopics = Array.isArray(topics) ? [...topics].reverse() : [];
            totalLoadedTopics = displayTopics.length;
            currentActiveTopicIndex = 0;

            renderTopicsPill(totalLoadedTopics);
            updateNavArrows();

            displayTopics.forEach((topic, idx) => {
                const card = document.createElement('article');
                card.className = `article-card${idx === 0 ? ' is-active' : ''}`;
                card.id = `topic-card-${idx}`;
                card.dataset.index = idx;

                const hasImage = topic.image && topic.image.url;
                const imgDrawerId = `imgDrawer_${idx}`;
                const shortDrawerId = `shortDrawer_${idx}`;
                const hasShort = !!topic.shortArticle;

                const imagePillHtml = hasImage ? `
                    <span class="image-toggle-pill">
                        Image : <button type="button" class="image-action-btn" onclick="toggleTopicImage(this, '${imgDrawerId}')">View</button>
                    </span>
                ` : '';

                const readPillHtml = hasShort ? `
                    <span class="read-toggle-pill">
                        Read : <button type="button" class="read-action-btn" onclick="toggleShortArticle(this, '${shortDrawerId}')">Short</button>
                    </span>
                ` : '';

                const imageDrawerHtml = hasImage ? `
                    <div class="topic-image-drawer" id="${imgDrawerId}">
                        <div class="topic-image-inner">
                            <img src="${topic.image.url}" alt="${topic.image.caption || 'Topic Image'}" loading="lazy" referrerpolicy="no-referrer">
                            ${topic.image.caption ? `<div class="topic-image-caption">${topic.image.caption}</div>` : ''}
                        </div>
                    </div>
                ` : '';

                const shortDrawerHtml = hasShort ? `
                    <div class="topic-short-drawer" id="${shortDrawerId}">
                        <div class="topic-short-inner">
                            ${renderArticleSections(topic.shortArticle)}
                            <div class="article-separation-divider">
                                <span class="divider-label-pill">Detailed Analysis Below</span>
                            </div>
                        </div>
                    </div>
                ` : '';

                /* GS Paper pill now matches all other pills identically */
                card.innerHTML = `
                    <h2 class="article-title">${topic.topicTitle}</h2>

                    <div class="meta-pills-row">
                        <span class="meta-pill">GS Paper : <strong>${topic.gsPaper}</strong></span>
                        <span class="meta-pill">Category : <strong>${topic.category}</strong></span>
                        <span class="meta-pill">Comes under : <strong>${topic.comesUnder}</strong></span>
                        ${imagePillHtml}
                        ${readPillHtml}
                    </div>

                    ${imageDrawerHtml}
                    ${shortDrawerHtml}
                    ${renderArticleSections(topic)}
                `;

                topicsFeed.appendChild(card);
            });

            topicsFeed.style.height = 'auto';
            requestAnimationFrame(() => {
                packAllMetaPills();
            });
        }

        function loadDateData(year, month, day, onSuccess, onFail) {
            const dateKey = `${String(day).padStart(2, '0')}-${String(month).padStart(2, '0')}-${year}`;
            const existingScript = document.getElementById('currentAffairsDataScript');
            if (existingScript) existingScript.remove();

            window.currentDailyTopics = null;

            const script = document.createElement('script');
            script.id = 'currentAffairsDataScript';
            script.src = `/study/currentaffairs-data/${dateKey}.js?t=${Date.now()}`;

            script.onload = () => {
                if (window.currentDailyTopics) {
                    onSuccess(window.currentDailyTopics, dateKey);
                } else {
                    onFail();
                }
            };

            script.onerror = () => {
                onFail();
            };

            document.body.appendChild(script);
        }

        if (window.currentDailyTopics) {
            renderCards(window.currentDailyTopics, "05 October 2026");
        } else {
            loadDateData(2026, 10, 5, (topics) => {
                renderCards(topics, "05 October 2026");
            }, () => {
                renderCards([], "05 October 2026");
            });
        }

        // 8. MODAL CONTROLS & APPLY ACTION
        const pickerModal = document.getElementById('pickerModal');
        const openCalendarBtn = document.getElementById('openCalendarBtn');
        const applyDateBtn = document.getElementById('applyDateBtn');

        openCalendarBtn.addEventListener('click', () => {
            initPickerColumns();
            pickerModal.classList.add('is-open');
            setTimeout(() => {
                scrollColumnTo(dayCol, selectedDay);
                scrollColumnTo(monthCol, selectedMonth);
                scrollColumnTo(yearCol, selectedYear);
            }, 50);
        });

        applyDateBtn.addEventListener('click', () => {
            selectedDay = tempDay;
            selectedMonth = tempMonth;
            selectedYear = tempYear;
            const formattedDateText = `${String(selectedDay).padStart(2, '0')} ${monthNames[selectedMonth - 1]} ${selectedYear}`;

            loadDateData(selectedYear, selectedMonth, selectedDay, (topics) => {
                renderCards(topics, formattedDateText);
            }, () => {
                renderCards([], formattedDateText);
            });

            pickerModal.classList.remove('is-open');
            window.scrollTo({ top: 0, behavior: 'instant' });
        });

        pickerModal.addEventListener('pointerdown', (e) => {
            if (e.target === pickerModal) {
                pickerModal.classList.remove('is-open');
            }
        });

        // 9. THEME PALETTE ENGINE
        const toggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');
        const masterHeader = document.getElementById('masterHeader');
        const openSearchBtn = document.getElementById('openSearchBtn');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const searchCoreInput = document.getElementById('searchCoreInput');

        function handleHeaderLeaveOrBlur(isExplicitClose = false) {
            const isSearchActive = masterHeader.classList.contains('state-search');
            if (isSearchActive) {
                const isEmpty = searchCoreInput.value.trim() === "";
                if (isEmpty || isExplicitClose) {
                    masterHeader.classList.remove('state-search');
                    masterHeader.classList.add('state-main');
                    searchCoreInput.value = "";
                }
            }
            searchCoreInput.blur();
            masterHeader.classList.remove('is-header-lifted');
        }

        masterHeader.addEventListener('pointerdown', (e) => {
            masterHeader.classList.add('is-header-lifted');
            if (masterHeader.classList.contains('state-search')) {
                if (document.activeElement !== searchCoreInput && e.target !== closeSearchBtn && e.target !== clearSearchBtn) {
                    searchCoreInput.focus({ preventScroll: true });
                }
            }
        });

        masterHeader.addEventListener('pointerleave', () => {
            if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                handleHeaderLeaveOrBlur(false);
            } else {
                searchCoreInput.blur();
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        masterHeader.addEventListener('pointerup', () => {
            if (document.activeElement !== searchCoreInput && !masterHeader.matches(':hover')) {
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        document.addEventListener('pointerdown', (e) => {
            if (!masterHeader.contains(e.target)) {
                if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                    handleHeaderLeaveOrBlur(false);
                } else {
                    searchCoreInput.blur();
                    masterHeader.classList.remove('is-header-lifted');
                }
            }
        });

        function applyTargetPalette() {
            const activeSessionOverride = sessionStorage.getItem('dashboard-theme');
            if (activeSessionOverride) {
                if (activeSessionOverride === 'light') {
                    bodyElement.classList.add('light-mode');
                    document.documentElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                    document.documentElement.classList.remove('light-mode');
                }
            } else {
                if (systemLightQuery.matches) {
                    bodyElement.classList.add('light-mode');
                    document.documentElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                    document.documentElement.classList.remove('light-mode');
                }
            }
        }
        applyTargetPalette();

        systemLightQuery.addEventListener('change', (e) => {
            sessionStorage.removeItem('dashboard-theme');
            if (e.matches) {
                bodyElement.classList.add('light-mode');
                document.documentElement.classList.add('light-mode');
            } else {
                bodyElement.classList.remove('light-mode');
                document.documentElement.classList.remove('light-mode');
            }
        });

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isCurrentlyLight = bodyElement.classList.contains('light-mode');
            if (isCurrentlyLight) {
                bodyElement.classList.remove('light-mode');
                document.documentElement.classList.remove('light-mode');
                sessionStorage.setItem('dashboard-theme', 'dark');
            } else {
                bodyElement.classList.add('light-mode');
                document.documentElement.classList.add('light-mode');
                sessionStorage.setItem('dashboard-theme', 'light');
            }
        });

        openSearchBtn.addEventListener('click', () => {
            masterHeader.classList.remove('state-main');
            masterHeader.classList.add('state-search');
            masterHeader.classList.add('is-header-lifted');
            searchCoreInput.focus({ preventScroll: true });
        });

        clearSearchBtn.addEventListener('click', () => {
            searchCoreInput.value = "";
            searchCoreInput.focus();
        });

        closeSearchBtn.addEventListener('click', () => handleHeaderLeaveOrBlur(true));

        const targetLinks = document.querySelectorAll('footer .footer-links-row a, .breadcrumb-nav a, .logo');
        targetLinks.forEach(link => {
            if (!link.querySelector('.nav-text')) {
                const wrapper = document.createElement('span');
                wrapper.className = 'nav-text';
                while (link.firstChild) {
                    wrapper.appendChild(link.firstChild);
                }
                link.appendChild(wrapper);
            }
            link.addEventListener('click', function(e) {
                const dest = this.getAttribute('href');
                if (!dest || dest === '#' || dest.startsWith('#')) return;
                e.preventDefault();
                targetLinks.forEach(l => l.classList.remove('is-wave-loading'));
                this.classList.add('is-wave-loading');
                setTimeout(() => { window.location.href = dest; }, 220);
            });
        });
    </script>
    <script src="/script.js"></script>
</body>
</html>
