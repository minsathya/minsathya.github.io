    <!-- Instant Theme Evaluation to Prevent Theme Flash on Reload -->
    <script>
      (function() {
        const activeTheme = sessionStorage.getItem('dashboard-theme');
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if (activeTheme === 'light' || (!activeTheme && prefersLight)) {
          document.documentElement.classList.add('light-mode');
        }
      })();
    </script>

    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=3">

    <link id="favicon" rel="icon" type="image/png" href="/favicon-light.png?v=3?v=3">
    <script>
      const favicon = document.getElementById('favicon');
      const darkMode = window.matchMedia('(prefers-color-scheme: dark)');

    <!-- Pre-load Current Affairs Data for Zero Network Wait on Refresh -->
    <script src="/study/currentaffairs-data/05-10-2026.js"></script>

    <style>
      html {
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }
        :root {
            /* Smooth 0.55s Gradual Deceleration Curve */
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #777777;
            --panel-bg: #0a0a0a;
            --panel-border: #0a0a0a;
            --row-divider: #0a0a0a;
            --header-bg: #1a231e;
            --header-border: #222c26;
            --accent-tag-bg: #1c2720;
            --accent-tag-text: #6ec981;
            --pill-box-bg: rgba(255, 255, 255, 0.025);
            --pill-box-border: #222222;

            --link-color: #2997ff;
            --link-underline: rgba(41, 151, 255, 0.35);

            --cascade-distance: 24px;
            --cascade-duration-exit: 0.2s;
            --cascade-duration-entry: 0.28s;
        }

        html.light-mode,
        body.light-mode {
            --bg-color: #f1f1f1;
            --text-main: #111111;
            --text-muted: #88888e;
            --panel-bg: #ffffff;
            --panel-border: #e2e2e7;
            --row-divider: #f2f2f7;
            --header-bg: #ffffff;
            --header-border: #d4d8cf;
            --accent-tag-bg: #e2ede5;
            --accent-tag-text: #1d6e35;
            --pill-box-bg: rgba(0, 0, 0, 0.025);
            --pill-box-border: #e2e2e7;

            --link-color: #0066cc;
            --link-underline: rgba(0, 102, 204, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 24px 35px 24px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* MASTER ENTRANCE */
        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 24px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        header, .breadcrumb-nav, .date-topics-capsule, .topics-feed, footer {
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1.2s var(--ease-smooth) backwards;
        }

        @keyframes sideNavEntrance {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .side-nav-btn {
            opacity: 1;
            will-change: opacity;
            animation: sideNavEntrance 1.2s var(--ease-smooth) backwards;
        }

        header { animation-delay: 0.04s; }
        .breadcrumb-nav { animation-delay: 0.10s; }
        .date-topics-capsule { animation-delay: 0.16s; }
        .topics-feed { animation-delay: 0.22s; }
        .side-nav-btn { animation-delay: 0.26s; }
        footer { animation-delay: 0.30s; }

        /* HEADER */
        header {
            position: relative;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-radius: 28px;
            width: 100%;
            max-width: 880px;
            height: 72px;
            margin: 0 auto 50px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            touch-action: manipulation;
            z-index: 10;
            will-change: transform, box-shadow, border-color;
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) header { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }

        header:hover,
        header:focus-within,
        header:active,
        header.is-header-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1);
            border-color: #1E1E1E;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
        }

        body.light-mode header:hover,
        body.light-mode header:focus-within,
        body.light-mode header:active,
        body.light-mode header.is-header-lifted {
            border-color: #b8b8bc;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.09);
        }

        .header-inner-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        #headerMainView { opacity: 1; transform: translate3d(0, 0, 0); pointer-events: auto; z-index: 2; }
        #headerSearchView { opacity: 0; transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); pointer-events: none; z-index: 1; }

        header.state-search #headerMainView { animation: skyfallExit var(--cascade-duration-exit) ease-in both; pointer-events: none; }
        header.state-search #headerSearchView { animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both; animation-delay: var(--cascade-duration-exit); pointer-events: auto; }
        header.state-main #headerSearchView { animation: skyfallExit var(--cascade-duration-exit) ease-in both; pointer-events: none; }
        header.state-main #headerMainView { animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both; animation-delay: var(--cascade-duration-exit); pointer-events: auto; }

        @keyframes skyfallExit {
            0% { transform: translate3d(0, 0, 0); opacity: 1; }
            100% { transform: translate3d(0, var(--cascade-distance), 0); opacity: 0; }
        }

        @keyframes skyfallEntry {
            0% { transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }

        .header-right-cluster, .search-control-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            height: 100%;
        }

        .logo {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
            text-decoration: none !important;
            transition: color 0.8s var(--ease-smooth);
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            flex-shrink: 0;
            transition: opacity 0.2s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        .ctrl-btn:hover { opacity: 0.6; }

        .ctrl-btn svg, .search-static-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.8s var(--ease-smooth);
        }

        .search-static-icon { opacity: 0.4; flex-shrink: 0; }

        .search-core-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            padding: 0 16px;
            width: 100%;
            min-width: 0;
            transition: color 0.8s var(--ease-smooth);
        }

        .clear-text-btn svg { opacity: 0.4; }
        .close-search-btn svg { opacity: 0.7; }

        .theme-toggle {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .theme-toggle svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform-origin: center center;
            transition: transform 0.8s var(--ease-smooth), opacity 0.8s var(--ease-smooth), stroke 0.8s var(--ease-smooth);
        }

        .theme-toggle .sun-icon { opacity: 0; transform: translate(-50%, -50%) rotate(-90deg) scale(0.4); }
        .theme-toggle .moon-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .sun-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .moon-icon { opacity: 0; transform: translate(-50%, -50%) rotate(90deg) scale(0.4); }

        /* MAIN PAGE STRUCTURE */
        main {
            flex-grow: 1;
            width: 100%;
            max-width: 880px;
            margin: 0 auto 60px auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* BREADCRUMBS */
        .breadcrumb-nav {
            font-size: 14.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            transition: color 0.8s var(--ease-smooth);
        }

        .breadcrumb-nav a {
            color: var(--text-muted);
            text-decoration: none !important;
            transition: color 0.8s var(--ease-smooth);
        }

        .breadcrumb-nav a:hover { color: var(--text-main); }
        .bc-sep { opacity: 0.5; transition: color 0.8s var(--ease-smooth); }
        .bc-current { color: var(--text-main); font-weight: 500; transition: color 0.8s var(--ease-smooth); }

        /* DATE & TOPICS CAPSULE */
        .date-topics-capsule {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 16px 28px;
            margin-bottom: 32px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transition: background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth), 
                        box-shadow 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) .date-topics-capsule {
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }

        .capsule-date-cluster {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .cal-trigger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s var(--ease-smooth);
        }

        .cal-trigger-btn:hover { transform: scale(1.08); }

        .cal-trigger-btn svg {
            width: 36px;
            height: 36px;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
        }

        .date-text-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .date-label-tiny {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            transition: color 0.8s var(--ease-smooth);
        }

        .date-value-main {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            transition: color 0.8s var(--ease-smooth);
        }

        .capsule-divider {
            width: 1px;
            height: 36px;
            background-color: var(--row-divider);
            margin: 0 4px;
            flex-shrink: 0;
            transition: background-color 0.8s var(--ease-smooth);
        }

        .capsule-topics-cluster {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-grow: 1;
            min-width: 0;
        }

        /* RESTORED CLEAN TOPICS CAPSULE (PERFECTLY CENTERED GLIDER) */
        .topics-nav-pill {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--pill-box-bg);
            border: 1px solid var(--pill-box-border);
            padding: 3px 5px 3px 12px;
            border-radius: 9999px;
            height: 32px;
            box-sizing: border-box;
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .topics-nav-pill .pill-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            user-select: none;
            white-space: nowrap;
            line-height: 1;
        }

        .topic-numbers-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 100%;
        }

        .pill-slider-glider {
            position: absolute;
            top: 1px;
            bottom: 1px;
            left: 0;
            width: 0;
            background: var(--accent-tag-bg);
            border-radius: 9999px;
            transition: transform 0.38s cubic-bezier(0.25, 1, 0.35, 1), width 0.38s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.2s ease;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
        }

        .topic-num-btn {
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-muted);
            cursor: pointer;
            height: 24px;
            min-width: 24px;
            padding: 0 8px;
            border-radius: 9999px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            line-height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s var(--ease-smooth);
        }

        .topic-num-btn:hover { color: var(--text-main); }
        .topic-num-btn.is-active { color: var(--accent-tag-text); font-weight: 600; }

        /* SEAMLESS ARTICLE FEED & CARDS */
        .topics-feed {
            position: relative;
            width: 100%;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            transition: height 0.45s var(--ease-smooth);
            will-change: height;
        }

        .article-card {
            display: none;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 44px 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            user-select: text;
            -webkit-user-select: text;
            box-sizing: border-box;
            will-change: transform;
            transition: background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth), 
                        box-shadow 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) .article-card { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }

        .article-card.is-active {
            display: block;
            position: relative;
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        @keyframes stageSlideOutLeft { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        @keyframes stageSlideInRight { 0% { transform: translate3d(100%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
        @keyframes stageSlideOutRight { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }
        @keyframes stageSlideInLeft { 0% { transform: translate3d(-100%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }

        .article-card.anim-out-left { display: block !important; position: absolute !important; top: 0; left: 0; width: 100%; z-index: 1; pointer-events: none; animation: stageSlideOutLeft 0.48s var(--ease-smooth) forwards !important; }
        .article-card.anim-in-right { display: block !important; position: relative !important; z-index: 2; animation: stageSlideInRight 0.48s var(--ease-smooth) forwards !important; }
        .article-card.anim-out-right { display: block !important; position: absolute !important; top: 0; left: 0; width: 100%; z-index: 1; pointer-events: none; animation: stageSlideOutRight 0.48s var(--ease-smooth) forwards !important; }
        .article-card.anim-in-left { display: block !important; position: relative !important; z-index: 2; animation: stageSlideInLeft 0.48s var(--ease-smooth) forwards !important; }

        .article-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.35;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth);
        }

        /* LAPTOP FLOATING SIDE NAVIGATION ARROWS */
        .side-nav-btn {
            display: none;
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            z-index: 90;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            transition: opacity 0.3s var(--ease-smooth), 
                        transform 0.25s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth),
                        color 0.8s var(--ease-smooth);
        }

        body.light-mode .side-nav-btn { box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12); }

        .side-nav-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (min-width: 1025px) {
            .side-nav-btn { display: flex; }
            .side-nav-prev { left: max(20px, calc(50% - 440px - 72px)); }
            .side-nav-next { right: max(20px, calc(50% - 440px - 72px)); }
        }

        .side-nav-btn:hover:not(.is-disabled) {
            border-color: #1E1E1E;
            transform: translateY(-50%) scale(1.08);
            color: var(--accent-tag-text);
        }

        body.light-mode .side-nav-btn:hover:not(.is-disabled) { border-color: #b8b8bc; }
        .side-nav-btn.is-disabled { opacity: 0.15 !important; pointer-events: none !important; cursor: default !important; }

        /* METADATA PILLS */
        .meta-pills-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--row-divider);
            width: 100%;
            transition: border-color 0.8s var(--ease-smooth);
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            transition: background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth), 
                        color 0.8s var(--ease-smooth);
        }

        body.light-mode .meta-pill { background: rgba(0, 0, 0, 0.03); }
        .meta-pill strong { color: var(--text-main); font-weight: 600; transition: color 0.8s var(--ease-smooth); }

        /* ACTION PILLS: IMAGE & READ */
        .image-toggle-pill,
        .read-toggle-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        body.light-mode .image-toggle-pill,
        body.light-mode .read-toggle-pill { background: rgba(0, 0, 0, 0.03); }

        .image-action-btn,
        .read-action-btn {
            background: #258bf5;
            color: #ffffff;
            border: none;
            outline: none;
            padding: 3px 12px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s var(--ease-smooth), opacity 0.2s var(--ease-smooth);
        }

        .image-action-btn:hover,
        .read-action-btn:hover { opacity: 0.9; transform: scale(1.05); }

        /* INLINE REFERENCE LINKS (APPLE BLUE) */
        a.inline-link {
            color: var(--link-color) !important;
            text-decoration: underline !important;
            text-decoration-color: var(--link-underline) !important;
            text-underline-offset: 3px !important;
            text-decoration-thickness: 1.2px !important;
            font-weight: 500 !important;
            cursor: pointer !important;
            transition: text-decoration-color 0.2s ease, opacity 0.2s ease !important;
        }

        a.inline-link:hover {
            text-decoration-color: var(--link-color) !important;
            opacity: 0.85 !important;
        }

        /* DRAWERS */
        .topic-image-drawer,
        .topic-short-drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.55s var(--ease-smooth), margin 0.55s var(--ease-smooth);
            width: 100%;
            margin: 0;
        }

        .topic-image-drawer.is-open,
        .topic-short-drawer.is-open {
            grid-template-rows: 1fr;
            margin: 0 0 32px 0;
        }

        .topic-image-inner,
        .topic-short-inner {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translate3d(0, -12px, 0);
            transition: opacity 0.45s var(--ease-smooth), transform 0.45s var(--ease-smooth);
        }

        .topic-image-inner { align-items: center; }

        .topic-image-drawer.is-open .topic-image-inner {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition-delay: 0.1s;
        }

        .topic-short-drawer.is-open .topic-short-inner {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition-delay: 0.08s;
        }

        .topic-image-inner img {
            width: 100%;
            max-height: 520px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

        .topic-image-caption {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
        }

        .article-separation-divider {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0 28px 0;
            width: 100%;
        }

        .article-separation-divider::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--row-divider);
            z-index: 1;
        }

        .divider-label-pill {
            position: relative;
            z-index: 2;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* CONTENT SECTIONS */
        .note-section {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-section:last-child { margin-bottom: 0; }

        .section-heading {
            font-size: 18.5px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--row-divider);
            margin-bottom: 6px;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .note-p {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.9;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-left: 2px;
        }

        .note-list li {
            position: relative;
            padding-left: 24px;
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-main);
            opacity: 0.9;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list li::before {
            content: "•";
            position: absolute;
            left: 6px;
            top: -1px;
            font-size: 18px;
            color: var(--accent-tag-text);
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list li strong { color: var(--text-main); font-weight: 600; transition: color 0.8s var(--ease-smooth); }

        .note-sub-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-left: 4px;
        }

        .note-sub-row {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--text-main);
            opacity: 0.95;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .sub-bullet {
            color: var(--accent-tag-text);
            font-size: 11px;
            flex-shrink: 0;
        }

        .info-callout {
            background-color: var(--pill-box-bg);
            border: 1px solid var(--pill-box-border);
            border-radius: 20px;
            padding: 22px 24px;
            margin: 6px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .info-callout-row {
            position: relative;
            padding-left: 22px;
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--text-main);
            opacity: 0.95;
            hyphens: none;
            -webkit-hyphens: none;
            word-break: normal;
            transition: color 0.8s var(--ease-smooth);
        }

        .info-callout-row::before {
            content: "•";
            position: absolute;
            left: 4px;
            top: -1px;
            font-size: 18px;
            color: var(--accent-tag-text);
            transition: color 0.8s var(--ease-smooth);
        }

        .info-callout-row strong { color: var(--text-main); font-weight: 600; transition: color 0.8s var(--ease-smooth); }

        .empty-placeholder-card {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 60px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* DRUM WHEEL MODAL */
        .picker-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s var(--ease-smooth);
        }

        .picker-backdrop.is-open { opacity: 1; pointer-events: auto; }

        .picker-card {
            position: relative;
            width: 90%;
            max-width: 360px;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.92) translate3d(0, 15px, 0);
            transition: transform 0.35s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth);
        }

        body.light-mode .picker-card {
            background: #ffffff;
            border-color: #dcdcde;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .picker-backdrop.is-open .picker-card { transform: scale(1) translate3d(0, 0, 0); }

        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .picker-title { font-size: 18px; font-weight: 600; color: var(--text-main); transition: color 0.8s var(--ease-smooth); }

        .picker-apply-btn {
            background: #258bf5;
            color: #ffffff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .picker-apply-btn:hover { opacity: 0.9; transform: scale(1.04); }

        .picker-col-headers {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 100%;
            margin-bottom: 8px;
            padding: 0 6px;
        }

        .picker-col-hdr {
            text-align: center;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-muted);
            opacity: 0.75;
        }

        .picker-drum-stage {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            height: 220px;
            width: 100%;
            overflow: hidden;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.35);
            mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
            transition: background-color 0.8s var(--ease-smooth);
        }

        body.light-mode .picker-drum-stage { background: rgba(0, 0, 0, 0.04); }

        .picker-center-capsule {
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            height: 48px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            pointer-events: none;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        body.light-mode .picker-center-capsule { background: rgba(0, 0, 0, 0.08); border-color: rgba(0, 0, 0, 0.06); }

        .drum-column {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            touch-action: pan-y;
            overscroll-behavior-y: contain;
            overscroll-behavior-x: none;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
            padding: 86px 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .drum-column::-webkit-scrollbar { display: none; }

        .drum-cell {
            width: 100%;
            height: 48px;
            min-height: 48px;
            max-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-muted);
            scroll-snap-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.25s var(--ease-smooth);
        }

        .drum-cell.is-selected { color: var(--text-main); font-weight: 600; }

        /* FOOTER */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            width: 100%; 
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            transition: color 0.8s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { color: var(--text-muted); opacity: 0.65; font-size: 12px; letter-spacing: 0.2px; transition: color 0.8s var(--ease-smooth); }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        @media (hover: hover) and (pointer: fine) {
            .footer-links-row a:hover .nav-text,
            .logo:hover .nav-text {
                transform: scale3d(1.05, 1.05, 1) !important;
            }
        }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        @media (max-width: 1024px) {
            .breadcrumb-nav { padding-left: 10px; }
        }

        @media (max-width: 700px) {
            body { padding: 30px 18px 24px 18px; }
            .breadcrumb-nav { padding-left: 8px; }
            header { height: 64px; border-radius: 24px; margin-bottom: 30px; }
            .header-inner-view { padding: 0 20px; }
            .logo { font-size: 22px; }

            .date-topics-capsule {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 14px 18px;
                border-radius: 20px;
            }

            .capsule-date-cluster {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
            }

            .cal-trigger-btn svg { width: 30px; height: 30px; }

            .date-text-stack {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 5px;
                line-height: 1;
            }

            .date-label-tiny {
                font-size: 13px;
                color: var(--text-muted);
                font-weight: 500;
                display: flex;
                align-items: center;
            }

            .date-label-tiny::after { content: " :"; margin-right: 1px; }
            .date-value-main { font-size: 13.5px; font-weight: 600; color: var(--text-main); }
            .capsule-divider { display: none; }
            .capsule-topics-cluster { width: 100%; justify-content: flex-start; }
            .article-card { padding: 30px 20px; border-radius: 22px; }
            .article-title { font-size: 22px; }
            .section-heading { font-size: 17px; }
            .note-p, .note-list li { font-size: 14px; }
            .info-callout { padding: 18px 18px; border-radius: 16px; }
            .footer-links-row { gap: 12px 20px; max-width: 320px; }
        }
    </style>
</head>
<body>

    <!-- FLOATING MASTER HEADER -->
    <header id="masterHeader">
        <div class="header-inner-view" id="headerMainView">
            <a href="/study/index.html" class="logo">sathya.</a>
            <div class="header-right-cluster">
                <div class="theme-toggle" id="themeToggleBtn" aria-label="Toggle visual palette theme">
                    <svg class="sun-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </div>
                <button class="ctrl-btn" id="openSearchBtn" aria-label="Open Workspace Search">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>

        <form class="header-inner-view" id="headerSearchView" action="/study/search.html" method="GET">
            <button type="submit" aria-label="Submit search" style="background: none; border: none; padding: 0; margin: 0; cursor: pointer; color: inherit; display: flex; align-items: center; justify-content: center;">
                <svg class="search-static-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <input type="text" class="search-core-input" id="searchCoreInput" name="q" placeholder="Search..." autocomplete="off" enterkeyhint="search">
            <div class="search-control-cluster">
                <button type="button" class="ctrl-btn clear-text-btn" id="clearSearchBtn" aria-label="Clear typed text">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <button type="button" class="ctrl-btn close-search-btn" id="closeSearchBtn" aria-label="Minimize search pill">
                    <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </form>
    </header>

    <main>
        <!-- BREADCRUMBS -->
        <nav class="breadcrumb-nav">
            <a href="/study/index.html">Home</a>
            <span class="bc-sep">/</span>
            <span class="bc-current">Daily Current Affairs</span>
        </nav>

        <!-- DATE & TOPICS COMBINED CAPSULE -->
        <div class="date-topics-capsule">
            <div class="capsule-date-cluster">
                <button class="cal-trigger-btn" id="openCalendarBtn" aria-label="Open Date Picker">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="14" width="52" height="44" rx="14" fill="#E8EDF2"/>
                        <path d="M6 24C6 16.268 12.268 10 20 10H44C51.732 10 58 16.268 58 24V26H6V24Z" fill="#258BF5"/>
                        <rect x="18" y="4" width="6" height="12" rx="3" fill="#1A67B8"/>
                        <rect x="40" y="4" width="6" height="12" rx="3" fill="#1A67B8"/>
                        <rect x="14" y="32" width="8" height="8" rx="3" fill="#258BF5"/>
                        <rect x="28" y="32" width="8" height="8" rx="3" fill="#258BF5"/>
                        <rect x="42" y="32" width="8" height="8" rx="3" fill="#258BF5"/>
                        <rect x="14" y="44" width="8" height="8" rx="3" fill="#258BF5"/>
                        <rect x="28" y="44" width="8" height="8" rx="3" fill="#90C4F9"/>
                    </svg>
                </button>
                <div class="date-text-stack">
                    <span class="date-label-tiny">Selected Date</span>
                    <span class="date-value-main" id="activeDateDisplay">05 October 2026</span>
                </div>
            </div>

            <div class="capsule-divider"></div>

            <div class="capsule-topics-cluster" id="topicsPillContainer"></div>
        </div>

        <!-- ARTICLE FEED -->
        <div class="topics-feed" id="topicsFeed"></div>
    </main>

    <!-- LAPTOP FLOATING SIDE NAVIGATION ARROWS -->
    <button id="sidePrevBtn" class="side-nav-btn side-nav-prev" type="button" aria-label="Previous Topic">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button id="sideNextBtn" class="side-nav-btn side-nav-next" type="button" aria-label="Next Topic">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>

    <!-- 3-COLUMN DRUM WHEEL DATE PICKER MODAL -->
    <div class="picker-backdrop" id="pickerModal">
        <div class="picker-card">
            <div class="picker-header">
                <span class="picker-title">Select Date</span>
                <button class="picker-apply-btn" id="applyDateBtn">Apply</button>
            </div>

            <div class="picker-col-headers">
                <span class="picker-col-hdr">Date</span>
                <span class="picker-col-hdr">Month</span>
                <span class="picker-col-hdr">Year</span>
            </div>

            <div class="picker-drum-stage">
                <div class="picker-center-capsule"></div>
                <div class="drum-column" id="dayColumn"></div>
                <div class="drum-column" id="monthColumn"></div>
                <div class="drum-column" id="yearColumn"></div>
            </div>
        </div>
