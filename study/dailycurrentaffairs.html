<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Current Affairs - sathya.</title>
    <meta name="description" content="Daily Current Affairs for UPSC Civil Services Examination.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #777777;
            --panel-bg: #121212;
            --panel-border: #222222;
            --row-divider: #1c1c1c;
            --header-bg: #1a231e;
            --header-border: #222c26;
            --accent-tag-bg: #1c2720;
            --accent-tag-text: #6ec981;
            --pill-box-bg: rgba(255, 255, 255, 0.025);
            --pill-box-border: #222222;

            --cascade-distance: 24px;
            --cascade-duration-exit: 0.2s;
            --cascade-duration-entry: 0.28s;
        }

        body.light-mode {
            --bg-color: #ebebe4;
            --text-main: #111111;
            --text-muted: #88888e;
            --panel-bg: #ffffff;
            --panel-border: #e2e2e7;
            --row-divider: #f2f2f7;
            --header-bg: #e9ebe6;
            --header-border: #d4d8cf;
            --accent-tag-bg: #e2ede5;
            --accent-tag-text: #1d6e35;
            --pill-box-bg: rgba(0, 0, 0, 0.025);
            --pill-box-border: #e2e2e7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 24px 35px 24px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 20px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        header, main, footer {
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1.1s var(--ease-smooth) backwards;
        }

        header { animation-delay: 0.04s; }
        main { animation-delay: 0.14s; }
        footer { animation-delay: 0.24s; }

        /* HEADER */
        header {
            position: relative;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-radius: 28px;
            width: 100%;
            max-width: 880px;
            height: 72px;
            margin: 0 auto 50px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            touch-action: manipulation;
            z-index: 10;
            will-change: transform, box-shadow, border-color;
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) header { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }

        header:hover,
        header:focus-within,
        header:active,
        header.is-header-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1);
            border-color: #1E1E1E;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }

        body.light-mode header:hover,
        body.light-mode header:focus-within,
        body.light-mode header:active,
        body.light-mode header.is-header-lifted {
            border-color: #b8b8bc;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.09);
        }

        .header-inner-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        #headerMainView { opacity: 1; transform: translate3d(0, 0, 0); pointer-events: auto; z-index: 2; }
        #headerSearchView { opacity: 0; transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); pointer-events: none; z-index: 1; }

        header.state-search #headerMainView { animation: skyfallExit var(--cascade-duration-exit) ease-in both; pointer-events: none; }
        header.state-search #headerSearchView { animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both; animation-delay: var(--cascade-duration-exit); pointer-events: auto; }
        header.state-main #headerSearchView { animation: skyfallExit var(--cascade-duration-exit) ease-in both; pointer-events: none; }
        header.state-main #headerMainView { animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both; animation-delay: var(--cascade-duration-exit); pointer-events: auto; }

        @keyframes skyfallExit {
            0% { transform: translate3d(0, 0, 0); opacity: 1; }
            100% { transform: translate3d(0, var(--cascade-distance), 0); opacity: 0; }
        }

        @keyframes skyfallEntry {
            0% { transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }

        .header-right-cluster, .search-control-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            height: 100%;
        }

        .logo {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
            text-decoration: none !important;
            transition: color 0.8s var(--ease-smooth);
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            flex-shrink: 0;
            transition: opacity 0.2s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        .ctrl-btn:hover { opacity: 0.6; }

        .ctrl-btn svg, .search-static-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.8s var(--ease-smooth);
        }

        .search-static-icon { opacity: 0.4; flex-shrink: 0; }

        .search-core-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            padding: 0 16px;
            width: 100%;
            min-width: 0;
            transition: color 0.8s var(--ease-smooth);
        }

        .clear-text-btn svg { opacity: 0.4; }
        .close-search-btn svg { opacity: 0.7; }

        .theme-toggle {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .theme-toggle svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform-origin: center center;
            transition: transform 0.8s var(--ease-smooth), opacity 0.8s var(--ease-smooth), stroke 0.8s var(--ease-smooth);
        }

        .theme-toggle .sun-icon { opacity: 0; transform: translate(-50%, -50%) rotate(-90deg) scale(0.4); }
        .theme-toggle .moon-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .sun-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .moon-icon { opacity: 0; transform: translate(-50%, -50%) rotate(90deg) scale(0.4); }

        /* MAIN PAGE STRUCTURE */
        main {
            flex-grow: 1;
            width: 100%;
            max-width: 880px;
            margin: 0 auto 60px auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* BREADCRUMBS */
        .breadcrumb-nav {
            font-size: 14.5px;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            transition: color 0.8s var(--ease-smooth);
        }

        .breadcrumb-nav a {
            color: var(--text-muted);
            text-decoration: none !important;
            transition: color 0.8s var(--ease-smooth);
        }

        .breadcrumb-nav a:hover { color: var(--text-main); }
        .bc-sep { opacity: 0.5; transition: color 0.8s var(--ease-smooth); }
        .bc-current { color: var(--text-main); font-weight: 500; transition: color 0.8s var(--ease-smooth); }

        /* TITLE + CALENDAR BUTTON */
        .page-title-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 10px;
            width: 100%;
        }

        .page-title {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            transition: color 0.8s var(--ease-smooth);
        }

        .cal-trigger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: transform 0.25s var(--ease-smooth);
        }

        .cal-trigger-btn:hover { transform: scale(1.1); }
        .cal-trigger-btn svg { width: 36px; height: 36px; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25)); }

        .active-date-subtext {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            font-weight: 500;
            transition: color 0.8s var(--ease-smooth);
        }

        /* DYNAMIC TOPICS FEED */
        .topics-feed {
            display: flex;
            flex-direction: column;
            gap: 36px;
            width: 100%;
        }

        @keyframes topicCardEntrance {
            from {
                opacity: 0;
                transform: translate3d(0, 24px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .article-card {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 44px 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            opacity: 0;
            animation: topicCardEntrance 0.7s var(--ease-smooth) forwards;
            transition: background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth), 
                        box-shadow 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) .article-card { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }

        .article-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.35;
            transition: color 0.8s var(--ease-smooth);
        }

        /* METADATA PILLS */
        .meta-pills-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--row-divider);
            width: 100%;
            transition: border-color 0.8s var(--ease-smooth);
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            transition: background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth), 
                        color 0.8s var(--ease-smooth);
        }

        body.light-mode .meta-pill { background: rgba(0, 0, 0, 0.03); }

        .meta-pill strong { color: var(--text-main); font-weight: 600; transition: color 0.8s var(--ease-smooth); }
        .meta-pill.accent-pill { background: var(--accent-tag-bg); color: var(--accent-tag-text); border: none; }

        /* CONTENT SECTIONS */
        .note-section {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-section:last-child { margin-bottom: 0; }

        .section-heading {
            font-size: 18.5px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.2px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--row-divider);
            margin-bottom: 6px;
            transition: color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .note-p {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-main);
            opacity: 0.9;
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-left: 2px;
        }

        .note-list li {
            position: relative;
            padding-left: 24px;
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-main);
            opacity: 0.9;
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list li::before {
            content: "•";
            position: absolute;
            left: 6px;
            top: -1px;
            font-size: 18px;
            color: var(--accent-tag-text);
            transition: color 0.8s var(--ease-smooth);
        }

        .note-list li strong { color: var(--text-main); font-weight: 600; transition: color 0.8s var(--ease-smooth); }

        /* ROUNDED GREY PILL BOX */
        .info-callout {
            background-color: var(--pill-box-bg);
            border: 1px solid var(--pill-box-border);
            border-radius: 20px;
            padding: 22px 24px;
            margin: 6px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        .info-callout-row {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--text-main);
            opacity: 0.95;
            transition: color 0.8s var(--ease-smooth);
        }

        .info-callout-row strong { color: var(--text-main); font-weight: 600; transition: color 0.8s var(--ease-smooth); }

        .empty-placeholder-card {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 60px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        /* DRUM WHEEL DATE PICKER MODAL (STEADY VERTICAL AXIS) */
        .picker-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s var(--ease-smooth);
        }

        .picker-backdrop.is-open { opacity: 1; pointer-events: auto; }

        .picker-card {
            position: relative;
            width: 90%;
            max-width: 360px;
            background: #18191a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.92) translate3d(0, 15px, 0);
            transition: transform 0.35s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth), 
                        border-color 0.8s var(--ease-smooth);
        }

        body.light-mode .picker-card {
            background: #ffffff;
            border-color: #dcdcde;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .picker-backdrop.is-open .picker-card { transform: scale(1) translate3d(0, 0, 0); }

        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 8px;
        }

        .picker-title { font-size: 18px; font-weight: 600; color: var(--text-main); transition: color 0.8s var(--ease-smooth); }

        .picker-apply-btn {
            background: #258bf5;
            color: #ffffff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .picker-apply-btn:hover { opacity: 0.9; transform: scale(1.04); }

        /* DRUM STAGE WITH ZERO LATERAL DRIFT */
        .picker-drum-stage {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            height: 220px;
            width: 100%;
            overflow: hidden;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.25);
            mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
            transition: background-color 0.8s var(--ease-smooth);
        }

        body.light-mode .picker-drum-stage { background: rgba(0, 0, 0, 0.04); }

        .picker-center-capsule {
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            height: 48px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            pointer-events: none;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background-color 0.8s var(--ease-smooth), border-color 0.8s var(--ease-smooth);
        }

        body.light-mode .picker-center-capsule { background: rgba(0, 0, 0, 0.08); border-color: rgba(0, 0, 0, 0.06); }

        /* LOCKED VERTICAL AXIS */
        .drum-column {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            touch-action: pan-y;
            overscroll-behavior-y: contain;
            overscroll-behavior-x: none;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
            padding: 86px 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .drum-column::-webkit-scrollbar { display: none; }

        .drum-cell {
            width: 100%;
            height: 48px;
            min-height: 48px;
            max-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-muted);
            scroll-snap-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.25s var(--ease-smooth);
        }

        .drum-cell.is-selected {
            color: var(--text-main);
            font-weight: 600;
        }

        /* FOOTER */
        footer { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            width: 100%; 
        }

        .footer-links-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            width: 100%; 
        }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 400;
            display: inline-block;
            transition: color 0.8s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { color: var(--text-muted); opacity: 0.65; font-size: 12px; letter-spacing: 0.2px; transition: color 0.8s var(--ease-smooth); }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        @media (hover: hover) and (pointer: fine) {
            .footer-links-row a:hover .nav-text,
            .logo:hover .nav-text {
                transform: scale3d(1.05, 1.05, 1) !important;
            }
        }

        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
        }

        @media (max-width: 700px) {
            body { padding: 30px 18px 24px 18px; }
            header { height: 64px; border-radius: 24px; margin-bottom: 30px; }
            .header-inner-view { padding: 0 20px; }
            .logo { font-size: 22px; }
            .page-title { font-size: 26px; }
            .article-card { padding: 30px 20px; border-radius: 22px; }
            .article-title { font-size: 22px; }
            .section-heading { font-size: 17px; }
            .note-p, .note-list li { font-size: 14px; }
            .info-callout { padding: 18px 18px; border-radius: 16px; }
            .footer-links-row { gap: 12px 20px; max-width: 320px; }
        }
    </style>
</head>
<body>

    <!-- FLOATING MASTER HEADER -->
    <header id="masterHeader">
        <div class="header-inner-view" id="headerMainView">
            <a href="/study/index.html" class="logo">sathya.</a>
            <div class="header-right-cluster">
                <div class="theme-toggle" id="themeToggleBtn" aria-label="Toggle visual palette theme">
                    <svg class="sun-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </div>
                <button class="ctrl-btn" id="openSearchBtn" aria-label="Open Workspace Search">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>

        <form class="header-inner-view" id="headerSearchView" action="/study/search.html" method="GET">
            <button type="submit" aria-label="Submit search" style="background: none; border: none; padding: 0; margin: 0; cursor: pointer; color: inherit; display: flex; align-items: center; justify-content: center;">
                <svg class="search-static-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <input type="text" class="search-core-input" id="searchCoreInput" name="q" placeholder="Search..." autocomplete="off" enterkeyhint="search">
            <div class="search-control-cluster">
                <button type="button" class="ctrl-btn clear-text-btn" id="clearSearchBtn" aria-label="Clear typed text">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <button type="button" class="ctrl-btn close-search-btn" id="closeSearchBtn" aria-label="Minimize search pill">
                    <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </form>
    </header>

    <main>
        <!-- BREADCRUMBS -->
        <nav class="breadcrumb-nav">
            <a href="/study/index.html">Home</a>
            <span class="bc-sep">/</span>
            <span class="bc-current">Daily Current Affairs</span>
        </nav>

        <!-- PAGE HEADING + CALENDAR TRIGGER -->
        <div class="page-title-row">
            <h1 class="page-title">Daily Current Affairs</h1>
            <button class="cal-trigger-btn" id="openCalendarBtn" aria-label="Open Date Picker">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="14" width="52" height="44" rx="14" fill="#E8EDF2"/>
                    <path d="M6 24C6 16.268 12.268 10 20 10H44C51.732 10 58 16.268 58 24V26H6V24Z" fill="#258BF5"/>
                    <rect x="18" y="4" width="6" height="12" rx="3" fill="#1A67B8"/>
                    <rect x="40" y="4" width="6" height="12" rx="3" fill="#1A67B8"/>
                    <rect x="14" y="32" width="8" height="8" rx="3" fill="#258BF5"/>
                    <rect x="28" y="32" width="8" height="8" rx="3" fill="#258BF5"/>
                    <rect x="42" y="32" width="8" height="8" rx="3" fill="#258BF5"/>
                    <rect x="14" y="44" width="8" height="8" rx="3" fill="#258BF5"/>
                    <rect x="28" y="44" width="8" height="8" rx="3" fill="#90C4F9"/>
                </svg>
            </button>
        </div>

        <div class="active-date-subtext" id="activeDateDisplay">Selected Date: September 27, 2026</div>

        <!-- TOPICS FEED -->
        <div class="topics-feed" id="topicsFeed"></div>
    </main>

    <!-- 3-COLUMN DRUM WHEEL DATE PICKER MODAL -->
    <div class="picker-backdrop" id="pickerModal">
        <div class="picker-card">
            <div class="picker-header">
                <span class="picker-title">Select Date</span>
                <button class="picker-apply-btn" id="applyDateBtn">Apply</button>
            </div>

            <div class="picker-drum-stage">
                <div class="picker-center-capsule"></div>
                <div class="drum-column" id="dayColumn"></div>
                <div class="drum-column" id="monthColumn"></div>
                <div class="drum-column" id="yearColumn"></div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links-row">
            <a href="/study/Footer/about.html">About</a>
            <a href="/study/Footer/contact.html">Contact</a>
            <a href="/study/Footer/privacy.html">Privacy Policy</a>
            <a href="/study/Footer/terms.html">Terms &amp; Conditions</a>
            <a href="/study/Footer/disclaimer.html">Disclaimer</a>
        </div>
        <div class="copyright-tag">
            &copy; 2026 Sathya. All rights reserved.
        </div>
    </footer>

    <script>
        // 1. DYNAMIC BREADCRUMBS STATE
        (function buildDynamicBreadcrumbs() {
            const HOME_PATH = "/study/index.html";
            const CURRENT_PATH = "/study/dailycurrentaffairs.html";
            const structuralTrail = [
                { name: "Home", path: HOME_PATH },
                { name: "Daily Current Affairs", path: CURRENT_PATH }
            ];
            try {
                sessionStorage.setItem('breadcrumbTrail', JSON.stringify(structuralTrail));
            } catch (e) {}
        })();

        // 2. DATE STATE MANAGEMENT
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        let selectedYear = 2026;
        let selectedMonth = 9;
        let selectedDay = 27;

        let tempDay = selectedDay;
        let tempMonth = selectedMonth;
        let tempYear = selectedYear;

        const dayCol = document.getElementById('dayColumn');
        const monthCol = document.getElementById('monthColumn');
        const yearCol = document.getElementById('yearColumn');
        const topicsFeed = document.getElementById('topicsFeed');
        const activeDateDisplay = document.getElementById('activeDateDisplay');

        function initPickerColumns() {
            dayCol.innerHTML = '';
            for (let d = 1; d <= 31; d++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = String(d).padStart(2, '0');
                cell.dataset.val = d;
                dayCol.appendChild(cell);
            }

            monthCol.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = String(m).padStart(2, '0');
                cell.dataset.val = m;
                monthCol.appendChild(cell);
            }

            yearCol.innerHTML = '';
            const minYear = 2026;
            const maxYear = Math.max(minYear, new Date().getFullYear() + 1);
            for (let y = minYear; y <= maxYear; y++) {
                const cell = document.createElement('div');
                cell.className = 'drum-cell';
                cell.textContent = y;
                cell.dataset.val = y;
                yearCol.appendChild(cell);
            }
        }

        function scrollColumnTo(col, val) {
            const cells = Array.from(col.querySelectorAll('.drum-cell'));
            const target = cells.find(c => parseInt(c.dataset.val) === parseInt(val));
            if (target) {
                const cellHeight = 48;
                const index = cells.indexOf(target);
                col.scrollTo({ top: index * cellHeight, behavior: 'smooth' });
            }
        }

        function setupScrollHighlight(col, onSelected) {
            col.addEventListener('scroll', () => {
                const cellHeight = 48;
                const index = Math.round(col.scrollTop / cellHeight);
                const cells = col.querySelectorAll('.drum-cell');
                cells.forEach((cell, i) => {
                    const isSelected = i === index;
                    cell.classList.toggle('is-selected', isSelected);
                    if (isSelected && onSelected) {
                        onSelected(parseInt(cell.dataset.val));
                    }
                });
            });
        }

        initPickerColumns();
        setupScrollHighlight(dayCol, v => tempDay = v);
        setupScrollHighlight(monthCol, v => tempMonth = v);
        setupScrollHighlight(yearCol, v => tempYear = v);

        // 3. DYNAMIC DATA LOADER ENGINE FROM /study/currentaffairs-data/DD-MM-YYYY.js
        function renderCards(topics, dateText) {
            activeDateDisplay.textContent = `Selected Date: ${dateText}`;
            topicsFeed.innerHTML = '';

            if (!topics || topics.length === 0) {
                topicsFeed.innerHTML = `
                    <div class="empty-placeholder-card">
                        No current affairs entries found for ${dateText}.
                    </div>
                `;
                return;
            }

            topics.forEach((topic, idx) => {
                const card = document.createElement('article');
                card.className = 'article-card';
                card.style.animationDelay = `${idx * 0.12}s`;

                let orgRowsHtml = '';
                if (topic.whoOrg && topic.whoOrg.length > 0) {
                    orgRowsHtml = topic.whoOrg.map(row => `
                        <div class="info-callout-row"><strong>${row.label} :</strong> ${row.val}</div>
                    `).join('');
                }

                const buildListItems = (list) => {
                    if (!list || list.length === 0) return '';
                    return list.map(item => `<li>${item}</li>`).join('');
                };

                card.innerHTML = `
                    <h2 class="article-title">${topic.topicTitle}</h2>

                    <div class="meta-pills-row">
                        <span class="meta-pill accent-pill">GS Paper : <strong>${topic.gsPaper}</strong></span>
                        <span class="meta-pill">Category : <strong>${topic.category}</strong></span>
                        <span class="meta-pill">Comes under : <strong>${topic.comesUnder}</strong></span>
                    </div>

                    ${topic.whyInNews ? `
                    <section class="note-section">
                        <h3 class="section-heading">Why in News?</h3>
                        <p class="note-p">${topic.whyInNews}</p>
                    </section>` : ''}

                    ${topic.whatConcept ? `
                    <section class="note-section">
                        <h3 class="section-heading">What / Concept</h3>
                        <p class="note-p">${topic.whatConcept}</p>
                    </section>` : ''}

                    ${orgRowsHtml ? `
                    <section class="note-section">
                        <h3 class="section-heading">Who / Organisation</h3>
                        <div class="info-callout">${orgRowsHtml}</div>
                    </section>` : ''}

                    ${topic.importantFacts && topic.importantFacts.length > 0 ? `
                    <section class="note-section">
                        <h3 class="section-heading">Important Facts ⭐</h3>
                        <ul class="note-list">${buildListItems(topic.importantFacts)}</ul>
                    </section>` : ''}

                    ${topic.background && topic.background.length > 0 ? `
                    <section class="note-section">
                        <h3 class="section-heading">Background / Static Linkage</h3>
                        <ul class="note-list">${buildListItems(topic.background)}</ul>
                    </section>` : ''}

                    ${topic.significance && topic.significance.length > 0 ? `
                    <section class="note-section">
                        <h3 class="section-heading">Significance</h3>
                        <ul class="note-list">${buildListItems(topic.significance)}</ul>
                    </section>` : ''}

                    ${topic.challenges && topic.challenges.length > 0 ? `
                    <section class="note-section">
                        <h3 class="section-heading">Challenges / Concerns</h3>
                        <ul class="note-list">${buildListItems(topic.challenges)}</ul>
                    </section>` : ''}

                    ${topic.wayForward && topic.wayForward.length > 0 ? `
                    <section class="note-section">
                        <h3 class="section-heading">Way Forward</h3>
                        <ul class="note-list">${buildListItems(topic.wayForward)}</ul>
                    </section>` : ''}
                `;

                topicsFeed.appendChild(card);
            });
        }

        // Script injector loading /study/currentaffairs-data/DD-MM-YYYY.js
        function loadDateData(year, month, day, onSuccess, onFail) {
            const dateKey = `${String(day).padStart(2, '0')}-${String(month).padStart(2, '0')}-${year}`;
            const existingScript = document.getElementById('currentAffairsDataScript');
            if (existingScript) existingScript.remove();

            window.currentDailyTopics = null;

            const script = document.createElement('script');
            script.id = 'currentAffairsDataScript';
            script.src = `/study/currentaffairs-data/${dateKey}.js`;

            script.onload = () => {
                if (window.currentDailyTopics) {
                    onSuccess(window.currentDailyTopics, dateKey);
                } else {
                    onFail();
                }
            };

            script.onerror = () => {
                onFail();
            };

            document.body.appendChild(script);
        }

        // OPTION 1: Backtrack up to 30 days from current date to find the freshest post
        function loadLatestAvailablePost() {
            const checkDate = new Date();
            let attempts = 0;
            const maxBacktrackDays = 30;

            function tryNextDate() {
                const y = checkDate.getFullYear();
                const m = checkDate.getMonth() + 1;
                const d = checkDate.getDate();

                loadDateData(y, m, d, (topics) => {
                    selectedYear = y;
                    selectedMonth = m;
                    selectedDay = d;
                    tempYear = y;
                    tempMonth = m;
                    tempDay = d;
                    renderCards(topics, `${monthNames[m - 1]} ${d}, ${y}`);
                }, () => {
                    attempts++;
                    if (attempts < maxBacktrackDays) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        tryNextDate();
                    } else {
                        // Fallback to static starting date if backtracking finds nothing
                        loadDateData(2026, 9, 27, (topics) => {
                            selectedYear = 2026;
                            selectedMonth = 9;
                            selectedDay = 27;
                            tempYear = 2026;
                            tempMonth = 9;
                            tempDay = 27;
                            renderCards(topics, `September 27, 2026`);
                        }, () => {
                            renderCards([], `September 27, 2026`);
                        });
                    }
                });
            }

            tryNextDate();
        }

        loadLatestAvailablePost();

        // 4. MODAL CONTROLS & APPLY ACTION
        const pickerModal = document.getElementById('pickerModal');
        const openCalendarBtn = document.getElementById('openCalendarBtn');
        const applyDateBtn = document.getElementById('applyDateBtn');

        openCalendarBtn.addEventListener('click', () => {
            initPickerColumns();
            pickerModal.classList.add('is-open');
            setTimeout(() => {
                scrollColumnTo(dayCol, selectedDay);
                scrollColumnTo(monthCol, selectedMonth);
                scrollColumnTo(yearCol, selectedYear);
            }, 50);
        });

        applyDateBtn.addEventListener('click', () => {
            selectedDay = tempDay;
            selectedMonth = tempMonth;
            selectedYear = tempYear;
            const formattedDateText = `${monthNames[selectedMonth - 1]} ${selectedDay}, ${selectedYear}`;

            loadDateData(selectedYear, selectedMonth, selectedDay, (topics) => {
                renderCards(topics, formattedDateText);
            }, () => {
                renderCards([], formattedDateText);
            });

            pickerModal.classList.remove('is-open');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        pickerModal.addEventListener('pointerdown', (e) => {
            if (e.target === pickerModal) {
                pickerModal.classList.remove('is-open');
            }
        });

        // 5. THEME PALETTE ENGINE (SYNCED WITH index.html)
        const toggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');
        const masterHeader = document.getElementById('masterHeader');
        const openSearchBtn = document.getElementById('openSearchBtn');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const searchCoreInput = document.getElementById('searchCoreInput');

        function handleHeaderLeaveOrBlur(isExplicitClose = false) {
            const isSearchActive = masterHeader.classList.contains('state-search');
            if (isSearchActive) {
                const isEmpty = searchCoreInput.value.trim() === "";
                if (isEmpty || isExplicitClose) {
                    masterHeader.classList.remove('state-search');
                    masterHeader.classList.add('state-main');
                    searchCoreInput.value = "";
                }
            }
            searchCoreInput.blur();
            masterHeader.classList.remove('is-header-lifted');
        }

        masterHeader.addEventListener('pointerdown', (e) => {
            masterHeader.classList.add('is-header-lifted');
            if (masterHeader.classList.contains('state-search')) {
                if (document.activeElement !== searchCoreInput && e.target !== closeSearchBtn && e.target !== clearSearchBtn) {
                    searchCoreInput.focus({ preventScroll: true });
                }
            }
        });

        masterHeader.addEventListener('pointerleave', () => {
            if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                handleHeaderLeaveOrBlur(false);
            } else {
                searchCoreInput.blur();
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        masterHeader.addEventListener('pointerup', () => {
            if (document.activeElement !== searchCoreInput && !masterHeader.matches(':hover')) {
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        document.addEventListener('pointerdown', (e) => {
            if (!masterHeader.contains(e.target)) {
                if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                    handleHeaderLeaveOrBlur(false);
                } else {
                    searchCoreInput.blur();
                    masterHeader.classList.remove('is-header-lifted');
                }
            }
        });

        function applyTargetPalette() {
            const activeSessionOverride = sessionStorage.getItem('dashboard-theme');
            if (activeSessionOverride) {
                if (activeSessionOverride === 'light') {
                    bodyElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                }
            } else {
                if (systemLightQuery.matches) {
                    bodyElement.classList.add('light-mode');
                } else {
                    bodyElement.classList.remove('light-mode');
                }
            }
        }
        applyTargetPalette();

        systemLightQuery.addEventListener('change', (e) => {
            sessionStorage.removeItem('dashboard-theme');
            if (e.matches) {
                bodyElement.classList.add('light-mode');
            } else {
                bodyElement.classList.remove('light-mode');
            }
        });

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isCurrentlyLight = bodyElement.classList.contains('light-mode');
            if (isCurrentlyLight) {
                bodyElement.classList.remove('light-mode');
                sessionStorage.setItem('dashboard-theme', 'dark');
            } else {
                bodyElement.classList.add('light-mode');
                sessionStorage.setItem('dashboard-theme', 'light');
            }
        });

        openSearchBtn.addEventListener('click', () => {
            masterHeader.classList.remove('state-main');
            masterHeader.classList.add('state-search');
            masterHeader.classList.add('is-header-lifted');
            searchCoreInput.focus({ preventScroll: true });
        });

        clearSearchBtn.addEventListener('click', () => {
            searchCoreInput.value = "";
            searchCoreInput.focus();
        });

        closeSearchBtn.addEventListener('click', () => handleHeaderLeaveOrBlur(true));

        const targetLinks = document.querySelectorAll('footer .footer-links-row a, .breadcrumb-nav a, .logo');
        targetLinks.forEach(link => {
            if (!link.querySelector('.nav-text')) {
                const wrapper = document.createElement('span');
                wrapper.className = 'nav-text';
                while (link.firstChild) {
                    wrapper.appendChild(link.firstChild);
                }
                link.appendChild(wrapper);
            }
            link.addEventListener('click', function(e) {
                const dest = this.getAttribute('href');
                if (!dest || dest === '#' || dest.startsWith('#')) return;
                e.preventDefault();
                targetLinks.forEach(l => l.classList.remove('is-wave-loading'));
                this.classList.add('is-wave-loading');
                setTimeout(() => { window.location.href = dest; }, 750);
            });
        });
    </script>
    <script src="/script.js"></script>
</body>
</html>
