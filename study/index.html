    <!-- Instant Theme Evaluation to Prevent Theme Flash on Reload -->
    <script>
      (function() {
        try {
          const activeTheme = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
          const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          const isLight = (activeTheme === 'light' || (!activeTheme && prefersLight));
          if (isLight) {
            document.documentElement.classList.add('light-mode');
          } else {
            document.documentElement.classList.remove('light-mode');
          }
        } catch (e) {}
      })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Smooth gradual 0.55s easing curve */
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --bg-color: #0b0b0b;
            --text-main: #ffffff;
            --text-muted: #555555;
            --panel-bg: #121212;
            --panel-border: #222222;
            --row-divider: #1c1c1c;
            --row-hover: rgba(255, 255, 255, 0.015);
            --header-bg: #1a231e;
            --header-border: #222c26;
            --panel-color: #121212;
            --panel-bg: #121212;
            --text-main: #ffffff;
            --text-sub: #a0a0a5;
            --text-muted: #888888;
            --border-color: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.04);
            --panel-border-hover: rgba(255, 255, 255, 0.11);
            --shadow-base: 0 4px 30px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 25px 60px rgba(0, 0, 0, 0.8);
            --row-divider: #1c1c1c;
            
            /* Vertical cascade parameters */
            --cascade-distance: 24px;
            --cascade-duration-exit: 0.2s;
            --cascade-duration-entry: 0.28s;
        }

        html.light-mode {
            background-color: #f5f5f7 !important;
            color: #1d1d1f !important;
        }

        html.light-mode,
        body.light-mode {
            --bg-color: #f5f5f7;
            --header-bg: #e9ebe6;
            --header-border: #d4d8cf;
            --panel-color: #ffffff;
            --panel-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            --text-muted: #8e8e93;
            --border-color: rgba(0, 0, 0, 0.04);
            --panel-border: rgba(0, 0, 0, 0.04);
            --panel-border-hover: rgba(0, 0, 0, 0.10);
            --shadow-base: 0 4px 20px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 20px 45px rgba(0, 0, 0, 0.08);
            --row-divider: #f2f2f7;
            --row-hover: rgba(0, 0, 0, 0.01);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 36px 24px;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.8s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        @keyframes masterEntrance {
            from { opacity: 0; transform: translate3d(0, 24px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        header, .capsule-panel, footer {
            opacity: 1;
            will-change: transform, opacity;
            animation: masterEntrance 1.2s var(--ease-smooth) backwards;
        }

        header { animation-delay: 0.04s; }
        .capsule-panel:nth-child(1) { animation-delay: 0.14s; }
        .capsule-panel:nth-child(2) { animation-delay: 0.20s; }
        .capsule-panel:nth-child(3) { animation-delay: 0.26s; }
        .capsule-panel:nth-child(4) { animation-delay: 0.32s; }
        .capsule-panel:nth-child(5) { animation-delay: 0.38s; }
        .capsule-panel:nth-child(6) { animation-delay: 0.44s; }
        footer { animation-delay: 0.52s; }

        /* HEADER BASE */
        header {
            position: relative;
            background-color: var(--header-bg);
            border: 1px solid var(--header-border);
            border-radius: 28px;
            width: 100%;
            height: 72px;
            margin: 0 auto 80px auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            touch-action: manipulation;
            
            will-change: transform, box-shadow, border-color;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            
            /* Always smooth 0.55s curve for both lifting up & recoiling back down */
            transition: transform 0.55s var(--ease-smooth), 
                        box-shadow 0.55s var(--ease-smooth), 
                        border-color 0.55s var(--ease-smooth), 
                        background-color 0.8s var(--ease-smooth);
        }

        body:not(.light-mode) header {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* NATIVE REPEATABLE 3D LIFT ON HOVER, FOCUS, TAP, OR CLICK */
        header:hover,
        header:focus-within,
        header:active,
        header.is-header-lifted {
            transform: translate3d(0, -6px, 0) scale3d(1.015, 1.015, 1);
            border-color: #1E1E1E;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }

        body.light-mode header:hover,
        body.light-mode header:focus-within,
        body.light-mode header:active,
        body.light-mode header.is-header-lifted {
            border-color: #b8b8bc;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.09);
        }

        .header-inner-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            will-change: transform, opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        #headerMainView {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
            z-index: 2;
        }

        #headerSearchView {
            opacity: 0;
            transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0);
            pointer-events: none;
            z-index: 1;
        }

        header.state-search #headerMainView {
            animation: skyfallExit var(--cascade-duration-exit) ease-in both;
            pointer-events: none;
        }
        header.state-search #headerSearchView {
            animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both;
            animation-delay: var(--cascade-duration-exit);
            pointer-events: auto;
        }

        header.state-main #headerSearchView {
            animation: skyfallExit var(--cascade-duration-exit) ease-in both;
            pointer-events: none;
        }
        header.state-main #headerMainView {
            animation: skyfallEntry var(--cascade-duration-entry) var(--ease-smooth) both;
            animation-delay: var(--cascade-duration-exit);
            pointer-events: auto;
        }

        @keyframes skyfallExit {
            0% { transform: translate3d(0, 0, 0); opacity: 1; }
            100% { transform: translate3d(0, var(--cascade-distance), 0); opacity: 0; }
        }

        @keyframes skyfallEntry {
            0% { transform: translate3d(0, calc(-1 * var(--cascade-distance)), 0); opacity: 0; }
            100% { transform: translate3d(0, 0, 0); opacity: 1; }
        }

        .header-right-cluster,
        .search-control-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            height: 100%;
        }

        .logo {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
            text-decoration: none !important;
            transition: color 0.8s var(--ease-smooth);
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            flex-shrink: 0;
            transition: opacity 0.2s var(--ease-smooth), color 0.8s var(--ease-smooth);
        }

        .ctrl-btn:hover { opacity: 0.6; }

        .ctrl-btn svg,
        .search-static-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.8s var(--ease-smooth);
        }

        .search-static-icon {
            opacity: 0.4;
            flex-shrink: 0;
        }

        .search-core-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 16px;
            padding: 0 16px;
            width: 100%;
            min-width: 0;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: color 0.8s var(--ease-smooth);
        }

        .clear-text-btn svg { opacity: 0.4; }
        .close-search-btn svg { opacity: 0.7; }

        .theme-toggle {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .theme-toggle svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            will-change: transform, opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transition: transform 0.8s var(--ease-smooth), opacity 0.8s var(--ease-smooth), stroke 0.8s var(--ease-smooth);
        }

        .theme-toggle .sun-icon { opacity: 0; transform: translate(-50%, -50%) rotate(-90deg) scale(0.4); }
        .theme-toggle .moon-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .sun-icon { opacity: 1; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        body.light-mode .theme-toggle .moon-icon { opacity: 0; transform: translate(-50%, -50%) rotate(90deg) scale(0.4); }

        /* ---------------------------------------------------- */
        /* BENTO GRID STRUCTURE                                 */
        /* ---------------------------------------------------- */
        .bento-container,
        .matrix-canvas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
            max-width: 1040px;
            align-items: stretch;
            margin: 0 auto 80px auto;
        }

        /* ---------------------------------------------------- */
        /* 10/10 PANEL CARD HOVER ENGINE                        */
        /* ---------------------------------------------------- */
        .bento-card,
        .capsule-panel {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px;
            min-height: 220px;
            box-shadow: var(--shadow-base);
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            box-sizing: border-box;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        background-color 0.4s ease,
                        border-color 0.4s ease;
        }

        /* Outer panel stays stationary on hover (NO ZOOM / NO LIFT) */
        @media (hover: hover) and (pointer: fine) {
            body:not(.popup-active) .bento-card:hover,
            body:not(.popup-active) .capsule-panel:hover {
                transform: none !important;
                box-shadow: var(--shadow-hover);
                border-color: var(--panel-border-hover);
            }

            /* Inner content layer: words slide up smoothly when hovering the card */
            body:not(.popup-active) .bento-card:hover .card-parallax-content,
            body:not(.popup-active) .capsule-panel:hover .card-parallax-content {
                transform: translateY(-6px) translateZ(0);
            }
        }

        /* Mobile / Touch: stationary (NO LIFT / NO ZOOM) */
        @media (hover: none), (pointer: coarse) {
            .bento-card:active,
            .capsule-panel:active {
                transform: none !important;
            }
        }

        /* Inner isolated contents container wrapper */
        .card-parallax-content {
            transform: translateY(0);
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* ---------------------------------------------------- */
        /* CARD TYPOGRAPHY                                      */
        /* ---------------------------------------------------- */
        .bento-card h2,
        .capsule-panel h2,
        .panel-title {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: -0.4px;
            color: var(--text-main);
            line-height: 1.2;
        }

        .list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Restored: 16px font size, normal weight (not bold) */
        .list-item {
            font-size: 16px !important;
            font-weight: 400 !important;
            color: var(--text-main);
            opacity: 0.85;
            transition: opacity 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                        color 0.25s ease;
            text-decoration: none !important;
            display: inline-block;
            width: fit-content;
        }

        /* Sibling muting ONLY when hovering a specific link/word */
        @media (hover: hover) and (pointer: fine) {
            .list-wrapper:has(.list-item:hover) .list-item:not(:hover) {
                opacity: 0.35 !important;
            }

            .list-wrapper .list-item:hover {
                opacity: 1 !important;
                transform: scale(1.04) translateZ(0) !important;
                color: var(--text-main) !important;
            }
        }

        @media (hover: none), (pointer: coarse) {
            .list-wrapper .list-item:active {
                opacity: 1 !important;
                transform: scale(1.04) translateZ(0) !important;
            }
        }

        footer { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; }
        .footer-links-row { display: flex; justify-content: center; align-items: center; gap: 32px; flex-wrap: wrap; width: 100%; }

        .footer-links-row a {
            color: var(--text-muted) !important;
            text-decoration: none !important;
            font-size: 14px;
            font-weight: 400;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: color 0.4s var(--ease-smooth);
        }

        .footer-links-row a:hover { color: var(--text-main) !important; }
        .copyright-tag { color: var(--text-muted); opacity: 0.6; font-size: 12.5px; letter-spacing: 0.2px; transition: color 0.8s var(--ease-smooth); }

        @media (max-width: 1024px) {
            .matrix-canvas { grid-template-columns: repeat(2, 1fr); gap: 28px; }
        }

        @media (max-width: 700px) {
            .matrix-canvas { grid-template-columns: 1fr; gap: 24px; }
            .capsule-panel { padding: 28px 4px 12px 4px; }
            body { padding: 40px 20px; }
            header { margin-bottom: 40px; height: 64px; border-radius: 24px; }
            .header-inner-view { padding: 0 20px; }
            .logo { font-size: 22px; }
            .search-core-input { padding: 0 12px; font-size: 15px; }
            .header-right-cluster { gap: 16px; }
        }

        .view-more-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed var(--row-divider);
            transition: border-color 0.8s var(--ease-smooth);
        }

        .view-more-link {
            color: #8a9a86 !important;
            font-weight: 400;
            text-decoration: none !important;
            font-size: 0.95rem;
            display: inline-block;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: opacity 0.2s ease;
        }

        .view-more-link:hover { opacity: 0.8; text-decoration: none !important; }

        .nav-text {
            display: inline-block !important;
            white-space: nowrap !important;
            transform-origin: center center !important;
            will-change: transform, opacity, background-position !important;
            transition: transform 0.4s var(--ease-smooth), opacity 0.4s var(--ease-smooth);
        }

        .footer-links-row a .nav-text { color: var(--text-muted); }
        .footer-links-row a:hover .nav-text { color: var(--text-main); }
        .view-more-link .nav-text { color: #8a9a86; }

        /* Mouse Hover Zoom */
        .matrix-canvas a:hover .nav-text,
        .view-more-link:hover .nav-text,
        .footer-links-row a:hover .nav-text,
        .logo:hover .nav-text {
            transform: scale3d(1.06, 1.06, 1) !important;
        }

        /* Fluid Wave Animation Engine */
        @keyframes fluidWave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 25%, #555555 50%, #ffffff 75%, #ffffff 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        body.light-mode a.is-wave-loading .nav-text {
            background-image: linear-gradient(90deg, #111111 0%, #111111 25%, #8a8a8e 50%, #111111 75%, #111111 100%) !important;
            background-size: 200% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            animation: fluidWave 0.75s infinite linear !important;
            will-change: background-position, transform !important;
            opacity: 1 !important;
        }

        .kinetic-locked-frame { pointer-events: none !important; }
        .kinetic-locked-frame .nav-text {
            transition: none !important;
            -webkit-transition: none !important;
        }
    
        /* UNIVERSAL FLAT DESIGN: ZERO PANEL SHADOWS SITE-WIDE */
        .capsule-panel,
        .subject-accordion-card,
        .card,
        .wide-capsule,
        .article-card,
        .date-topics-capsule,
        .macro-card,
        .day-switcher-capsule {
            box-shadow: none !important;
        }

        .capsule-panel:hover,
        .capsule-panel:active,
        .capsule-panel:focus-within,
        .subject-accordion-card:hover,
        .subject-accordion-card:active,
        .subject-accordion-card:focus-within,
        .card:hover,
        .card:active,
        .wide-capsule:hover,
        .wide-capsule:active,
        .article-card:hover,
        .article-card:active {
            box-shadow: none !important;
        }

        /* TOUCH OPTIMIZATION (IPAD / TOUCHSCREEN): NO STICKY HOVER LAG */
        @media (hover: none) {
            .capsule-panel:hover,
            .subject-accordion-card:hover,
            .card:hover,
            .wide-capsule:hover,
            .article-card:hover {
                transform: none !important;
            }
            .capsule-panel:active,
            .subject-accordion-card:active,
            .card:active,
            .wide-capsule:active {
                transform: scale3d(0.985, 0.985, 1) !important;
                transition: transform 0.12s ease-out !important;
            }
        }

        /* CLICKABLE WORDS ZOOM TOWARDS US STRAIGHT */
        @media (hover: hover) and (pointer: fine) {
            a:not(.brand-pill):not(.back-icon-btn):hover,
            a:not(.brand-pill):not(.back-icon-btn):hover .nav-text,
            .site-name:hover,
            .sortable:hover,
            .document-list a:hover .nav-text,
            .topics-column-grid a:hover,
            .footer-links-row a:hover,
            .footer-links-row a:hover .nav-text {
                transform: scale3d(1.06, 1.06, 1) !important;
                transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1) !important;
                transform-origin: center center !important;
            }
        }

    </style>
</head>

                </div>

            <div class="bento-card capsule-panel">

    <script>
        (function buildDynamicBreadcrumbs() {
            const HOME_PATH = "/study/index.html";
            const structuralHomeState = [{ name: "Home", path: HOME_PATH }];
            try {
                sessionStorage.setItem('breadcrumbTrail', JSON.stringify(structuralHomeState));
            } catch (e) {}
        })();

        const toggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const systemLightQuery = window.matchMedia('(prefers-color-scheme: light)');

        const masterHeader = document.getElementById('masterHeader');
        const openSearchBtn = document.getElementById('openSearchBtn');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const searchCoreInput = document.getElementById('searchCoreInput');

        // Helper to handle search state and lift release
        function handleHeaderLeaveOrBlur(isExplicitClose = false) {
            const isSearchActive = masterHeader.classList.contains('state-search');
            if (isSearchActive) {
                const isEmpty = searchCoreInput.value.trim() === "";
                if (isEmpty || isExplicitClose) {
                    masterHeader.classList.remove('state-search');
                    masterHeader.classList.add('state-main');
                    searchCoreInput.value = "";
                }
            }
            searchCoreInput.blur();
            masterHeader.classList.remove('is-header-lifted');
        }

        // Tactile Lift Handlers for Header
        masterHeader.addEventListener('pointerdown', (e) => {
            masterHeader.classList.add('is-header-lifted');
            if (masterHeader.classList.contains('state-search')) {
                if (document.activeElement !== searchCoreInput && e.target !== closeSearchBtn && e.target !== clearSearchBtn) {
                    searchCoreInput.focus({ preventScroll: true });
                }
            }
        });

        masterHeader.addEventListener('pointerleave', () => {
            if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                handleHeaderLeaveOrBlur(false);
            } else {
                searchCoreInput.blur();
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        masterHeader.addEventListener('pointerup', () => {
            if (document.activeElement !== searchCoreInput && !masterHeader.matches(':hover')) {
                masterHeader.classList.remove('is-header-lifted');
            }
        });

        // Capsule Panels header dismissal
        const capsulePanels = document.querySelectorAll('.capsule-panel');
        capsulePanels.forEach(panel => {
            panel.addEventListener('pointerdown', () => {
                if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                    handleHeaderLeaveOrBlur(false);
                } else {
                    searchCoreInput.blur();
                    masterHeader.classList.remove('is-header-lifted');
                }
            });
        });

        // Global Click-Outside Dismiss
        document.addEventListener('pointerdown', (e) => {
            if (!masterHeader.contains(e.target)) {
                if (masterHeader.classList.contains('state-search') && searchCoreInput.value.trim() === "") {
                    handleHeaderLeaveOrBlur(false);
                } else {
                    searchCoreInput.blur();
                    masterHeader.classList.remove('is-header-lifted');
                }
            }
        });

        function applyTargetPalette() {
            try {
                const activeOverride = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
                const isLight = activeOverride ? (activeOverride === 'light') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
                if (isLight) {
                    if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.add('light-mode');
                    document.documentElement.classList.add('light-mode');
                } else {
                    if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.remove('light-mode');
                    document.documentElement.classList.remove('light-mode');
                }
            } catch(e) {}
        }
        applyTargetPalette();

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
                const hasManualTheme = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
                if (!hasManualTheme) {
                    if (e.matches) {
                        if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.add('light-mode');
                        document.documentElement.classList.add('light-mode');
                    } else {
                        if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.remove('light-mode');
                        document.documentElement.classList.remove('light-mode');
                    }
                }
            });
        }

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isCurrentlyLight = document.documentElement.classList.contains('light-mode') || (typeof bodyElement !== 'undefined' && bodyElement && bodyElement.classList.contains('light-mode'));
            if (isCurrentlyLight) {
                if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.remove('light-mode');
                document.documentElement.classList.remove('light-mode');
                localStorage.setItem('dashboard-theme', 'dark');
                sessionStorage.setItem('dashboard-theme', 'dark');
            } else {
                if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.add('light-mode');
                document.documentElement.classList.add('light-mode');
                localStorage.setItem('dashboard-theme', 'light');
                sessionStorage.setItem('dashboard-theme', 'light');
            }
        });

        openSearchBtn.addEventListener('click', () => {
            masterHeader.classList.remove('state-main');
            masterHeader.classList.add('state-search');
            masterHeader.classList.add('is-header-lifted');
            searchCoreInput.focus({ preventScroll: true });
        });

        clearSearchBtn.addEventListener('click', () => {
            searchCoreInput.value = "";
            searchCoreInput.focus();
        });

        closeSearchBtn.addEventListener('click', () => {
            handleHeaderLeaveOrBlur(true);
        });

        searchCoreInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && searchCoreInput.value.trim() === "") {
                handleHeaderLeaveOrBlur(true);
            }
        });

        const universalTargetLinks = document.querySelectorAll('.matrix-canvas a, .view-more-link, footer .footer-links-row a, .logo');

        universalTargetLinks.forEach(link => {
            if (!link.querySelector('.nav-text')) {
                const wrapper = document.createElement('span');
                wrapper.className = 'nav-text';
                while (link.firstChild) {
                    wrapper.appendChild(link.firstChild);
                }
                link.appendChild(wrapper);
            }
        });

        universalTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || destination.startsWith('#')) return;

                e.preventDefault();
                universalTargetLinks.forEach(l => l.classList.remove('is-wave-loading'));

                // Trigger wave shimmer animation
                this.classList.add('is-wave-loading');
                sessionStorage.setItem('activeUniversalTargetUrl', this.href);

                // Hold for 750ms so wave sweep completes smoothly
                setTimeout(() => {
                    window.location.href = destination;
                }, 750);
            });
        });

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            requestAnimationFrame(() => {
                document.body.offsetHeight; // Force layout paint frame
                requestAnimationFrame(() => {
                    masterHeader.classList.remove('is-header-lifted');
                    universalTargetLinks.forEach(l => {
                        l.classList.remove('is-wave-loading');
                        l.classList.remove('kinetic-locked-frame');
                        const span = l.querySelector('.nav-text');
                        if (span) {
                            span.style.transform = '';
                            span.style.opacity = '';
                            span.style.background = '';
                            span.style.webkitBackgroundClip = '';
                            span.style.webkitTextFillColor = '';
                        }
                    });
                });
            });

            const savedTargetUrl = sessionStorage.getItem('activeUniversalTargetUrl');
            if (savedTargetUrl) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
            }
        });
    </script>
