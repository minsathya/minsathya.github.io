    <script>
        // --- Universal Persistent Master Breadcrumb Engine ---
        (function buildDynamicBreadcrumbs() {
            const container = document.getElementById('dynamicBreadcrumbNav');
            if (!container) return;

            const searchPath = window.location.pathname;
            const HOME_PATH = "/study/index.html";

            const pageNames = {
                "/study/index.html": "Home",
                "/study/csat.html": "CSAT",
                "/study/ncert.html": "NCERT",
                "/study/subjects.html": "Subjects",
                "/study/currentaffairs.html": "Current Affairs",
                "/study/ramsarsites.html": "Ramsar Sites",
                "/study/search.html": "Search",
                "/study/Footer/about.html": "About",
                "/study/Footer/contact.html": "Contact",
                "/study/Footer/privacy.html": "Privacy Policy",
                "/study/Footer/terms.html": "Terms & Conditions",
                "/study/Footer/disclaimer.html": "Disclaimer"
            };

            let currentPageName = pageNames[searchPath];
            if (!currentPageName) {
                const filename = searchPath.substring(searchPath.lastIndexOf('/') + 1).replace('.html', '');
                currentPageName = filename.charAt(0).toUpperCase() + filename.slice(1);
            }

            let trail = [];
            try {
                const stored = sessionStorage.getItem('breadcrumbTrail');
                trail = stored ? JSON.parse(stored) : [];
            } catch (e) {
                trail = [];
            }

            if (trail.length === 0 || (trail[0].path !== HOME_PATH && trail[0].path !== "/study/")) {
                trail = [{ name: "Home", path: HOME_PATH }];
            }

            const existingIndex = trail.findIndex(step => step.path === searchPath);

            if (existingIndex !== -1) {
                trail = trail.slice(0, existingIndex + 1);
            } else {
                if (searchPath !== HOME_PATH && searchPath !== "/study/") {
                    trail.push({ name: currentPageName, path: searchPath });
                }
            }

            try {
                sessionStorage.setItem('breadcrumbTrail', JSON.stringify(trail));
            } catch (e) {}

            let htmlMarkup = '';
            trail.forEach((step) => {
                if (step.path === searchPath) {
                    htmlMarkup += `<span class="current">${step.name}</span><span class="separator">/</span>`;
                } else {
                    htmlMarkup += `<a href="${step.path}">${step.name}</a><span class="separator">/</span>`;
                }
            });

            if (htmlMarkup.endsWith('<span class="separator">/</span>')) {
                htmlMarkup = htmlMarkup.slice(0, -'<span class="separator">/</span>'.length);
            }

            container.innerHTML = htmlMarkup;
        })();

            try {
                const activeOverride = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
                const isLight = activeOverride ? (activeOverride === 'light') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
                if (isLight) {
                    if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.add('light-mode');
                    document.documentElement.classList.add('light-mode');
                } else {
                    if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.remove('light-mode');
                    document.documentElement.classList.remove('light-mode');
                }
            } catch(e) {}
        }
        applyTargetPalette();

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
                const hasManualTheme = localStorage.getItem('dashboard-theme') || sessionStorage.getItem('dashboard-theme');
                if (!hasManualTheme) {
                    if (e.matches) {
                        if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.add('light-mode');
                        document.documentElement.classList.add('light-mode');
                    } else {
                        if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.remove('light-mode');
                        document.documentElement.classList.remove('light-mode');
                    }
                }
            });
        }

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isCurrentlyLight = document.documentElement.classList.contains('light-mode') || (typeof bodyElement !== 'undefined' && bodyElement && bodyElement.classList.contains('light-mode'));
            if (isCurrentlyLight) {
                if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.remove('light-mode');
                document.documentElement.classList.remove('light-mode');
                localStorage.setItem('dashboard-theme', 'dark');
                sessionStorage.setItem('dashboard-theme', 'dark');
            } else {
                if (typeof bodyElement !== 'undefined' && bodyElement) bodyElement.classList.add('light-mode');
                document.documentElement.classList.add('light-mode');
                localStorage.setItem('dashboard-theme', 'light');
                sessionStorage.setItem('dashboard-theme', 'light');
            }
        });

        openSearchBtn.addEventListener('click', () => {
            masterHeader.classList.remove('state-main');
            masterHeader.classList.add('state-search');
            searchCoreInput.focus({ preventScroll: true });
        });

        clearSearchBtn.addEventListener('click', () => {
            searchCoreInput.value = "";
            searchCoreInput.focus();
        });

        closeSearchBtn.addEventListener('click', () => {
            masterHeader.classList.remove('state-search');
            masterHeader.classList.add('state-main');
        });

        searchCoreInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && searchCoreInput.value.trim() === "") {
                masterHeader.classList.remove('state-search');
                masterHeader.classList.add('state-main');
            }
        });

                function transitionToFooterPage(destination, pushHistory = true) {
            const main = document.querySelector('main');
            if (!main) {
                window.location.href = destination;
                return;
            }

            main.style.transition = 'transform 0.16s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.16s ease-out';
            main.style.transform = 'translate3d(0, -16px, 0)';
            main.style.opacity = '0';

            fetch(destination)
                .then(res => {
                    if (!res.ok) throw new Error('Fetch failed');
                    return res.text();
                })
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const newMain = doc.querySelector('main');
                    if (!newMain) {
                        window.location.href = destination;
                        return;
                    }

                    document.title = doc.title;

                    setTimeout(() => {
                        main.innerHTML = newMain.innerHTML;
                        document.body.classList.add('footer-page');

                        document.querySelectorAll('.footer-links-row a').forEach(a => {
                            const href = a.getAttribute('href');
                            const isMatch = href && (destination.endsWith(href) || destination.endsWith(href.replace('/study/Footer/', '')));
                            if (isMatch) {
                                a.classList.add('active-footer-page');
                            } else {
                                a.classList.remove('active-footer-page');
                            }
                        });

                        if (pushHistory) {
                            history.pushState({ footerUrl: destination }, '', destination);
                        }

                        main.style.transition = 'none';
                        main.style.transform = 'translate3d(0, 30px, 0)';
                        main.style.opacity = '0';
                        void main.offsetWidth;

                        main.style.transition = 'transform 0.42s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.42s cubic-bezier(0.16, 1, 0.3, 1)';
                        main.style.transform = 'translate3d(0, 0, 0)';
                        main.style.opacity = '1';

                        window.scrollTo(0, 0);
                    }, 160);
                })
                .catch(() => {
                    window.location.href = destination;
                });
        }

        window.addEventListener('popstate', () => {
            if (window.location.pathname.includes('/study/Footer/')) {
                transitionToFooterPage(window.location.pathname, false);
            }
        });

const universalTargetLinks = document.querySelectorAll('.breadcrumbs a, .footer-links-row a, .logo');

        universalTargetLinks.forEach(link => {
            if (!link.querySelector('.nav-text')) {
                const wrapper = document.createElement('span');
                wrapper.className = 'nav-text';
                while (link.firstChild) {
                    wrapper.appendChild(link.firstChild);
                }
                link.appendChild(wrapper);
            }
        });

        universalTargetLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (!destination || destination === '#' || this.classList.contains('active-footer-page')) return;

                e.preventDefault();

                if (destination.includes('/study/Footer/')) {
                    transitionToFooterPage(destination, true);
                } else {
                    window.location.href = destination;
                }
            });
        });

        function handleEmailClick(e) {
            if (e) e.preventDefault();
            const email = 'iminsathya@gmail.com';
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (isMobile) {
                window.location.href = 'mailto:' + email;
            } else {
                const gmailUrl = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email);
                const win = window.open(gmailUrl, '_blank');
                if (!win || win.closed || typeof win.closed === 'undefined') {
                    window.location.href = 'mailto:' + email;
                }
            }
        }
        window.handleEmailClick = handleEmailClick;

        window.addEventListener('pageshow', () => {
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            universalTargetLinks.forEach(l => {
                l.classList.remove('is-wave-loading');
                l.classList.remove('kinetic-locked-frame');
                const span = l.querySelector('.nav-text');
                if (span) {
                    span.style.transform = '';
                    span.style.opacity = '';
                    span.style.background = '';
                    span.style.webkitBackgroundClip = '';
                    span.style.webkitTextFillColor = '';
                }
            });

            const savedTargetUrl = sessionStorage.getItem('activeUniversalTargetUrl');
            if (savedTargetUrl) {
                sessionStorage.removeItem('activeUniversalTargetUrl');
            }
        });
    </script>
